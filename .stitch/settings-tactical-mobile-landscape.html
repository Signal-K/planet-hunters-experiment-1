<style>
        .cyber-bracket { position: relative; }
        .cyber-bracket::before, .cyber-bracket::after {
            content: ''; position: absolute; width: 8px; height: 8px; border: 1px solid #bec6e1; transition: all 0.2s;
        }
        .cyber-bracket::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        .cyber-bracket::after { bottom: 0; right: 0; border-left: none; border-top: none; }
        .glow-border { box-shadow: 0 0 4px rgba(190,198,225,0.5); border: 1px solid #bec6e1; }
        .grid-bg { background-image: linear-gradient(#1b1b1d 1px, transparent 1px), linear-gradient(90deg, #1b1b1d 1px, transparent 1px); background-size: 20px 20px; }
        
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 12px;
            background: #bec6e1;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(190,198,225,0.8);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #353436;
            border: 1px solid #45464d;
        }
        
        .toggle-checkbox:checked {
            right: 0;
            border-color: #bec6e1;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #bec6e1;
        }
        .toggle-checkbox:checked + .toggle-label:after {
            transform: translateX(100%);
            background-color: #131315;
        }
