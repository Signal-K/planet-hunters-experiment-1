version: "3.9"

services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: planet-hunters-sandbox:local
    environment:
      DISPLAY: ":99"
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"
      GODOT_DISABLE_ZIVA_AGENT: "1"
      GALLIUM_DRIVER: "softpipe"
      MESA_GL_VERSION_OVERRIDE: "3.3"
      MESA_GLSL_VERSION_OVERRIDE: "330"
    ports:
      - "5900:5900"   # VNC (any VNC client, e.g. TigerVNC)
      - "6080:6080"   # noVNC browser viewer → http://localhost:6080/vnc.html
    volumes:
      - ./scene:/app/scene:ro
      - ./sandbox/output:/output
    shm_size: "256mb"
    restart: "no"
