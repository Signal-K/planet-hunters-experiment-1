<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rocket Assembly HUD</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;700&amp;family=Space+Grotesk:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Font mappings to match config */
        .font-spaceGrotesk { font-family: 'Space Grotesk', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-Monospace { font-family: 'JetBrains Mono', monospace; }
        
        /* Hide scrollbar for HUD feel */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<!-- Tailwind Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface": "#131315",
                    "on-secondary": "#232f4f",
                    "on-primary-container": "#777f98",
                    "on-primary-fixed": "#131b2f",
                    "tertiary-container": "#221200",
                    "tertiary": "#e2c19c",
                    "primary-container": "#0d1529",
                    "on-background": "#e4e2e4",
                    "background": "#131315",
                    "on-secondary-fixed": "#0d1a39",
                    "surface-container-highest": "#353436",
                    "secondary": "#bac5ed",
                    "primary": "#bec6e1",
                    "on-error": "#690005",
                    "on-secondary-fixed-variant": "#3a4667",
                    "inverse-surface": "#e4e2e4",
                    "error": "#ffb4ab",
                    "surface-container-low": "#1b1b1d",
                    "outline": "#909097",
                    "secondary-fixed-dim": "#bac5ed",
                    "on-tertiary-fixed-variant": "#594326",
                    "surface-container": "#1f1f21",
                    "primary-fixed": "#dae2fe",
                    "surface-container-high": "#2a2a2b",
                    "tertiary-fixed": "#ffddb7",
                    "tertiary-fixed-dim": "#e2c19c",
                    "surface-bright": "#39393b",
                    "on-secondary-container": "#abb7df",
                    "on-primary-fixed-variant": "#3f465d",
                    "outline-variant": "#45464d",
                    "surface-tint": "#bec6e1",
                    "surface-container-lowest": "#0e0e10",
                    "on-surface-variant": "#c6c6cd",
                    "on-tertiary-container": "#967b5a",
                    "surface-variant": "#353436",
                    "secondary-container": "#3c486a",
                    "primary-fixed-dim": "#bec6e1",
                    "on-surface": "#e4e2e4",
                    "inverse-on-surface": "#303032",
                    "on-primary": "#283045",
                    "error-container": "#93000a",
                    "on-error-container": "#ffdad6",
                    "on-tertiary-fixed": "#291802",
                    "surface-dim": "#131315",
                    "secondary-fixed": "#dae2ff",
                    "inverse-primary": "#565e75",
                    "on-tertiary": "#402d12"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "inner-padding": "12px",
                    "container-padding": "24px",
                    "module-gap": "16px"
            },
            "fontFamily": {
                    "label-bold": [
                            "Space Grotesk"
                    ],
                    "data-mono": [
                            "JetBrains Mono"
                    ],
                    "body-standard": [
                            "Inter"
                    ],
                    "display-data": [
                            "JetBrains Mono"
                    ],
                    "ui-header": [
                            "Space Grotesk"
                    ]
            },
            "fontSize": {
                    "label-bold": [
                            "14px",
                            {
                                    "lineHeight": "1.2",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "700"
                            }
                    ],
                    "data-mono": [
                            "12px",
                            {
                                    "lineHeight": "1.5",
                                    "letterSpacing": "0.02em",
                                    "fontWeight": "400"
                            }
                    ],
                    "body-standard": [
                            "14px",
                            {
                                    "lineHeight": "1.6",
                                    "letterSpacing": "0",
                                    "fontWeight": "400"
                            }
                    ],
                    "display-data": [
                            "40px",
                            {
                                    "lineHeight": "1.1",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "ui-header": [
                            "18px",
                            {
                                    "lineHeight": "1.2",
                                    "letterSpacing": "0.01em",
                                    "fontWeight": "700"
                            }
                    ]
            }
    },
        },
      }
    </script>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex font-body-standard text-body-standard relative select-none">
<!-- Atmospheric Background Image -->
<div class="absolute inset-0 z-0 opacity-10 bg-cover bg-center mix-blend-screen" data-alt="A vast, deep space environment viewed from a high-tech command center. The cosmos is filled with a dense field of distant, glowing stars and subtle nebulae in hues of midnight blue and dark slate. The scene is cold, precise, and technologically advanced, conveying a sense of immense scale and quiet tension before a major orbital launch. Lighting is dramatic, with the bright pinpricks of stars contrasting against the void." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAQfq-4sNLEsxDcF1yXnVTq7maf6vuedtUUy3a7HzypAVqhPrMD5OHNqLBQkt9DXvlz9LChx8oLA3w3t59oDWhk8AvUbBbCknLZy2M6xZCVwyYHwYmxCEmFYkySEiFn4EBHhQVLOxBG_T8dfrdwS6cZe2YeuOWUtKRqJElELgR5zjOVmJ796ASRwZ4M9Nj4wqr7vRhi7Q3cgjOBKlbbiL6BuUdyafC4Cok-gAD7Ne68R-JRFs-qW6Kl9W2L3pi1nUVfNIihGmOiigw');">
</div>
<!-- Grid Overlay for HUD feel -->
<div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none" style="background-image: linear-gradient(to right, #bec6e1 1px, transparent 1px), linear-gradient(to bottom, #bec6e1 1px, transparent 1px); background-size: 40px 40px;">
</div>
<!-- SHARED COMPONENT: TopNavBar -->
<nav class="fixed top-0 left-0 w-full flex justify-between items-center px-6 h-16 z-50 backdrop-blur-md bg-slate-950/80 text-sky-400 font-space-grotesk tracking-widest uppercase border-b border-sky-900/50 shadow-[0_0_8px_rgba(56,189,248,0.2)]">
<div class="flex items-center gap-6">
<button class="flex items-center justify-center hover:bg-sky-400/10 hover:text-sky-200 active:scale-95 transition-all duration-150 p-2 rounded">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="text-xl font-bold text-sky-400 tracking-[0.2em]">ROCKET ASSEMBLY HUD</div>
</div>
<div class="flex items-center gap-2">
<button class="flex items-center justify-center hover:bg-sky-400/10 hover:text-sky-200 active:scale-95 transition-all duration-150 p-2 rounded">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<button class="flex items-center justify-center hover:bg-sky-400/10 hover:text-sky-200 active:scale-95 transition-all duration-150 p-2 rounded">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
</div>
</nav>
<!-- SHARED COMPONENT: SideNavBar -->
<aside class="fixed left-0 top-16 h-full w-64 border-r border-sky-900/50 bg-slate-950/90 flex flex-col py-8 z-40 text-sky-400 font-mono text-xs uppercase tracking-tighter">
<div class="px-6 mb-8">
<div class="font-black text-sky-400 text-lg mb-1">COMMAND_UNIT</div>
<div class="text-sky-700">ASSEMBLY_SYS_v4.2</div>
</div>
<div class="flex flex-col">
<!-- Active Tab -->
<button class="flex items-center gap-3 bg-sky-400/20 text-sky-200 border-l-4 border-sky-400 px-4 py-3 w-full text-left transition-colors duration-200">
<span class="material-symbols-outlined text-[18px]" data-icon="rocket_launch">rocket_launch</span>
                Prebuilt Rockets
            </button>
<!-- Inactive Tab -->
<button class="flex items-center gap-3 text-sky-700 px-4 py-3 hover:bg-sky-400/5 hover:text-sky-300 w-full text-left transition-colors duration-200">
<span class="material-symbols-outlined text-[18px]" data-icon="settings_input_component">settings_input_component</span>
                Modular Parts
            </button>
</div>
</aside>
<!-- MAIN CANVAS -->
<main class="ml-64 mt-16 p-container-padding w-full h-[calc(100vh-64px)] relative z-10 flex flex-col">
<!-- Status Header row -->
<div class="flex justify-between items-start w-full mb-8">
<!-- Launch Status Chip (Custom green as requested, blending with HUD style) -->
<div class="border border-[#4ade80] bg-[#4ade80]/10 px-4 py-2 font-data-mono text-data-mono text-[#4ade80] uppercase tracking-widest shadow-[0_0_12px_rgba(74,222,128,0.3)] flex items-center gap-3 backdrop-blur-sm">
<div class="w-2 h-2 bg-[#4ade80] rounded-full animate-pulse shadow-[0_0_8px_rgba(74,222,128,0.8)]"></div>
                ASSEMBLED — READY TO LAUNCH
            </div>
<!-- Telemetry Summary -->
<div class="flex gap-4">
<div class="border border-outline bg-surface-container-low/80 px-4 py-2 font-data-mono text-data-mono flex flex-col items-end min-w-[120px]">
<span class="text-on-surface-variant text-[10px]">SYS.INTEGRITY</span>
<span class="text-primary font-bold">100%</span>
</div>
<div class="border border-outline bg-surface-container-low/80 px-4 py-2 font-data-mono text-data-mono flex flex-col items-end min-w-[120px]">
<span class="text-on-surface-variant text-[10px]">FUEL.LOAD</span>
<span class="text-primary font-bold">NOMINAL</span>
</div>
</div>
</div>
<!-- Central Display Area -->
<div class="flex-1 flex justify-center items-center relative">
<!-- Rocket Container (The Centerpiece) -->
<div class="relative flex flex-col items-center justify-end h-[80%] max-h-[600px] w-64 group">
<!-- Schematic Lines / Background framing -->
<div class="absolute inset-0 border-l border-r border-outline/20 pointer-events-none"></div>
<div class="absolute top-1/2 left-[-100px] right-[-100px] border-t border-outline/10 pointer-events-none"></div>
<!-- Command Module (Top) -->
<div class="relative z-10 w-24 h-32 border-2 border-primary bg-primary-container/40 shadow-[0_0_20px_rgba(190,198,225,0.4)] flex flex-col items-center justify-end pb-2 mb-1" style="clip-path: polygon(50% 0%, 100% 100%, 0% 100%);">
<div class="w-8 h-2 border border-primary/50 mb-4 bg-primary/20"></div>
<div class="w-12 h-1 bg-primary/80 shadow-[0_0_5px_rgba(190,198,225,1)]"></div>
</div>
<!-- Fuel Tank (Middle) -->
<div class="relative z-10 w-32 h-64 border-2 border-primary bg-primary-container/30 shadow-[0_0_25px_rgba(190,198,225,0.3)] flex flex-col justify-between p-3 mb-1">
<!-- Internal details -->
<div class="w-full border-b border-primary/30 pb-2 flex justify-between font-data-mono text-[10px] text-primary">
<span>L-OX</span><span>98%</span>
</div>
<div class="flex-1 border-x border-primary/20 mx-2 my-2 relative">
<!-- Liquid level indicator -->
<div class="absolute bottom-0 left-0 w-full h-[98%] bg-primary/10 border-t border-primary/50"></div>
</div>
<div class="w-full border-t border-primary/30 pt-2 flex justify-between font-data-mono text-[10px] text-primary">
<span>RP-1</span><span>100%</span>
</div>
</div>
<!-- Engine Section (Bottom) -->
<div class="relative z-10 w-40 h-24 border-2 border-primary bg-primary-container/40 shadow-[0_0_30px_rgba(190,198,225,0.5)] flex flex-col justify-start items-center pt-2" style="clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);">
<div class="w-24 h-4 border border-primary/50 bg-primary/20 mb-2"></div>
<div class="flex gap-2 w-full justify-center px-4 mt-auto pb-2">
<!-- Thruster Bells -->
<div class="w-8 h-10 border border-primary bg-surface shadow-[0_4px_15px_rgba(190,198,225,0.6)]" style="clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);"></div>
<div class="w-8 h-10 border border-primary bg-surface shadow-[0_4px_15px_rgba(190,198,225,0.6)]" style="clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);"></div>
<div class="w-8 h-10 border border-primary bg-surface shadow-[0_4px_15px_rgba(190,198,225,0.6)]" style="clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);"></div>
</div>
</div>
<!-- Glowing Base effect -->
<div class="absolute -bottom-8 w-64 h-16 bg-primary/20 blur-2xl rounded-full z-0 pointer-events-none"></div>
<!-- Data Callouts anchored to Rocket -->
<div class="absolute left-full ml-8 top-[20%] w-48 border border-outline bg-surface/80 p-3 font-data-mono text-data-mono">
<!-- Corner Brackets -->
<div class="absolute -top-[1px] -left-[1px] w-2 h-2 border-t border-l border-primary"></div>
<div class="absolute -top-[1px] -right-[1px] w-2 h-2 border-t border-r border-primary"></div>
<div class="absolute -bottom-[1px] -left-[1px] w-2 h-2 border-b border-l border-primary"></div>
<div class="absolute -bottom-[1px] -right-[1px] w-2 h-2 border-b border-r border-primary"></div>
<div class="text-primary border-b border-outline/50 pb-1 mb-2">CMD_MODULE_XT</div>
<div class="flex justify-between text-on-surface-variant"><span>LIFE_SUP</span><span class="text-on-surface">ACTV</span></div>
<div class="flex justify-between text-on-surface-variant"><span>COMMS</span><span class="text-on-surface">ENCR</span></div>
</div>
</div>
</div>
<!-- Bottom Actions Row -->
<div class="flex justify-between items-end mt-auto pt-8 border-t border-outline/20">
<!-- Secondary Data -->
<div class="font-data-mono text-data-mono text-on-surface-variant flex flex-col gap-1">
<span>ESTIMATED PAYLOAD: <span class="text-primary">12,400 KG</span></span>
<span>TARGET ORBIT: <span class="text-primary">LEO-SYNC</span></span>
</div>
<!-- Primary Action Button -->
<button class="relative group border border-primary bg-primary/5 hover:bg-primary/15 transition-all duration-300 px-8 py-4 flex items-center gap-4 font-label-bold text-label-bold uppercase text-primary shadow-[0_0_15px_rgba(190,198,225,0.3)] hover:shadow-[0_0_25px_rgba(190,198,225,0.6)]">
<!-- Corner accents -->
<div class="absolute -top-[1px] -left-[1px] w-2 h-2 border-t-2 border-l-2 border-primary"></div>
<div class="absolute -bottom-[1px] -right-[1px] w-2 h-2 border-b-2 border-r-2 border-primary"></div>
                
                INITIATE LAUNCH SEQUENCE
                <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
</body></html>
