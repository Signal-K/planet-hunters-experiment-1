<body class="bg-background text-on-surface h-screen w-screen overflow-hidden">
<!-- Background Environment -->
<div class="fixed inset-0 z-0 bg-gradient-to-b from-[#000000] via-[#0D1529] to-[#0E1B3A]">

<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-sky-400 cursor-pointer hover:bg-sky-400/10 transition-all duration-200">arrow_back</span>
<h1 class="font-['Space_Grotesk'] font-bold tracking-[0.2em] uppercase text-xs text-sky-400">BUILD ROCKET</h1>
</div>
</header>

</div>
<div class="font-ui-header text-[10px] text-sky-300 font-bold tracking-widest uppercase mb-2">APOLLO-X</div>
<div class="grid grid-cols-2 gap-y-1">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[10px] text-on-primary-container">speed</span>
<span class="font-data-mono text-[9px] text-on-surface">MACH 12</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[10px] text-on-primary-container">package</span>
<span class="font-data-mono text-[9px] text-on-surface">45T</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[10px] text-on-primary-container">distance</span>

</div>
</div>
</div>

<div class="grid grid-cols-2 gap-y-1">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[10px] text-on-primary-container">speed</span>
<span class="font-data-mono text-[9px] text-on-surface-variant">MACH 8</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[10px] text-on-primary-container">package</span>

</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[10px] text-on-primary-container">distance</span>

</div>
</div>
</div>

<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[10px] text-on-primary-container">speed</span>

</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[10px] text-on-primary-container">distance</span>
<span class="font-data-mono text-[9px] text-on-surface-variant">25k KM</span>
</div>
</div>
</div>
</div>
</section>

<div class="absolute -top-64 left-0 w-12 h-64 border-r-2 border-dashed border-sky-900/20"></div>
<div class="absolute -top-64 right-0 w-12 h-64 border-l-2 border-dashed border-sky-900/20"></div>

<div class="absolute -top-1 left-4 w-1.5 h-1.5 bg-orange-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(249,115,22,0.8)]"></div>
<div class="absolute -top-1 right-4 w-1.5 h-1.5 bg-orange-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(249,115,22,0.8)]"></div>
</div>
</div>

</div>

<div class="text-[10px] font-data-mono text-sky-400">LP-39A_FL</div>
</div>

                NEXT

</button>
