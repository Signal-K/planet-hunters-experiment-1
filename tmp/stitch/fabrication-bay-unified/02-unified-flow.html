        .material-symbols-outlined {

          font-weight: normal;
          font-style: normal;
          font-size: 24px;
          line-height: 1;
          letter-spacing: normal;
          text-transform: none;

          word-wrap: normal;

        /* Greeblie Background Pattern */
        .bg-grid-pattern {

                linear-gradient(to bottom, rgba(56, 161, 243, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Bracket Framing */
        .bracket-frame {
            position: relative;
        }
        .bracket-frame::before, .bracket-frame::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: #38a1f3; /* primary-container */
            border-style: solid;
        }
        .bracket-frame::before {
            top: 0;
            left: 0;
            border-width: 1px 0 0 1px;
        }
        .bracket-frame::after {
            bottom: 0;
            right: 0;
            border-width: 0 1px 1px 0;
        }
        
        /* Soft Glow */
        .glow-border {
            box-shadow: 0 0 8px rgba(56, 161, 243, 0.2);
        }

</div>

<div class="w-4 md:w-8 h-px bg-outline-variant shrink-0"></div>

<span class="material-symbols-outlined text-[20px]">rocket_launch</span>
<span class="font-label-caps text-[10px] md:text-xs">READY FOR LAUNCH</span>
</div>
</div>
<!-- Stats & Launch Action -->
<div class="flex items-center gap-6 md:gap-8 ml-6 shrink-0">
<div class="hidden sm:flex gap-6 border-r border-outline-variant/50 pr-6 md:pr-8">

</div>
