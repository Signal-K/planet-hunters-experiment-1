<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Fabrication Bay - Ship Assembly (Mobile Landscape)</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
        
        .material-symbols-outlined {
          font-family: 'Material Symbols Outlined';
          font-weight: normal;
          font-style: normal;
          font-size: 32px; /* Increased base icon size */
          line-height: 1;
          letter-spacing: normal;
          text-transform: none;
          display: inline-block;
          white-space: nowrap;
          word-wrap: normal;
          direction: ltr;
          -webkit-font-feature-settings: 'liga';
          -webkit-font-smoothing: antialiased;
        }

        /* Greeblie Background Pattern */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(56, 161, 243, 0.08) 2px, transparent 2px),
                linear-gradient(to bottom, rgba(56, 161, 243, 0.08) 2px, transparent 2px);
            background-size: 48px 48px; /* Larger grid for mobile */
        }

        /* Bracket Framing - Scaled up */
        .bracket-frame {
            position: relative;
        }
        .bracket-frame::before, .bracket-frame::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #38a1f3; /* primary-container */
            border-style: solid;
        }
        .bracket-frame::before {
            top: 0;
            left: 0;
            border-width: 2px 0 0 2px;
        }
        .bracket-frame::after {
            bottom: 0;
            right: 0;
            border-width: 0 2px 2px 0;
        }
        
        /* Soft Glow */
        .glow-border {
            box-shadow: 0 0 12px rgba(56, 161, 243, 0.3);
        }
        .glow-text-amber {
            text-shadow: 0 0 8px rgba(254, 179, 0, 0.6);
        }
        
        /* Hide scrollbar for clean look but allow scrolling */
        ::-webkit-scrollbar {
            display: none;
        }
        * {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script id="tailwind-config">

    darkMode: "class",

      extend: {
        "colors": {
                "on-surface-variant": "#bfc7d3",

                "on-secondary-fixed-variant": "#604100",
                "outline-variant": "#3f4751",
                "outline": "#89919d",
                "inverse-primary": "#00629e",
                "background": "#0c1322",
                "on-secondary-fixed": "#281900",
                "on-primary": "#003355",
                "on-error": "#690005",
                "on-background": "#dce2f8",
                "surface": "#0c1322",
                "surface-bright": "#32394a",
                "surface-dim": "#0c1322",
                "on-surface": "#dce2f8",
                "on-tertiary-fixed": "#131b2f",
                "surface-container-high": "#232a3a",
                "secondary-container": "#feb300",
                "primary-fixed": "#cfe5ff",
                "surface-container-highest": "#2e3445",
                "on-tertiary-container": "#2b3348",
                "error-container": "#93000a",
                "surface-container": "#191f2f",
                "primary": "#99cbff",
                "on-primary-container": "#003559",
                "error": "#ffb4ab",
                "on-primary-fixed": "#001d34",

                "tertiary-fixed-dim": "#bec6e1",

        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "unit": "4px",
                "gutter": "20px",
                "lg": "24px",
                "sm": "8px",
                "md": "16px",
                "xl": "48px",
                "panel-padding": "24px",
                "xs": "4px"
        },
        "fontFamily": {
                "body-md": [
                        "Space Grotesk"
                ],
                "label-caps": [

                "body-lg": [

                        "12px",

                "h2": [

</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container relative">
<main class="absolute inset-0 bg-grid-pattern overflow-y-auto overflow-x-hidden flex flex-row z-0 pb-32 px-8">
<!-- Left Side: Assembly Schematic -->
<div class="flex-1 flex flex-col items-center justify-center gap-8 py-8 pr-8 border-r-2 border-outline-variant/30">
<!-- Top Empty Slot -->
<button class="w-full max-w-md h-32 border-4 border-dashed border-outline-variant hover:border-primary-container transition-colors flex flex-col items-center justify-center gap-4 bg-surface-container-lowest/80 group rounded-lg shrink-0">
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors text-[48px]">add</span>
<span class="font-label-caps text-2xl text-outline group-hover:text-primary-container uppercase tracking-widest font-bold">DOCKING FRAME</span>
</button>
<!-- HULL-MK2 Docked -->
<div class="w-full max-w-md border-2 border-outline-variant bg-surface-container relative bracket-frame glow-border shrink-0 rounded-lg overflow-hidden flex flex-row h-48">
<div class="w-12 bg-surface-variant flex items-center justify-center border-r-2 border-outline-variant font-label-caps text-lg text-outline font-bold rotate-180 tracking-widest" style="writing-mode: vertical-rl;">HULL-MK2</div>
<div class="flex-1 bg-surface-variant flex items-center justify-center relative">
<span class="material-symbols-outlined text-[80px] text-outline/40">rocket</span>
</div>
<div class="w-48 p-6 border-l-2 border-outline-variant flex flex-col justify-center items-center bg-surface-container-high gap-4">
<span class="font-label-caps text-2xl text-primary-container font-bold text-center">HULL-MK2</span>
<span class="w-6 h-6 bg-[#4ade80] rounded-full shadow-[0_0_12px_#4ade80]"></span>
</div>
</div>
<!-- VULCAN-IX Docked & Selected -->
<div class="w-full max-w-md border-4 border-secondary-container bg-surface-container relative bracket-frame shadow-[0_0_20px_rgba(254,179,0,0.25)] cursor-pointer shrink-0 rounded-lg overflow-hidden flex flex-row h-48">
<div class="w-12 bg-surface-variant flex items-center justify-center border-r-4 border-secondary-container font-label-caps text-lg text-secondary-container glow-text-amber font-bold rotate-180 tracking-widest" style="writing-mode: vertical-rl;">VULCAN-IX</div>
<div class="flex-1 bg-surface-variant flex items-center justify-center relative">
<!-- Abstract representation of engine -->
<div class="w-3/4 h-3/4 border-4 border-secondary-container/30 rounded-full flex items-center justify-center">
<div class="w-1/2 h-1/2 bg-gradient-to-t from-secondary-container/60 to-transparent rounded-full blur-lg"></div>
</div>
</div>
<div class="w-48 p-6 border-l-4 border-secondary-container flex flex-col justify-center items-center bg-surface-container-high gap-4">
<span class="font-label-caps text-2xl text-secondary-container font-bold text-center">VULCAN-IX ENGINE</span>
<span class="material-symbols-outlined text-[36px] text-secondary-container">settings</span>
</div>
</div>
</div>
<!-- Right Side: Inspector & Actions -->
<div class="flex-1 flex flex-col gap-6 py-8 pl-8 justify-center">
<!-- Floating Header Info -->
<div class="bg-surface-container-lowest/90 backdrop-blur-md p-6 rounded-xl border-2 border-primary-container/40 glow-border flex items-center justify-between">
<div class="flex items-center gap-6">
<h1 class="font-h3 text-3xl text-primary-container uppercase tracking-widest font-bold m-0 leading-none">BUILD ROCKET</h1>
<div class="h-10 w-px bg-outline-variant mx-2"></div>
<div class="font-label-caps text-xl text-outline flex items-center gap-3 font-bold">
<span class="w-4 h-4 bg-secondary-container shadow-[0_0_12px_#feb300] rounded-full animate-pulse"></span>
        DOCKING BAY
    </div>
</div>
<div class="flex flex-col items-end">
<div class="text-base text-outline font-bold mb-1 font-label-caps">GRID COORD</div>
<div class="font-label-caps text-2xl text-tertiary font-bold tracking-wider">SEC-7 / ALFA</div>
</div>
</div>
<!-- Simplified Inspector Overlay -->
<div class="bg-surface-container-lowest/95 backdrop-blur-xl border-2 border-secondary-container/60 rounded-xl shadow-[0_0_30px_rgba(254,179,0,0.2)] flex flex-col overflow-hidden">
<div class="px-8 py-6 border-b-2 border-outline-variant/40 bg-surface-container-high flex justify-between items-center">
<h2 class="text-secondary-container font-h3 text-2xl tracking-tight font-bold m-0">VULCAN-IX INSPECTOR</h2>
</div>
<div class="p-8 flex flex-col gap-8">
<div class="flex flex-col gap-6">
<div class="flex justify-between items-end border-b-2 border-outline-variant/30 pb-4">
<span class="font-label-caps text-2xl text-outline font-bold tracking-wider">THRUST</span>
<span class="font-label-caps text-3xl text-primary-container font-bold">45,000 kN</span>
</div>
<div class="flex justify-between items-end border-b-2 border-outline-variant/30 pb-4">
<span class="font-label-caps text-2xl text-outline font-bold tracking-wider">PWR_DRAW</span>
<span class="font-label-caps text-3xl text-secondary-container font-bold">4.2 MW</span>
</div>
</div>
<button class="w-full py-6 mt-4 bg-secondary-container/20 border-2 border-secondary-container text-secondary-container font-label-caps text-2xl font-bold rounded-xl hover:bg-secondary-container/30 active:bg-secondary-container/40 transition-all flex items-center justify-center gap-4">
<span class="material-symbols-outlined text-[32px]">build</span>
            INSTALL MODULE
        </button>
</div>
</div>
</div>
</main>
<!-- Massive Footer (Mission Readiness) -->
<div class="absolute bottom-0 left-0 right-0 z-50 bg-surface-container-lowest/95 backdrop-blur-xl border-t-2 border-primary-container/50 shadow-[0_-10px_40px_rgba(0,0,0,0.9)] flex items-center justify-between px-8 py-6 h-32">
<div class="flex items-center gap-8 h-full">
<div class="font-h3 text-2xl text-primary-container uppercase tracking-wider flex items-center gap-4 font-bold bg-primary-container/10 px-8 py-4 rounded-xl border border-primary-container/30">
<span class="material-symbols-outlined text-[40px]">verified_user</span>
            MISSION READINESS
        </div>
<div class="flex gap-12 border-l-2 border-outline-variant/50 pl-12 h-full items-center">
<div class="flex flex-col justify-center">
<span class="font-label-caps text-lg text-outline font-bold mb-1">TOTAL MASS</span>
<span class="font-label-caps text-3xl text-on-surface font-bold">140 T</span>
</div>
<div class="flex flex-col justify-center">
<span class="font-label-caps text-lg text-outline font-bold mb-1">POWER DRAW</span>
<span class="font-label-caps text-3xl text-on-surface font-bold">12 MW</span>
</div>
<div class="flex flex-col justify-center">
<span class="font-label-caps text-lg text-outline font-bold mb-1">MINING OUTPUT</span>
<span class="font-label-caps text-3xl text-secondary-container font-bold">+20%</span>
</div>
</div>
</div>
<div class="flex items-center gap-8 h-full">
<button class="px-10 py-6 border-2 border-outline text-outline font-label-caps text-2xl font-bold rounded-xl active:bg-surface-variant transition-colors h-full flex items-center">
            CANCEL
        </button>
<button class="px-12 py-6 bg-primary-container text-on-primary-container font-label-caps text-2xl font-bold rounded-xl active:bg-primary-fixed active:scale-95 transition-all flex items-center gap-4 h-full shadow-[0_0_20px_rgba(56,161,243,0.3)]">
            NEXT <span class="material-symbols-outlined text-[36px]">arrow_forward</span>
</button>
</div>
</div>
</body></html>
