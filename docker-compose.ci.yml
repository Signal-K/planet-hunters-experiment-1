# Local CI parity — mirrors each GitHub Actions job exactly.
#
# Usage:
#   docker compose -f docker-compose.ci.yml run --rm web-unit    # Typecheck + unit tests + migration check
#   docker compose -f docker-compose.ci.yml run --rm web-build   # Next.js production build
#   docker compose -f docker-compose.ci.yml run --rm sandbox     # M1→M3 Cypress E2E suite
#   docker compose -f docker-compose.ci.yml run --rm seed-data   # RSpec tests + seed:import (mirrors seed-data.yml)
#
# Run all in sequence (same as CI):
#   docker compose -f docker-compose.ci.yml run --rm web-unit && \
#   docker compose -f docker-compose.ci.yml run --rm web-build && \
#   docker compose -f docker-compose.ci.yml run --rm sandbox && \
#   docker compose -f docker-compose.ci.yml run --rm seed-data

services:

  # Mirrors: Web CI / Typecheck & Unit Tests
  web-unit:
    image: node:20
    working_dir: /repo/web
    volumes:
      - ./web:/repo/web
      - ./pocketbase:/repo/pocketbase:ro
      - web_ci_nm:/repo/web/node_modules
    command: >
      sh -c "
        npm ci &&
        npm run typecheck &&
        npm run test:unit &&
        for f in /repo/pocketbase/pb_migrations/*.js; do
          node --check \"$$f\" && echo \"OK: $$f\" || exit 1;
        done
      "
    environment:
      CI: "true"

  # Mirrors: Web CI / Next.js Build Check
  web-build:
    image: node:20
    working_dir: /repo/web
    volumes:
      - ./web:/repo/web
      - web_ci_build_nm:/repo/web/node_modules
      - web_ci_next:/repo/web/.next
    command: sh -c "npm ci && npm run build"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SHARED_PB_URL: http://localhost:8090
      NEXT_PUBLIC_LANDNAM_PB_URL: http://localhost:8091
      CI: "true"

  # Mirrors: Mission Sandbox / M1→M3 Mission Flow Sandbox
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    volumes:
      - ./sandbox/output:/output
    shm_size: 256mb
    environment:
      CI: "true"

  # Mirrors: Seed Data Import / seed-data.yml (rspec + seed:import)
  seed-data:
    image: ruby:3.3
    working_dir: /repo/tools/ruby-asset-pipeline
    volumes:
      - ./tools/ruby-asset-pipeline:/repo/tools/ruby-asset-pipeline
      - ./backend/migrations:/repo/backend/migrations
      - seed_data_bundle:/usr/local/bundle
    command: >
      sh -c "
        bundle install &&
        bundle exec rspec spec/ &&
        bundle exec rake seed:import[catalog/astronomy.json,celestial_bodies]
      "
    environment:
      CI: "true"

volumes:
  web_ci_nm:
  web_ci_build_nm:
  web_ci_next:
  seed_data_bundle:
