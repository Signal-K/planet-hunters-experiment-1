# Landnam PocketBase backend
# Change the app name to something unique on Fly, then run:
#   make fly-setup-landnam   (first time only)
#   make deploy-landnam

app = "signal-k-landnam"
primary_region = "lhr"

[build]

# KES-149: runs once before the new version starts serving, on a temporary
# machine that gets this app's normal mounts. Without this, compiled .go
# app-migrations (core.AppMigrations, registered under pocketbase/migrations/)
# never execute — the container's serve command never calls `migrate up`
# itself, so migrations silently never ran on any prior deploy.
#
# Args only, not the binary path: Fly appends this string's tokens after the
# Dockerfile's ENTRYPOINT ["/pb/pocketbase"], so including the binary path
# again here duplicates it and fails with "unknown command '/pb/pocketbase'
# for 'pocketbase'" — confirmed the hard way on the first deploy of this
# release_command, which reported "completed successfully" despite the
# migration never actually running (cobra exits 0 on an unknown-subcommand
# usage error in this version). Don't trust that exit code alone next time —
# check `flyctl logs` for this migration's own log lines to confirm it ran.
[deploy]
  release_command = "migrate up --dir=/pb/pb_data"

[[mounts]]
  source      = "pb_data"
  destination = "/pb/pb_data"

[http_service]
  internal_port       = 8090
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  cpu_kind   = "shared"
  cpus       = 1
  memory_mb  = 256
