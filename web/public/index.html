<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Sailors: Experiment 1</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <style>
      :root {
        --bg-0: #05080f;
        --bg-1: #0d1320;
        --ink: #e7edf9;
        --muted: #a9b4cc;
        --edge: #233455;
        --accent: #4ad0ff;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 20% 0%, #17233b 0%, var(--bg-0) 46%, #020306 100%);
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .frame {
        border: 1px solid var(--edge);
        border-radius: 14px;
        overflow: hidden;
        background: linear-gradient(180deg, #0f1729, #090e19);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      }
      iframe {
        width: 100%;
        height: min(75vh, 860px);
        border: 0;
        display: block;
        background: #000;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 14px;
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 14px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: clamp(24px, 4vw, 38px);
        letter-spacing: 0.02em;
      }
      .pill {
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 6px 10px;
      }
      .ok {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Star Sailors: Experiment 1Planet Hunters Web</h1>
      <p class="meta">
        <span class="pill">Build: Godot Web</span>
        <span id="storage-status" class="pill">Storage: checking...</span>
        <span id="save-marker" class="pill">Progress marker: pending</span>
      </p>
      <div class="frame">
        <iframe
          id="game-frame"
          src="/game/index.html"
          title="Planet Hunters Game"
          allow="fullscreen"
        ></iframe>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
