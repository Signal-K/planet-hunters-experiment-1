<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Haphazard Martians</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a1a1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root { --bg:#2a1a1c; --fg:#faf0e6; --dim:#c8aa96; --accent:#ec783c; --panel:#42282a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; touch-action:none; overscroll-behavior:none; }
  #boot { position:fixed; inset:0; display:grid; place-items:center; text-align:center; letter-spacing:.15em; }
  #boot small { display:block; margin-top:.5em; color:var(--dim); letter-spacing:0; }
  #acct { position:fixed; top:max(8px,env(safe-area-inset-top)); right:max(8px,env(safe-area-inset-right)); z-index:10;
    background:rgba(42,26,28,.85); color:var(--fg); border:1px solid var(--dim); border-radius:6px; padding:6px 10px; font:inherit; font-size:13px; cursor:pointer; }
  dialog { background:var(--panel); color:var(--fg); border:1px solid var(--dim); border-radius:10px; padding:20px; width:min(340px,90vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h2 { margin:0 0 4px; font-size:20px; }
  dialog p { margin:0 0 12px; color:var(--dim); font-size:13px; }
  dialog label { display:block; font-size:13px; color:var(--dim); margin-top:10px; }
  dialog input { width:100%; box-sizing:border-box; margin-top:4px; padding:10px; font:inherit; border-radius:6px; border:1px solid var(--dim); background:#2a1a1c; color:var(--fg); }
  .row { display:flex; gap:8px; margin-top:16px; }
  .row button { flex:1; padding:10px; font:inherit; border-radius:6px; border:1px solid var(--dim); background:var(--bg); color:var(--fg); cursor:pointer; }
  .row button.primary { background:var(--accent); border-color:var(--accent); color:#1a0f10; font-weight:600; }
  [hidden] { display:none !important; }
  #msg.note { color:var(--dim); }
  #msg { min-height:1.2em; margin-top:10px; font-size:13px; color:#ff786e; }
  /* The game is landscape; on a phone held upright it would be a thin strip. */
  #rotate { position:fixed; inset:0; z-index:20; display:none; place-items:center; text-align:center; padding:24px;
    background:var(--bg); }
  #rotate svg { width:96px; height:96px; animation:tilt 2.4s ease-in-out infinite; }
  #rotate h2 { margin:20px 0 6px; font-size:22px; }
  #rotate p { margin:0 0 20px; color:var(--dim); font-size:15px; }
  #rotate button { min-height:44px; padding:10px 18px; font:inherit; border-radius:6px; border:1px solid var(--dim);
    background:transparent; color:var(--fg); cursor:pointer; }
  @keyframes tilt { 0%,25% { transform:rotate(0) } 50%,75% { transform:rotate(-90deg) } 100% { transform:rotate(0) } }
  @media (orientation:portrait) and (pointer:coarse) { #rotate:not(.dismissed) { display:grid; } }
</style>
</head>
<body>
<div id="boot">HAPHAZARD MARTIANS<small id="bootmsg">Loading…</small></div>
<button id="acct" type="button">Sign in</button>
<div id="rotate" role="dialog" aria-labelledby="rotatetitle">
  <div>
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="18" y="4" width="28" height="56" rx="5" fill="none" stroke="#ec783c" stroke-width="4"/><circle cx="32" cy="52" r="2.5" fill="#ec783c"/></svg>
    <h2 id="rotatetitle">Turn your phone sideways</h2>
    <p>The rover bay and the drive need the whole width.</p>
    <button type="button" id="rotateskip">Play upright anyway</button>
  </div>
</div>
<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgtitle">Sign in</h2>
    <p>Optional. Use your Star Sailors account (the one you use for Landnam). Signing in saves your runs.</p>
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label id="codewrap" hidden>Code from the email<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label>
    <label id="pwlabel">Password<input id="pw" type="password" autocomplete="current-password" minlength="8" required></label>
    <div id="clerk-captcha"></div>
    <div id="msg" role="alert"></div>
    <div class="row">
      <button type="button" id="signup">Create account</button>
      <button type="submit" class="primary" id="signin" value="signin">Sign in</button>
    </div>
    <div class="row"><button type="button" id="forgot">Forgot password?</button><button type="button" id="close">Close</button></div>
  </form>
</dialog>
<script src="config.js"></script>
<script src="host.js"></script>
<script src="wasm_exec.js"></script>
<script>
const cfg = window.HM_CONFIG || {};
document.getElementById('rotateskip').addEventListener('click', () => document.getElementById('rotate').classList.add('dismissed'));
(async () => {
  const msg = document.getElementById('bootmsg');
  try {
    const go = new Go();
    let inst;
    if (cfg.wasmGzip) {
      // Hosts with a small per-file limit (or a git repo) ship the wasm gzipped
      // as game.wasm.gz (not *.wasm: Wrangler would try to compile it into the
      // Worker); it is unpacked here. Needs DecompressionStream. If the host
      // already decoded it (Content-Encoding), it arrives as plain wasm.
      const res = await fetch(cfg.wasm || 'game.wasm.gz');
      if (!res.ok) throw new Error('download failed (' + res.status + ')');
      let buf = await res.arrayBuffer();
      const b = new Uint8Array(buf, 0, 2);
      if (b[0] === 0x1f && b[1] === 0x8b) {
        buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
      }
      inst = await WebAssembly.instantiate(buf, go.importObject);
    } else {
      const wasm = cfg.wasm || 'game.wasm';
      try {
        inst = await WebAssembly.instantiateStreaming(fetch(wasm), go.importObject);
      } catch (e) { // wrong MIME type or no streaming support
        const buf = await (await fetch(wasm)).arrayBuffer();
        inst = await WebAssembly.instantiate(buf, go.importObject);
      }
    }
    document.getElementById('boot').remove();
    await go.run(inst.instance);
  } catch (e) {
    msg.textContent = 'Could not start: ' + e.message;
    console.error(e);
  }
})();
// sw: false where the game shares an origin with another app (Landnam): its
// cache cleanup would delete that app's caches.
// A string names the host app's own worker instead (Landnam's /sw.js). That
// worker does not precache the game, so once it controls this page the shell
// is fetched again through it, and the first online visit is enough to play
// offline afterwards.
if (cfg.sw !== false && 'serviceWorker' in navigator) {
  const own = typeof cfg.sw !== 'string';
  navigator.serviceWorker.register(own ? 'sw.js' : cfg.sw).then(async () => {
    if (own) return; // the game's sw.js precaches its shell on install
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise((ok) => navigator.serviceWorker.addEventListener('controllerchange', ok, { once: true }));
    }
    for (const f of [location.pathname, 'config.js', 'host.js', 'wasm_exec.js', cfg.wasm || 'game.wasm', 'manifest.webmanifest']) {
      await fetch(f).catch(() => {});
    }
  }).catch(() => {});
}
</script>
</body>
</html>
