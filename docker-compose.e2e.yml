services:
  shared-pb:
    image: ghcr.io/muchobien/pocketbase:0.39.0
    ports:
      - "18090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  landnam-pb:
    build:
      context: ./pocketbase
      args:
        POCKETBASE_VERSION: "0.39.0"
    environment:
      SHARED_PB_URL: http://shared-pb:8090
    ports:
      - "18091:8090"
    volumes:
      - pocketbase-e2e-data:/pb/pb_data
    depends_on:
      shared-pb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  next-app:
    build:
      context: ./web
      target: dev
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    environment:
      POCKETBASE_INTERNAL_URL: http://shared-pb:8090
      NEXT_PUBLIC_SHARED_PB_URL: http://shared-pb:8090
      NEXT_PUBLIC_LANDNAM_PB_URL: http://landnam-pb:8090
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3001"
    ports:
      - "13001:3001"
    depends_on:
      landnam-pb:
        condition: service_healthy

  cypress:
    image: cypress/included:15.16.0
    working_dir: /e2e
    environment:
      CYPRESS_baseUrl: http://next-app:3001
      CYPRESS_SHARED_PB_URL: http://shared-pb:8090
      CYPRESS_LANDNAM_PB_URL: http://landnam-pb:8090
      CYPRESS_POCKETBASE_URL: http://landnam-pb:8090
      CYPRESS_PROFILE: with-pb
    volumes:
      - ./cypress.docker.config.js:/e2e/cypress.config.js:ro
      - ./web/cypress:/e2e/cypress:ro
      - ./web/package.json:/e2e/package.json:ro
      - ./web/tsconfig.json:/e2e/tsconfig.json:ro
      - ./web/node_modules:/e2e/node_modules:ro
    depends_on:
      next-app:
        condition: service_started
    profiles: ["e2e"]

volumes:
  pocketbase-e2e-data:
  web_node_modules:
