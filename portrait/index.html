<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Landnam</title>
<link rel="stylesheet" href="./colors_and_type.css">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #03060c;
    color: var(--ln-text);
    font-family: var(--ln-font-body);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    /* fill safe area on notched phones */
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  #root {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }
  .canvas {
    background: var(--ln-bg);
    color: var(--ln-text);
    position: relative;
    overflow: hidden;
    isolation: isolate;
    width: 100%;
    height: 100%;
  }
  .scene {
    animation: scene-in 280ms var(--ln-ease-out);
    width: 100%; height: 100%;
  }
  @keyframes scene-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* hide internal scrollbars */
  .scene ::-webkit-scrollbar { display: none; }
  .scene * { scrollbar-width: none; }

  /* --- dev desktop preview frame --------------------------------- */
  /* On desktop (>480px wide) show the app inside a phone bezel     */
  @media (min-width: 481px) {
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      padding: 0;
    }
    #phone-frame {
      width: 390px;
      height: 844px;
      border-radius: 48px;
      overflow: hidden;
      box-shadow:
        0 0 0 12px #111,
        0 0 0 14px #333,
        0 40px 80px rgba(0,0,0,0.7);
      position: relative;
      flex-shrink: 0;
    }
    #root {
      border-radius: 36px;
      overflow: hidden;
    }
  }
</style>
</head>
<body>

<div id="phone-frame">
  <div id="root"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
        integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
        integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
        crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
        integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
        crossorigin="anonymous"></script>

<!-- Load order matters: data/icons/chrome must precede screens, app last -->
<script type="text/babel" src="./data.jsx"></script>
<script type="text/babel" src="./icons.jsx"></script>
<script type="text/babel" src="./chrome.jsx"></script>
<script type="text/babel" src="./screens-pre.jsx"></script>
<script type="text/babel" src="./screens-loop.jsx"></script>
<script type="text/babel" src="./app.jsx"></script>

<script type="text/babel" data-presets="env,react">
  function Mount() {
    const { LandnamApp } = window;
    return (
      <div className="canvas">
        <LandnamApp />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Mount />);
</script>

</body>
</html>
