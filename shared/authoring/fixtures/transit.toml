# Named setups for transit. Keep scene structure in scenes/transit.toml.

[[things]]
id = "telescope-flight"
label = "Telescope to Earth orbit"
group = "Destination"
exclusive = "destination"
note = "The story flight that carries the space telescope up."
state = { missionId = "story-transit-telescope-launch", targetId = "earth-orbit-transit-telescope", player = { activeMission = { id = "story-transit-telescope-launch", label = "Launch Space Telescope" } } }

[[things]]
id = "mercury"
label = "Mercury"
group = "Destination"
exclusive = "destination"
state = { targetId = "mercury" }

[[things]]
id = "mars"
label = "Mars"
group = "Destination"
exclusive = "destination"
state = { targetId = "mars" }

[[things]]
id = "eros"
label = "Eros"
group = "Destination"
exclusive = "destination"
default = true
state = { targetId = "eros" }

