#:schema ../schema/mission.schema.json
# Canonical client contract: a two-leg transport job (mine at the pickup, drop at a second target, fly home).
# Compiled into shared/missions/authored-missions.json. Web and native both build this mission from that file.
format = 1
id = "lnm_m3_relay_bennu_vesta"
title = "Belt Courier Run"
brief = "Atlas Aggregate needs iron and carbon lifted from Bennu, then dropped at their Vesta depot for off-world construction. Bulk metals like these are too plentiful on Earth to ship home, but Vesta has none. You're paid for both jobs: mining the ore and running the relay to Vesta."
tag = "TRANSPORT"
difficulty = "L1"
client = "atlas-aggregate"
locked = false
sequence = "transport"
unlock_at = "Complete 1 contract"
target = "bennu"
delivery_target = "vesta"
tickets = ["SSL-332"]

[requires]
cargo_min = 5
drill_tier = 1
max_orbit = 4

[requires.minerals]
iron = 3
carbon = 2

# Transport still pays the old contract fee: it is two jobs (mining plus relay) and needs a fresh single-use vehicle.
[payout]
floor_sequence = 3
affinity = 3

[preview]
route = "missions"
state = "transport-hub"

[harness]
scene = "belt-courier-run"
web = "transport-hub"
native = "transport-hub-live"
objective = "Mine the requested Bennu cargo and unload it at Vesta."
complete = "Cargo is delivered and the return debrief settles."
