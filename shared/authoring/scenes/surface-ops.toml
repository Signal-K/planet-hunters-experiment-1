#:schema ../schema/scene.schema.json
# On-Target Construction: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=surface-ops).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "surface-ops"
type = "field"
name = "On-Target Construction"
summary = "Building a structure on a target body rather than at the base."
qa = ["surface-ops"]

[runtime]
surface = "canvas"
web = ["web/components/game/screens/SurfaceOpsScreen.tsx", "web/components/game/screens/ConstructionTargetCanvas.tsx"]
native = ["native/App/Screens/SurfaceOpsScreen.swift"]
engine = ["web/public/game/scenes/construction-target.scene.json"]

[preview]
route = "surface-ops"
state = "ui-surface-ops"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "surface-world"
kind = "world"
layout = "host"
mechanics = ["surface-logistics"]
note = "Selected off-world site."

[[objects]]
id = "settlement-pads"
kind = "collection"
parent = "surface-world"
layout = "host"
mechanics = ["surface-logistics"]
note = "Physical launchpad construction sites."

[[objects]]
id = "settlement-structures"
kind = "collection"
parent = "surface-world"
layout = "host"
mechanics = ["surface-logistics"]
note = "Constructed structures and build progress."

[[objects]]
id = "ferry"
kind = "vehicle"
parent = "surface-world"
layout = "host"
mechanics = ["surface-logistics"]
note = "Cargo transport state, retry and reconciliation."

[[objects]]
id = "logistics-controls"
kind = "panel"
parent = "surface-world"
layout = "host"
mechanics = ["surface-logistics"]
note = "Site access, storage, build, dispatch and acknowledge."

[[objects]]
id = "field-world"
kind = "world"
layout = "host"
mechanics = ["field-engine", "sandbox"]
note = "Embedded TakeOn field, not a replacement for ship laser mining."

[[objects]]
id = "field-factory"
kind = "collection"
parent = "field-world"
layout = "host"
mechanics = ["field-refining"]
note = "Field-built structures and refinery pipeline; native field adapter pending."

[[objects]]
id = "site-deeds"
kind = "group"
parent = "surface-world"
layout = "host"
mechanics = ["site-rights"]
note = "Domain ownership for site purchases and leases. Not a separately rendered panel or just settlement access."

[[objects]]
id = "ownership-service"
kind = "group"
parent = "surface-world"
layout = "host"
mechanics = ["ownership"]
note = "Transfers of owned entities; no native equivalent identified."
