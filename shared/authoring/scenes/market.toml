#:schema ../schema/scene.schema.json
# Market: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=market).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "market"
type = "exchange-lab"
name = "Market"
summary = "Open-market sales with supply-driven price decay. A real building on the base, not a menu item."
qa = ["market"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/MarketScreen.tsx"]
native = ["native/App/Screens/MarketScene.swift"]

[preview]
route = "market"
state = "ui-market"
