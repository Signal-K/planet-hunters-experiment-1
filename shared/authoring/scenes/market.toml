#:schema ../schema/scene.schema.json
# Market: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=market).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "market"
type = "exchange-lab"
name = "Market"
summary = "Open-market sales with supply-driven price decay. A real building on the base, not a menu item."
qa = ["market"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/MarketScreen.tsx"]
native = ["native/App/Screens/MarketScene.swift"]

[preview]
route = "market"
state = "ui-market"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "exchange"
kind = "world"
layout = "host"
mechanics = ["economy"]
note = "Physical exchange building interior."

[[objects]]
id = "mineral-stock"
kind = "collection"
parent = "exchange"
layout = "host"
mechanics = ["economy"]
note = "One UI entry per tradable mineral."

[[objects]]
id = "price-readout"
kind = "panel"
parent = "exchange"
layout = "host"
mechanics = ["economy"]
note = "Supply-driven prices and dealer spread."

[[objects]]
id = "trade-controls"
kind = "panel"
parent = "exchange"
layout = "host"
mechanics = ["economy"]
note = "Buy/sell through the canonical economy."

[[objects]]
id = "trade-result"
kind = "panel"
parent = "exchange"
layout = "host"
mechanics = ["economy"]
note = "Wallet and inventory changes."

[[objects]]
id = "treasury-service"
kind = "group"
parent = "exchange"
layout = "host"
mechanics = ["treasury"]
note = "Domain ownership only; no native treasury equivalent identified."
