#:schema ../schema/scene.schema.json
# Survey probe console: scene script (SSL-773). A probe left in orbit at a planet or asteroid maps the surface on its own (basic scan; scan levels come in cycle 11).
format = 1
id = "probe-scan"
type = "exchange-lab"
name = "Survey probe"
summary = "The basic scan is automatic: a probe in orbit maps one sector of the body every 2 hours on its own. The console shows the map filling in and every deposit found with its tonnes. Opening it downloads the new sectors, which is a probe observation."
tickets = ["SSL-773"]
qa = ["probe-scan"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/ProbeScanScreen.tsx"]
native = []

[preview]
route = "probe-scan"
state = "ui-probe-scan"

[[objects]]
id = "probe-map"
kind = "instrument"
layout = "host"
mechanics = ["instruments", "community-research"]
note = "The body's map in 6 by 4 sectors. Mapped sectors show their deposits as mineral-coloured dots; the sector being mapped now has a gold sweep; sectors new since the last visit are outlined green; unmapped sectors are dark. Tap a mapped sector to see its deposits and tonnes. Deposits are fixed per body and sector (web/lib/probes/survey-probe.ts)."

[[objects]]
id = "probe-desk"
kind = "panel"
layout = "host"
mechanics = ["instruments", "community-research"]
note = "Two-tone right half. The probe desk says what is new, when the next sector is done, or what a tapped sector holds. Under it, every mineral found so far with its total tonnes. Opening the console downloads new sectors: a probe-observation stamp once per day (ledger: platform_contributions)."
