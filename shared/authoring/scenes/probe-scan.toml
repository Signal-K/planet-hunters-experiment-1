#:schema ../schema/scene.schema.json
# Survey probe console: scene script (SSL-773). A probe left in orbit at a planet or asteroid sends surface readings.
format = 1
id = "probe-scan"
type = "exchange-lab"
name = "Survey probe"
summary = "Pull a sector's reflectance reading from a probe in orbit, sweep it with the BAND dial, mark the dips that match the reference bands and log it. Each logged reading is a probe observation and puts that sector's deposits on the body's map."
tickets = ["SSL-773"]
qa = ["probe-scan"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/ProbeScanScreen.tsx"]
native = []

[preview]
route = "probe-scan"
state = "ui-probe-scan"

[[objects]]
id = "probe-map"
kind = "instrument"
layout = "host"
mechanics = ["instruments", "community-research"]
note = "The body's map in 6 by 4 sectors. Read sectors show the deposits found there as mineral-coloured dots; the selected sector is outlined gold. Deposits are fixed per body and sector (web/lib/probes/survey-probe.ts)."

[[objects]]
id = "probe-spectrum"
kind = "instrument"
parent = "probe-map"
layout = "host"
mechanics = ["instruments", "community-research"]
note = "The sector's reflectance spectrum, 400 to 2500 nm. Each deposit is an absorption dip at its mineral's band. The reference bands for the body's minerals sit under the trace at the same scale. PULL READING uses one of the probe's 3 daily readings."

[[objects]]
id = "band-dial"
kind = "instrument"
parent = "probe-spectrum"
layout = "host"
mechanics = ["instruments", "community-research"]
note = "BAND moves a cursor along the trace and reads out wavelength and reflectance. It never marks anything: the player matches dips to bands themselves."

[[objects]]
id = "probe-desk"
kind = "panel"
layout = "host"
mechanics = ["instruments", "community-research"]
note = "Two-tone right half. The probe desk talks the player through each reading. Mark chips for the body's minerals, readings left today, deposits found, and LOG. Logging stamps probe-observation once per day (ledger: platform_contributions) and scores the marks against what is there."
