#:schema ../schema/scene.schema.json
# Survey probe console: scene script (SSL-773). A probe left in orbit at a planet or asteroid maps the surface on its own (basic scan; scan levels come in cycle 11).
format = 1
id = "probe-scan"
type = "exchange-lab"
name = "Survey probe"
summary = "Level 1 starts with a manual SCAN command: a probe in orbit maps one sector of the body every 2 hours on its own. The console shows the probe at work, Tiny Space Program style: it circles the body, scan flashes go off and a progress bar counts the sectors. After SCAN starts the timer, opening it plays back the sectors mapped since the last visit (the download, a probe observation), then the readout lists every deposit with its tonnes and offers a free targeted run there, the client contracts the finds opened, or the hub."
tickets = ["SSL-773", "SSL-878", "SSL-832"]
qa = ["probe-scan"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/ProbeScanScreen.tsx"]
native = []

[preview]
route = "probe-scan"
state = "ui-probe-scan"

[[objects]]
id = "probe-orbit"
kind = "instrument"
layout = "host"
mechanics = ["instruments", "community-research"]
note = "The body with its 6 by 4 sector map drawn on the disc and the probe on a tilted orbit, passing behind and in front. Mapped sectors show their deposits as mineral-coloured dots, the sector being mapped now glows gold, sectors new since the last visit are outlined green, unmapped ones are dark. A scan flash (beam and burst) goes off every few seconds, and on each sector during playback. The progress bar under it counts sectors and fills the next one as time passes. Deposits are fixed per body and sector (web/lib/probes/survey-probe.ts)."

[[objects]]
id = "probe-readout"
kind = "panel"
layout = "host"
mechanics = ["instruments", "community-research", "mission-planning"]
note = "Two-tone right half (under the orbit on a phone). Says what is new or when the next sector is done, lists every mineral found with its total tonnes (types new this visit highlighted). Each downloaded find offers Plan flight, carrying that body and mineral to an unsaved custom haul without replacing active work. Targeted run still opens the Free run tab with the probe's run picked; Contracts opens this body's offers; Back to hub leaves. Skip ends playback early."
