#:schema ../schema/scene.schema.json
# Assembly: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=fab).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "fab"
type = "travel"
name = "Assembly"
summary = "Relay and launch checklist before a mission flies."
qa = ["first-fab", "transport-fab", "telescope-fab"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/RocketBuilderScene.tsx", "web/components/game/MissionSetupRoutes.tsx"]
native = ["native/App/Screens/LaunchReview.swift"]

[preview]
route = "fab"
state = "telescope-fab"

# ---------------------------------------------------------------------------------------------------------------
# Everything that can be in the assembly and launch plan. Switch things on in the Studio (Things tab), then save the
# combination as a preset.
# ---------------------------------------------------------------------------------------------------------------

[[objects]]
id = "launchpad-preview"
kind = "group"
layout = "host"
mechanics = ["rocket-assembly"]
note = "Launchpad presentation shared with Launchpad and rocket purchase."

[[objects]]
id = "assembly-rocket"
kind = "vehicle"
parent = "launchpad-preview"
layout = "host"
mechanics = ["rocket-assembly"]
note = "Design, building and ready phases."

[[objects]]
id = "mission-plan"
kind = "panel"
parent = "launchpad-preview"
layout = "host"
mechanics = ["mission-planning"]
note = "Review the chosen mission and destination."

[[objects]]
id = "part-choices"
kind = "collection"
parent = "launchpad-preview"
layout = "host"
mechanics = ["rocket-assembly"]
note = "Optional fitting UI."

[[objects]]
id = "build-launch-action"
kind = "button"
parent = "launchpad-preview"
layout = "host"
mechanics = ["rocket-assembly"]
note = "Assembly then launch through the real mission transition."

[[objects]]
id = "free-ops-picker"
kind = "panel"
parent = "launchpad-preview"
layout = "host"
mechanics = ["mission-planning"]
note = "Compatibility entry without a mission now opens the shared Mission Board on both platforms (SSL-660). It is not a separate Free Ops setup screen."

