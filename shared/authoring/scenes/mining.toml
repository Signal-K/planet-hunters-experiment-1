#:schema ../schema/scene.schema.json
# Mining Run: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=mining).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "mining"
type = "field"
name = "Mining Run"
summary = "Side-on laser extraction at the target. Ore nodes are spawned by the controller, not authored. The same scene serves every mining location with different ore and visuals."
tickets = ["SSL-411", "SSL-430"]
qa = ["mining", "mining-actions", "transport-mining"]

[runtime]
surface = "canvas"
web = ["web/components/game/screens/MiningScreen.tsx", "web/components/game/screens/MiningCanvas.tsx", "web/components/game/screens/MiningControls.tsx"]
native = ["native/App/Screens/FlightScreens.swift", "native/App/Scenes/MiningScene.swift"]
engine = ["web/public/game/scenes/mining.scene.json"]

[preview]
route = "mining"
state = "m1-mining"
