#:schema ../schema/scene.schema.json
# Skill Tree: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=skills).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "skills"
type = "menu"
name = "Skill Tree"
summary = "Four branches: mining, cargo, range and engineering."
qa = ["skill-tree"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/SkillTreeScreen.tsx"]
native = ["native/App/Screens/SkillTreeScreen.swift"]

[preview]
route = "skills"
state = "ui-skill-tree"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "skill-tree"
kind = "collection"
layout = "host"
mechanics = ["progression"]
note = "Skill nodes and their prerequisite edges."

[[objects]]
id = "licence"
kind = "panel"
parent = "skill-tree"
layout = "host"
mechanics = ["progression"]
note = "Current licence grade and next requirements."

[[objects]]
id = "skill-detail"
kind = "panel"
parent = "skill-tree"
layout = "host"
mechanics = ["progression"]
note = "Selected node costs and effects."

[[objects]]
id = "unlock-action"
kind = "button"
parent = "skill-tree"
layout = "host"
mechanics = ["progression"]
note = "Spend skill points through Progression."

[[objects]]
id = "upgrade-action"
kind = "button"
parent = "skill-tree"
layout = "host"
mechanics = ["progression"]
note = "Upgrade the licence when eligible."
