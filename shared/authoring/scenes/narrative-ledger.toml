#:schema ../schema/scene.schema.json
# Ledger: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=narrative-ledger).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "narrative-ledger"
type = "menu"
name = "Ledger"
summary = "The programme's narrative ledger."
qa = ["ledger"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/NarrativeLedgerScreen.tsx"]
native = ["native/App/Screens/BaseRecordScreens.swift"]

[preview]
route = "narrative-ledger"
state = "ui-ledger"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "ledger-entries"
kind = "collection"
layout = "host"
mechanics = ["records"]
note = "Narrative entries derived from canonical progression and discoveries."

[[objects]]
id = "entry-detail"
kind = "panel"
parent = "ledger-entries"
layout = "host"
mechanics = ["records"]
note = "Selected record and its source."

[[objects]]
id = "back-action"
kind = "button"
parent = "ledger-entries"
layout = "host"
mechanics = ["records"]
note = "Return to the base."
