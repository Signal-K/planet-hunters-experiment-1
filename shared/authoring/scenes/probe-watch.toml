#:schema ../schema/scene.schema.json
format = 1
id = "probe-watch"
type = "field"
name = "Moon field camera"
summary = "You stand behind a camera on the Moon's surface, looking out at the horizon. Meteor impacts flash on the ground; turn toward one and confirm it before its dust settles, then read the count and closest impact after a one-minute watch."
tickets = ["SSL-772", "SSL-853"]
qa = ["probe-watch"]

[runtime]
surface = "canvas"
web = ["web/components/game/screens/ProbeWatchScreen.tsx"]
native = []

[preview]
route = "probe-watch"
state = "ui-probe-watch"

[[objects]]
id = "probe-field"
kind = "world"
layout = "host"
mechanics = ["sky-events"]
note = "One first-person view from a fixed camera on the Moon: horizon, Earth, Sun and craters drawn in perspective, no rover and no top-down map. A seeded impact schedule (probeImpacts) follows the real shower window and distance from its peak. The shower is named once, in the intro sentence. The fixture uses the Leonids peak."

[[objects]]
id = "field-camera"
kind = "instrument"
parent = "probe-field"
layout = "host"
mechanics = ["sky-events"]
note = "30-degree pan controls at the screen edges, with a bearing tape; 120-degree field of view. A flash outside the frame cues the side to turn. Any impact stays confirmable for eight seconds once it is in frame. Each confirmation saves one idempotent observation on the player."

[[objects]]
id = "watch-readout"
kind = "panel"
layout = "host"
mechanics = ["sky-events"]
note = "One minute or Finish watch opens results: this watch's count and closest sighting, plus saved lifetime count and best. Watch again or return to the Control Station. Campaign saves use the existing offline player outbox. The account-free fixture has a separate observation-only local slot and survives reload."
