#:schema ../schema/scene.schema.json
# Mission Board: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=missions).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "missions"
type = "menu"
name = "Mission Board"
summary = "The live list of client contracts and Free Ops work to choose from."
tickets = ["SSL-425", "SSL-876", "SSL-890"]
qa = ["mission-board", "map-live-event", "map-event-expired"]

[runtime]
surface = "dom"
web = ["web/components/game/MissionBoard.tsx", "web/components/game/MissionSetupRoutes.tsx"]
native = ["native/App/Screens/CoreLoop.swift"]

[preview]
route = "missions"
state = "ui-mission-board"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "mission-board"
kind = "panel"
layout = "host"
mechanics = ["mission-planning"]
note = "Optional contracts and self-directed operations, sourced from the live catalog."

[[objects]]
id = "client-contracts"
kind = "collection"
parent = "mission-board"
layout = "host"
mechanics = ["mission-planning"]
note = "Each entry is a mission UI element with client, requirements and payout."

[[objects]]
id = "own-program"
kind = "collection"
parent = "mission-board"
layout = "host"
mechanics = ["mission-planning"]
note = "Free Ops work independent of contracts."

[[objects]]
id = "target-picker"
kind = "panel"
parent = "mission-board"
layout = "host"
mechanics = ["mission-planning"]
note = "Destination selection for the selected mission."

[[objects]]
id = "accept-action"
kind = "button"
parent = "mission-board"
layout = "host"
mechanics = ["mission-planning"]
note = "Accept through the existing mission lifecycle."

[[objects]]
id = "training-control"
kind = "panel"
parent = "mission-board"
layout = "host"
mechanics = ["training"]
note = "Optional training, never a Free Ops gate."

[[objects]]
id = "planning-and-log"
kind = "ui"
mechanics = ["mission-planning"]
note = "On portrait phones, own-flight planning, mission log and balance have distinct grid cells and 44px controls. Narrow portrait tablets retain the current tab name and other tab icons so their toolbar cannot overlap these controls. Free Run keeps a compact, accessible Solar system back control at the left of the second row, clear of planning and destination nodes. Other viewports retain their normal toolbar."

[[objects]]
id = "map-live-event"
kind = "button"
parent = "mission-board"
layout = "host"
note = "One currently live shower at Earth opens a focused objective, participation and reward readout, then its existing activity. Expiry hides the marker and preserves rewards."
