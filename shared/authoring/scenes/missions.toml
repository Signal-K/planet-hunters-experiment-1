#:schema ../schema/scene.schema.json
# Mission Board: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=missions).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "missions"
type = "menu"
name = "Mission Board"
summary = "The live list of client contracts and Free Ops work to choose from."
tickets = ["SSL-425"]
qa = ["mission-board"]

[runtime]
surface = "dom"
web = ["web/components/game/MissionBoard.tsx", "web/components/game/MissionSetupRoutes.tsx"]
native = ["native/App/Screens/CoreLoop.swift"]

[preview]
route = "missions"
state = "ui-mission-board"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "mission-board"
kind = "panel"
layout = "host"
mechanics = ["mission-planning"]
note = "Optional contracts and self-directed operations, sourced from the live catalog."

[[objects]]
id = "client-contracts"
kind = "collection"
parent = "mission-board"
layout = "host"
mechanics = ["mission-planning"]
note = "Each entry is a mission UI element with client, requirements and payout."

[[objects]]
id = "own-program"
kind = "collection"
parent = "mission-board"
layout = "host"
mechanics = ["mission-planning"]
note = "Free Ops work independent of contracts."

[[objects]]
id = "target-picker"
kind = "panel"
parent = "mission-board"
layout = "host"
mechanics = ["mission-planning"]
note = "Destination selection for the selected mission."

[[objects]]
id = "accept-action"
kind = "button"
parent = "mission-board"
layout = "host"
mechanics = ["mission-planning"]
note = "Accept through the existing mission lifecycle."

[[objects]]
id = "training-control"
kind = "panel"
parent = "mission-board"
layout = "host"
mechanics = ["training"]
note = "Optional training, never a Free Ops gate."
