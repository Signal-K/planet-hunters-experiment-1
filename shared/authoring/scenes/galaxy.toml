#:schema ../schema/scene.schema.json
# Galaxy Map: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=galaxy).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "galaxy"
type = "exchange-lab"
name = "Galaxy Map"
summary = "Legacy TESS inspector kept as the Control Station handoff for exoplanet review. Full-screen lightcurve plus verdict dock, two columns on desktop."
tickets = ["SSL-497"]
qa = ["tess", "tess-pointing"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/TessDiscoveryScreen.tsx"]
native = ["native/App/Screens/TessDiscoveryScreen.swift"]

[preview]
route = "galaxy"
state = "ui-tess-discovery"

# ---------------------------------------------------------------------------------------------------------------
# Everything that can be in the console. Switch things on in the Studio (Things tab), then save the combination as a
# preset. First-visit help sheets are off in the sandbox.
# ---------------------------------------------------------------------------------------------------------------

[[things]]
id = "telescope-online"
label = "Telescope online"
group = "Instruments"
default = true
state = { visualFixture = "tess", player = { transitSatelliteLaunchedAt = "@now-1d", transitSatelliteLevel = 1 } }

[[things]]
id = "some-annotations"
label = "Some observations done"
group = "Progress"
state = { player = { researchAnnotations = 3, researchXP = 180 } }

[[presets]]
id = "first-light-curve"
name = "First light curve"
things = ["telescope-online"]
instructions = """
The first transit candidate from the telescope the player launched. The light curve fills the screen and the verdict dock
sits within thumb reach. Every control is at least 44px. Nothing explains itself in a wall of text.
"""


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "light-curve"
kind = "instrument"
layout = "host"
mechanics = ["tess"]
note = "Real TESS observation plot; not a galaxy travel map."

[[objects]]
id = "candidate-list"
kind = "collection"
parent = "light-curve"
layout = "host"
mechanics = ["tess"]
note = "Available observation subjects."

[[objects]]
id = "classification-controls"
kind = "panel"
parent = "light-curve"
layout = "host"
mechanics = ["tess"]
note = "Transit annotation and verdict submission."

[[objects]]
id = "observation-detail"
kind = "panel"
parent = "light-curve"
layout = "host"
mechanics = ["tess"]
note = "Subject data and context."

[[objects]]
id = "next-action"
kind = "button"
parent = "light-curve"
layout = "host"
mechanics = ["tess"]
note = "Continue through the real instrument feed."
