#:schema ../schema/scene.schema.json
# Debrief: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=debrief).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "debrief"
type = "travel"
name = "Debrief"
summary = "Payout and cargo settlement after a run, and the touchdown at home."
tickets = ["SSL-462"]
qa = ["debrief", "debrief-capacitor", "first-home", "transport-debrief", "telescope-debrief"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/DebriefScreen.tsx", "web/components/game/screens/HomecomingScreen.tsx"]
native = ["native/App/Screens/CoreLoop.swift", "native/App/Screens/HomecomingScreen.swift"]

[preview]
route = "debrief"
state = "telescope-debrief"

# ---------------------------------------------------------------------------------------------------------------
# Everything that can be in a debrief. Switch things on in the Studio (Things tab), then save the combination as a
# preset.
# ---------------------------------------------------------------------------------------------------------------

[[things]]
id = "telescope-deployed"
label = "Telescope deployed"
group = "Outcome"
exclusive = "outcome"
default = true
state = { missionId = "story-transit-telescope-launch", targetId = "earth-orbit-transit-telescope", lastCargo = {}, player = { transitSatelliteLaunchedAt = "@now", transitSatelliteLevel = 1 } }

[[things]]
id = "courier-delivered"
label = "Courier run delivered"
group = "Outcome"
exclusive = "outcome"
state = { missionId = "lnm_m3_relay_bennu_vesta", targetId = "bennu", deliveryTargetId = "vesta", lastCargo = { iron = 8, nickel = 2 }, player = { missionPhase = "debrief", activeMission = { id = "lnm_m3_relay_bennu_vesta", label = "Belt Courier Run" }, homeDeliveryPending = true } }

[[presets]]
id = "telescope-in-orbit"
name = "Telescope in orbit"
things = ["telescope-deployed"]
instructions = """
The end of the first satellite launch. One card: the telescope is online and a daily instrument feed is unlocked. The one
action logs the outcome and returns to the base. No money talk: a telescope earns nothing by itself.
"""


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "home-berth"
kind = "world"
layout = "host"
mechanics = ["delivery"]
note = "Homecoming scene when a cargo split is pending."

[[objects]]
id = "cargo-allocation"
kind = "panel"
parent = "home-berth"
layout = "host"
mechanics = ["delivery"]
note = "Allocate each mineral between client, storage and exchange."

[[objects]]
id = "settle-action"
kind = "button"
parent = "home-berth"
layout = "host"
mechanics = ["delivery"]
note = "Settle exactly once through HomeDelivery."

[[objects]]
id = "mission-result"
kind = "panel"
parent = "home-berth"
layout = "host"
mechanics = ["mission-planning"]
note = "Completed operation, payouts and affinity."

[[objects]]
id = "progression-result"
kind = "panel"
parent = "home-berth"
layout = "host"
mechanics = ["progression"]
note = "XP and unlocks resulting from the operation."

[[objects]]
id = "continue-action"
kind = "button"
parent = "home-berth"
layout = "host"
mechanics = ["mission-planning"]
note = "Return to the same canonical base state."
