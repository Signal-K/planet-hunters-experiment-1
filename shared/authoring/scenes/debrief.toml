#:schema ../schema/scene.schema.json
# Debrief: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=debrief).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "debrief"
type = "travel"
name = "Debrief"
summary = "Payout and cargo settlement after a run, and the touchdown at home."
tickets = ["SSL-462"]
qa = ["debrief", "debrief-capacitor", "first-home", "transport-debrief", "telescope-debrief"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/DebriefScreen.tsx", "web/components/game/screens/HomecomingScreen.tsx"]
native = ["native/App/Screens/CoreLoop.swift", "native/App/Screens/HomecomingScreen.swift"]

[preview]
route = "debrief"
state = "telescope-debrief"

# ---------------------------------------------------------------------------------------------------------------
# Everything that can be in a debrief. Switch things on in the Studio (Things tab), then save the combination as a
# preset.
# ---------------------------------------------------------------------------------------------------------------

[[objects]]
id = "home-berth"
kind = "world"
layout = "host"
mechanics = ["delivery"]
note = "Homecoming scene when a cargo split is pending."

[[objects]]
id = "cargo-allocation"
kind = "panel"
parent = "home-berth"
layout = "host"
mechanics = ["delivery"]
note = "Allocate each mineral between client, storage and exchange."

[[objects]]
id = "settle-action"
kind = "button"
parent = "home-berth"
layout = "host"
mechanics = ["delivery"]
note = "Settle exactly once through HomeDelivery."

[[objects]]
id = "mission-result"
kind = "panel"
parent = "home-berth"
layout = "host"
mechanics = ["mission-planning"]
note = "Completed operation, payouts and affinity."

[[objects]]
id = "progression-result"
kind = "panel"
parent = "home-berth"
layout = "host"
mechanics = ["progression"]
note = "XP and unlocks resulting from the operation."

[[objects]]
id = "continue-action"
kind = "button"
parent = "home-berth"
layout = "host"
mechanics = ["mission-planning"]
note = "Return to the same canonical base state."

