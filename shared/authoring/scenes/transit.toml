#:schema ../schema/scene.schema.json
# Transit: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=transit).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "transit"
type = "travel"
name = "Transit"
summary = "Physical rocket flight between Earth and a target. Not TESS transit photometry."
qa = ["flight", "first-return"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/TransitScreen.tsx", "web/components/game/MissionOperationRoutes.tsx"]
native = ["native/App/Screens/FlightScreens.swift"]

[preview]
route = "transit"
state = "telescope-transit"
