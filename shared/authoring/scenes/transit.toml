#:schema ../schema/scene.schema.json
# Transit: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=transit).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "transit"
type = "travel"
name = "Transit"
summary = "Physical rocket flight between Earth and a target, drawn in 3D by Takeon. The rocket keeps its course; the player nudges it through boost rings and around rocks. Not TESS transit photometry."
tickets = ["SSL-847", "SSL-848", "SSL-861"]
qa = ["flight", "first-return", "flight-return"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/TransitScreen.tsx", "web/components/takeon/TakeOnFlight.tsx", "web/lib/flight/looks.ts", "web/components/game/MissionOperationRoutes.tsx"]
native = ["native/App/Screens/FlightScreens.swift"]

[preview]
route = "flight"
state = "sandbox-transit"

# ---------------------------------------------------------------------------------------------------------------
# Everything that can be in a flight. Switch things on in the Studio (Things tab), then save the combination as a
# preset. The flight clock is frozen to the slider: drag it to see the ship at any point of the trip.
# ---------------------------------------------------------------------------------------------------------------

[[objects]]
id = "flight-world"
kind = "world"
layout = "host"
mechanics = ["flight"]
note = "Takeon flight view (@takeon/engine createFlightScene): sky, sun, corridor and the destination. Not the TESS light-curve scene."

[[objects]]
id = "flight-rocket"
kind = "vehicle"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "The player's rocket as hull sections (flightCraftLook): fitted parts change its proportions, the livery its paint."

[[objects]]
id = "destination"
kind = "decoration"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "A lit, turning globe generated from the body's mining palette (flightDestinationLook). Earth on the way home. It grows with the trip and becomes the limb below the rocket in orbit."

[[objects]]
id = "flight-progress"
kind = "panel"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "Persisted departure and arrival timestamps. The trip clock drives the scene (host-paced), never the other way round."

[[objects]]
id = "flight-corridor"
kind = "collection"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "Rocks to steer around and blue rings to fly through, generated from the trip's seed. Two rings charge one Boost. A rock slows the scene and ends a running Boost; it never costs trip time."

[[objects]]
id = "nudge-pad"
kind = "ui"
parent = "flight-world"
slot = "secondaryAction"
layout = "host"
mechanics = ["flight"]
note = "Shared mining d-pad, bottom-left. A nudge moves the rocket inside the corridor; it cannot leave its course. Arrow keys, WASD and dragging on the scene do the same."

[[objects]]
id = "boost-action"
kind = "button"
parent = "flight-world"
slot = "primaryAction"
layout = "host"
mechanics = ["flight"]
label = "Boost"
note = "Shared round button, bottom-right, with the Boost charge as its ring. One charge at launch; a Boost cuts 22% of the time left (at least 2.5 s)."

[[objects]]
id = "arrival-action"
kind = "button"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "The rocket settles into orbit for about two seconds, then the trip hands over to landing, mining, survey or debrief according to the mission. Arrive skips the wait."

[[objects]]
id = "return-action"
kind = "button"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "Return to the base without replacing the active flight."

