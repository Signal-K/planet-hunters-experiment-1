#:schema ../schema/scene.schema.json
# Transit: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=transit).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "transit"
type = "travel"
name = "Transit"
summary = "Physical rocket flight between Earth and a target. Not TESS transit photometry."
qa = ["flight", "first-return"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/TransitScreen.tsx", "web/components/game/MissionOperationRoutes.tsx"]
native = ["native/App/Screens/FlightScreens.swift"]

[preview]
route = "transit"
state = "sandbox-transit"

# ---------------------------------------------------------------------------------------------------------------
# Everything that can be in a flight. Switch things on in the Studio (Things tab), then save the combination as a
# preset. The flight clock is frozen to the slider: drag it to see the ship at any point of the trip.
# ---------------------------------------------------------------------------------------------------------------

[[objects]]
id = "flight-world"
kind = "world"
layout = "host"
mechanics = ["flight"]
note = "Target-specific flight environment; not the TESS light-curve scene."

[[objects]]
id = "flight-rocket"
kind = "vehicle"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "Vehicle moving through the current flight leg."

[[objects]]
id = "destination"
kind = "decoration"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "Catalog-driven destination visual."

[[objects]]
id = "flight-progress"
kind = "panel"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "Persisted departure and arrival timestamps."

[[objects]]
id = "arrival-action"
kind = "button"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "Transition to landing, mining, survey or debrief according to the mission."

[[objects]]
id = "return-action"
kind = "button"
parent = "flight-world"
layout = "host"
mechanics = ["flight"]
note = "Return to the base without replacing the active flight."

