#:schema ../schema/scene.schema.json
# Launchpad: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=launchpad).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "launchpad"
type = "base"
name = "Launchpad"
summary = "The player's own program: satellites and self-directed runs launched on their own initiative. Client contracts are one press away on the Mission Board."
qa = ["launchpad"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/LaunchpadScreen.tsx", "web/components/game/LaunchpadPrefab.tsx"]
native = ["native/App/Screens/LaunchReview.swift", "native/App/Screens/LaunchpadPrefab.swift"]

[preview]
route = "launchpad"
state = "ui-launchpad"

# ---------------------------------------------------------------------------------------------------------------
# Everything that can be on the launchpad. Switch things on in the Studio (Things tab), then save the combination as a
# preset.
# ---------------------------------------------------------------------------------------------------------------

[[things]]
id = "no-mission"
label = "Nothing chosen"
group = "Mission"
exclusive = "mission"
default = true
note = "The pad as a new program finds it."

[[things]]
id = "telescope-mission"
label = "Launch the telescope"
group = "Mission"
exclusive = "mission"
state = { missionId = "story-transit-telescope-launch", targetId = "earth-orbit-transit-telescope" }

[[things]]
id = "courier-mission"
label = "Belt Courier Run"
group = "Mission"
exclusive = "mission"
state = { missionId = "lnm_m3_relay_bennu_vesta", targetId = "bennu", deliveryTargetId = "vesta" }

[[things]]
id = "mining-mission"
label = "Mine on your own"
group = "Mission"
exclusive = "mission"
state = { missionId = "freeops-self-directed-mining", targetId = "eros" }

[[things]]
id = "rocket-on-pad"
label = "Rocket on the pad"
group = "On the pad"
state = { player = { selectedStagedRocketId = "sandbox-rocket", stagedRockets = [{ id = "sandbox-rocket", rocketId = "prospector", rocket = { chassis = "hull-mk2", propulsion = "fusion-b2", drill = "laser-t2" }, location = "launchpad", source = "company", missionId = "story-transit-telescope-launch", targetId = "earth-orbit-transit-telescope" }] } }

[[things]]
id = "launch-sequence"
label = "Launch sequence running"
group = "On the pad"
note = "The countdown and lift-off, as it plays when the player presses Launch."
query = { launchscene = "1" }

[[things]]
id = "mission-in-progress"
label = "Mission in progress"
group = "On the pad"
note = "Shows the resume and scrub callout."
state = { player = { activeMission = { id = "lnm_m3_relay_bennu_vesta", label = "Belt Courier Run" }, missionPhase = "transit", transitStartedAt = "@now-5m", arrivalAt = "@now+1h" } }

[[things]]
id = "starter-ship"
label = "Starter ship"
group = "Ship"
exclusive = "ship"
default = true
note = "Explorer: no parts fitted."

[[things]]
id = "tier-2-ship"
label = "Tier 2 ship"
group = "Ship"
exclusive = "ship"
state = { rocket = { chassis = "hull-mk2", propulsion = "fusion-b2", drill = "laser-t2" }, player = { shipCustomizerParts = { engine = "fusion-thruster-t2", booster = "strap-booster-t1", cockpit = "cockpit-command-t1", payload = "cargo-payload-t1", fuel-stage = "kerosene-stage-t1", fairing = "standard-fairing-t1" } } }

[[things]]
id = "tier-4-ship"
label = "Tier 4 ship"
group = "Ship"
exclusive = "ship"
state = { rocket = { chassis = "hull-mk3", propulsion = "ion-a3", drill = "plasma-t3" }, player = { shipCustomizerParts = { engine = "array-thruster-t4", booster = "vulcan-booster-t1", cockpit = "guidance-cockpit-t1", payload = "storage-silo-t4", fuel-stage = "lox-lh2-stage-t1", fairing = "heavy-fairing-t1", docking-port = "magnetic-port-t1", heat-shield = "ceramic-shield-t1" } } }

[[presets]]
id = "empty-pad"
name = "Empty pad"
things = ["no-mission", "starter-ship"]
instructions = """
Nothing on the pad and nothing chosen. The one action is to choose a mission, and it must be obvious which. The tower and
hangar stand on the apron with no gap under them.
"""

[[presets]]
id = "telescope-on-the-pad"
name = "Telescope ready to launch"
things = ["telescope-mission", "rocket-on-pad", "tier-2-ship"]
instructions = """
The first satellite launch, on the pad. The rocket stands in the gantry and the launch control reads as the one thing to
press. The mission is the telescope: its name must not look like a client contract.
"""

[[presets]]
id = "liftoff"
name = "Lift-off"
things = ["telescope-mission", "rocket-on-pad", "tier-2-ship", "launch-sequence"]
instructions = """
Lift-off. Flames, gantry, and the sky must all match the base (flat steppe, no mountains, no forest). Skip is always in
reach. After the sequence the flight begins.
"""

# ---------------------------------------------------------------------------------------------------------------
# Composition. Every visible or interactive part is either a game object or a UI element. The launchpad complex is a
# reusable prefab instance; its parts remain explicit children so the Studio can reveal and inspect the assembly.
# ---------------------------------------------------------------------------------------------------------------

[[objects]]
id = "world"
kind = "world"
mechanics = ["world"]
slot = "world"
components = ["BaseWorldSimulation", "BaseCamera"]

[[objects]]
id = "launchpad-complex"
kind = "group"
mechanics = ["rocket-assembly"]
parent = "world"
prefab = "launchpad"
components = ["LaunchpadState"]
note = "Reusable launch complex assembled from the child game objects below."

[[objects]]
id = "apron"
kind = "terrain"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
layout = "shared"
space = "parent"
rect = { x = 0, y = 0, w = 1, h = 1 }
asset = "web/public/game/assets/base/v7/launchpad/pad-complex.png"
nativeAsset = "base/v7/launchpad/pad-complex.png"
note = "Legacy fused pad, tower and hangar sprite. Named subparts below are not yet separate art; do not count them as independent renderers."

[[objects]]
id = "service-tower"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
components = ["LaunchTowerAnimation"]

[[objects]]
id = "launch-stand"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
components = ["LaunchStandState"]

[[objects]]
id = "support-hangar"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
components = ["Clickable"]

[[objects]]
id = "staged-rocket"
kind = "vehicle"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
layout = "shared"
space = "parent"
rect = { x = 0.2308, y = 0.261, w = 0.1904, h = 0.647 }
asset = "web/public/art/scenes/launchpad/launchpad-rocket-multistage.png"
nativeAsset = "scene-launchpad-rocket-multistage"
components = ["StagedRocket", "LaunchSequence"]
bindings = { visible = "player.selectedStagedRocketId" }

[[objects]]
id = "launch-control"
kind = "instrument"
mechanics = ["mission-planning"]
parent = "launchpad-complex"
layout = "shared"
space = "parent"
rect = { x = 0.13, y = 0, w = 0.11, h = 0.78 }
action = "choose-mission"
components = ["MissionLaunchControl"]

[[objects]]
id = "assembly-scaffold"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
layout = "shared"
space = "parent"
rect = { x = 0, y = 0, w = 1, h = 1 }
asset = "web/public/game/assets/base/v7/launchpad/pad-scaffold.png"
nativeAsset = "base/v7/launchpad/pad-scaffold.png"
note = "Assembly animation uses the rocket frame for its welding path."

[[objects]]
id = "back-control"
kind = "button"
mechanics = ["mission-planning"]
rect = { x = 0.03, y = 0.025, w = 0.22, h = 0.07 }
label = "Back"
components = ["Clickable"]

[[objects]]
id = "mission-selector"
kind = "panel"
mechanics = ["mission-planning"]
rect = { x = 0.03, y = 0.11, w = 0.94, h = 0.09 }
components = ["MissionSelector"]
bindings = { reads = "missionId" }

[[objects]]
id = "pad-status"
kind = "panel"
mechanics = ["mission-planning"]
rect = { x = 0.12, y = 0.28, w = 0.76, h = 0.16 }
components = ["LaunchpadStatus"]
bindings = { reads = "missionId,player.selectedStagedRocketId" }

[[objects]]
id = "launch-action"
kind = "button"
mechanics = ["mission-planning","rocket-assembly"]
slot = "primaryAction"
label = "Launch"
components = ["Clickable", "MissionLaunchAction"]
bindings = { enabled = "missionId,player.selectedStagedRocketId" }
