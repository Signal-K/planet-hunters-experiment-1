#:schema ../schema/scene.schema.json
# Launchpad: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=launchpad).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "launchpad"
type = "base"
name = "Launchpad"
summary = "The player's own program: satellites and self-directed runs launched on their own initiative. Client contracts are one press away on the Mission Board."
qa = ["launchpad"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/LaunchpadScreen.tsx", "web/components/game/LaunchpadPrefab.tsx"]
native = ["native/App/Screens/LaunchReview.swift", "native/App/Screens/LaunchpadPrefab.swift"]

[preview]
route = "launchpad"
state = "ui-launchpad"

# ---------------------------------------------------------------------------------------------------------------
# Everything that can be on the launchpad. Switch things on in the Studio (Things tab), then save the combination as a
# preset.
# ---------------------------------------------------------------------------------------------------------------

[[objects]]
id = "world"
kind = "world"
mechanics = ["world"]
slot = "world"
components = ["BaseWorldSimulation", "BaseCamera"]

[[objects]]
id = "launchpad-complex"
kind = "group"
mechanics = ["rocket-assembly"]
parent = "world"
prefab = "launchpad"
components = ["LaunchpadState"]
note = "Reusable launch complex assembled from the child game objects below."

[[objects]]
id = "apron"
kind = "terrain"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
layout = "shared"
space = "parent"
rect = { x = 0, y = 0, w = 1, h = 1 }
asset = "web/public/game/assets/base/v7/launchpad/pad-complex.png"
nativeAsset = "base/v7/launchpad/pad-complex.png"
note = "Legacy fused pad, tower and hangar sprite. Named subparts below are not yet separate art; do not count them as independent renderers."

[[objects]]
id = "service-tower"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
components = ["LaunchTowerAnimation"]

[[objects]]
id = "launch-stand"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
components = ["LaunchStandState"]

[[objects]]
id = "support-hangar"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
components = ["Clickable"]

[[objects]]
id = "staged-rocket"
kind = "vehicle"
mechanics = ["rocket-assembly", "sky-events"]
parent = "launchpad-complex"
layout = "shared"
space = "parent"
rect = { x = 0.2308, y = 0.261, w = 0.1904, h = 0.647 }
asset = "web/public/art/scenes/launchpad/launchpad-rocket-multistage.png"
nativeAsset = "scene-launchpad-rocket-multistage"
components = ["StagedRocket", "LaunchSequence"]
bindings = { visible = "player.selectedStagedRocketId" }

[[objects]]
id = "launch-control"
kind = "instrument"
mechanics = ["mission-planning"]
parent = "launchpad-complex"
layout = "shared"
space = "parent"
rect = { x = 0.13, y = 0, w = 0.11, h = 0.78 }
action = "choose-mission"
components = ["MissionLaunchControl"]

[[objects]]
id = "assembly-scaffold"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
layout = "shared"
space = "parent"
rect = { x = 0, y = 0, w = 1, h = 1 }
asset = "web/public/game/assets/base/v7/launchpad/pad-scaffold.png"
nativeAsset = "base/v7/launchpad/pad-scaffold.png"
note = "Assembly animation uses the rocket frame for its welding path."

[[objects]]
id = "service-motion"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "launchpad-complex"
layout = "shared"
space = "parent"
rect = { x = 0, y = 0, w = 1, h = 1 }
asset = "web/public/game/assets/base/v7/launchpad/pad-activity.png"
nativeAsset = "base/v7/launchpad/pad-activity.png"
components = ["LaunchTowerAnimation"]
note = "Blender-authored moving service trolley, cable, arm and beacon layered over the permanent launch complex."

[[objects]]
id = "back-control"
kind = "button"
mechanics = ["mission-planning"]
rect = { x = 0.03, y = 0.025, w = 0.22, h = 0.07 }
label = "Back"
components = ["Clickable"]

[[objects]]
id = "mission-selector"
kind = "panel"
mechanics = ["mission-planning"]
rect = { x = 0.03, y = 0.11, w = 0.94, h = 0.09 }
components = ["MissionSelector"]
bindings = { reads = "missionId" }

[[objects]]
id = "pad-status"
kind = "panel"
mechanics = ["mission-planning"]
rect = { x = 0.12, y = 0.28, w = 0.76, h = 0.16 }
components = ["LaunchpadStatus"]
bindings = { reads = "missionId,player.selectedStagedRocketId" }

[[objects]]
id = "launch-action"
kind = "button"
mechanics = ["mission-planning","rocket-assembly"]
slot = "primaryAction"
label = "Launch"
components = ["Clickable", "MissionLaunchAction"]
bindings = { enabled = "missionId,player.selectedStagedRocketId" }

