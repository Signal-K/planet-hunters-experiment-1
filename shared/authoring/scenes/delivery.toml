#:schema ../schema/scene.schema.json
# Cargo Delivery: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=delivery).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "delivery"
type = "travel"
name = "Cargo Delivery"
summary = "A physical unloading berth for two-leg contracts. Cargo leaves the ship before its empty Earth-return leg."
qa = ["transport-delivery"]

[runtime]
surface = "canvas"
web = ["web/components/game/screens/DeliveryScreen.tsx", "web/components/game/screens/DeliveryCanvas.tsx"]
native = ["native/App/Screens/CoreLoop.swift"]
engine = ["web/public/game/scenes/delivery.scene.json"]

[preview]
route = "delivery"
state = "transport-delivery"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "delivery-berth"
kind = "world"
layout = "host"
mechanics = ["delivery"]
note = "Physical destination unloading scene."

[[objects]]
id = "delivery-ship"
kind = "vehicle"
parent = "delivery-berth"
layout = "host"
mechanics = ["delivery"]
note = "Arriving cargo vehicle."

[[objects]]
id = "cargo-unload"
kind = "collection"
parent = "delivery-berth"
layout = "host"
mechanics = ["delivery"]
note = "Cargo transfer animation."

[[objects]]
id = "unload-progress"
kind = "panel"
parent = "delivery-berth"
layout = "host"
mechanics = ["delivery"]
note = "Persisted unload timer."

[[objects]]
id = "return-action"
kind = "button"
parent = "delivery-berth"
layout = "host"
mechanics = ["delivery"]
note = "After unload, start the empty Earth-return leg."
