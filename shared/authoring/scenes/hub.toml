#:schema ../schema/scene.schema.json
# Earth Base: the home base. A paved launch complex on flat steppe with low escarpments.
# Scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=hub).
# Buildings appear only when the player has built them, on the fixed sites in shared/layout/base-site.json.
# Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "hub"
type = "base"
name = "Earth Base"
summary = "The home base. Structures stand on fixed sites, can be tapped, and the dock leads to Build, the Menu and the other places."
tickets = ["SSL-345", "SSL-451", "SSL-615", "SSL-641"]
qa = ["hub", "hub-structures", "transport-hub", "telescope-hub", "cp-early", "cp-mid", "cp-late"]

[runtime]
surface = "canvas"
web = ["web/components/game/screens/HubScreen.tsx", "web/components/game/hub/"]
native = [
  "native/App/Screens/HubScreen.swift",
  "native/App/Screens/BaseWorldCanvas.swift",
  "native/App/Screens/BaseWorldScene.swift",
  "native/App/Screens/BaseDock.swift",
  "native/App/Screens/BaseCamera.swift",
  "native/App/Screens/SharedHud.swift",
]
engine = ["web/public/game/scenes/hub.scene.json"]
data = ["worlds/base-world.toml"]

[preview]
route = "hub"
state = "sandbox-hub"

[[objects]]
id = "world"
kind = "world"
mechanics = ["world"]
slot = "world"
prefab = "base-world"
components = ["BaseWorldSimulation", "BaseCamera"]
note = "Pans and zooms. The background is game objects, never a whole-scene image."

[[objects]]
id = "sky"
kind = "layer"
mechanics = ["world", "sky-events"]
parent = "world"
asset = "shared/scenes/sky-events.json"
note = "A planet is only a point of light from the sky calendar. No planet discs."

[[objects]]
id = "steppe"
kind = "terrain"
mechanics = ["world"]
parent = "world"
asset = "shared/authoring/worlds/base-world.toml"
note = "Escarpments, steppe, paved ground, clouds and weather. Edit the world data to change them on web and native."

[[objects]]
id = "building-sites"
kind = "collection"
mechanics = ["construction"]
parent = "world"
asset = "shared/layout/base-site.json"
components = ["BuildSiteInteraction"]
note = "Five fixed sites. The world starts empty; buildings are only what the player builds."

[[objects]]
id = "site-hall"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "building-sites"
label = "Hangar"
components = ["Clickable"]

[[objects]]
id = "site-pad"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "building-sites"
label = "Launchpad"
prefab = "launchpad"
components = ["Clickable"]
note = "A reusable Launchpad prefab. Its child-object composition is declared in launchpad.toml."

[[objects]]
id = "site-ops"
kind = "structure"
mechanics = ["instruments"]
parent = "building-sites"
label = "Control station"
components = ["Clickable"]

[[objects]]
id = "site-exchange"
kind = "structure"
mechanics = ["economy"]
parent = "building-sites"
label = "Exchange"
components = ["Clickable"]
note = "The Exchange stays a real building on the base, not a menu item."

[[objects]]
id = "site-shaft"
kind = "structure"
mechanics = ["construction","delivery"]
parent = "building-sites"
label = "Silo"
components = ["Clickable"]
note = "The surface silo has no above-ground body. The lift shaft is the silo door. Silos are underground only."

[[objects]]
id = "shared-hud"
kind = "ui"
mechanics = ["persistence","economy"]
slot = "hud"
prefab = "shared-hud"
note = "One shared HUD on every screen. Never a per-screen HUD."

[[objects]]
id = "base-dock"
kind = "ui"
mechanics = ["training","mission-planning"]
prefab = "base-dock"
note = "Bottom centre: previous, Build, Menu, next. No shared slot fits it yet (see bottom-nav in shared/layout/base-hud-zones.json)."
