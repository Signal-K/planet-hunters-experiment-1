#:schema ../schema/scene.schema.json
# Earth Base: the home base. A paved launch complex on flat steppe with low escarpments.
# Scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=hub).
# Buildings appear only when the player has built them, on the fixed sites in shared/layout/base-site.json.
# Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "hub"
type = "base"
name = "Earth Base"
summary = "The home base. Structures stand on fixed sites, can be tapped, and the dock leads to Build, the Menu and the other places."
tickets = ["SSL-345", "SSL-451", "SSL-615", "SSL-641"]
qa = ["hub", "hub-structures", "transport-hub", "telescope-hub", "cp-early", "cp-mid", "cp-late"]

[runtime]
surface = "canvas"
web = ["web/components/game/screens/HubScreen.tsx", "web/components/game/hub/"]
native = [
  "native/App/Screens/HubScreen.swift",
  "native/App/Screens/BaseWorldCanvas.swift",
  "native/App/Screens/BaseWorldScene.swift",
  "native/App/Screens/BaseDock.swift",
  "native/App/Screens/BaseCamera.swift",
  "native/App/Screens/SharedHud.swift",
]
engine = ["web/public/game/scenes/hub.scene.json"]
data = ["worlds/base-world.toml"]

[preview]
route = "hub"
state = "sandbox-hub"

# Game checkpoints: the base at points of a real playthrough. They carry the campaign with them (tutorial, balance,
# prompts), so the Studio keeps them out of the way. To look at the base, use the things and presets below.
[[states]]
id = "first-pad"
label = "First launchpad"
preset = "m1-hub"
note = "Launchpad built. The Extraction coach is active."

[[states]]
id = "transport-lesson"
label = "Transport lesson"
preset = "transport-hub"
note = "One mission done. The Transport coach asks for a two-leg client job."

[[states]]
id = "silo-next"
label = "Silo next"
preset = "storage-hub"
note = "Both guided missions done. No silo yet and Free Ops is still locked."

[[states]]
id = "free-ops-telescope"
label = "Free Ops and telescope"
preset = "telescope-hub"
note = "Post-onboarding. Free Ops is unlocked and a telescope is built."

[[states]]
id = "early"
label = "About 15 minutes in"
preset = "cp-early"

[[states]]
id = "mid"
label = "About 35 minutes in"
preset = "cp-mid"
note = "Silo, academy and refinery built."

[[states]]
id = "late"
label = "About 55 minutes in"
preset = "cp-late"
note = "Every building is built."

# ---------------------------------------------------------------------------------------------------------------
# Everything that can be on the base. Switch things on in the Studio (Things tab) to see them in the real game, then
# save the combination as a preset. Tables merge, lists gain entries, anything else is replaced.
# The base has four build plots (0 pad, 1 exchange, 2 silo, 3 ops), so the hangar cannot stand beside the control
# station yet: that is why they are a choice.
# ---------------------------------------------------------------------------------------------------------------

[[things]]
id = "launchpad"
label = "Launchpad"
group = "Structures"
default = true
state = { player = { placed = ["launchpad"], placementPlots = { launchpad = 0 } } }

[[things]]
id = "exchange"
label = "Exchange"
group = "Structures"
note = "A real building on the base, not a menu item."
state = { player = { placed = ["market"], placementPlots = { market = 1 } } }

[[things]]
id = "silo"
label = "Silo"
group = "Structures"
note = "No body above ground. The lift shaft is the silo door."
state = { player = { placed = ["surface-silo"], placementPlots = { surface-silo = 2 } } }

[[things]]
id = "control-station"
label = "Control station"
group = "Structures"
exclusive = "plot-3"
state = { player = { placed = ["control-station"], placementPlots = { control-station = 3 } } }

[[things]]
id = "hangar"
label = "Hangar"
group = "Structures"
exclusive = "plot-3"
note = "Shares the fourth plot with the control station."
state = { player = { placed = ["hangar"], placementPlots = { hangar = 3 } } }

[[things]]
id = "pad-callout"
label = "Prompt on the pad"
group = "Structures"
note = "The callout that suggests the next step. Off in the sandbox unless you bring it in."
state = { player = { dismissedHubPrompts = { transit-telescope = 0 } } }

[[things]]
id = "rocket-on-pad"
label = "Rocket on the pad"
group = "Craft"
exclusive = "craft"
state = { player = { selectedStagedRocketId = "sandbox-rocket", stagedRockets = [{ id = "sandbox-rocket", rocketId = "explorer", rocket = { chassis = "hull-mk1", propulsion = "ion-a1", drill = "hand-drill" }, location = "launchpad", source = "company", missionId = "lnm_m3_relay_bennu_vesta", targetId = "bennu" }] } }

[[things]]
id = "rocket-in-hangar"
label = "Rocket in the hangar"
group = "Craft"
exclusive = "craft"
state = { player = { selectedStagedRocketId = "sandbox-rocket", stagedRockets = [{ id = "sandbox-rocket", rocketId = "explorer", rocket = { chassis = "hull-mk1", propulsion = "ion-a1", drill = "hand-drill" }, location = "hangar", source = "company", missionId = "lnm_m3_relay_bennu_vesta", targetId = "bennu" }] } }

[[things]]
id = "craft-in-flight"
label = "Craft in flight"
group = "Craft"
exclusive = "craft"
state = { missionId = "lnm_m3_relay_bennu_vesta", targetId = "bennu", player = { activeMission = { id = "lnm_m3_relay_bennu_vesta", label = "Belt Courier Run" }, missionPhase = "transit", transitStartedAt = "@now-5m", arrivalAt = "@now+1h" } }

[[things]]
id = "craft-mining"
label = "Craft mining"
group = "Craft"
exclusive = "craft"
state = { missionId = "lnm_m3_relay_bennu_vesta", targetId = "bennu", player = { activeMission = { id = "lnm_m3_relay_bennu_vesta", label = "Belt Courier Run" }, missionPhase = "mining" } }

[[things]]
id = "telescope-in-orbit"
label = "Telescope in orbit"
group = "Instruments"
note = "Shows the orbital instrument network over the base."
state = { player = { transitSatelliteLaunchedAt = "@now-1d", transitSatelliteLevel = 1 } }

[[things]]
id = "deep-space-telescope"
label = "Deep-space telescope"
group = "Instruments"
state = { player = { deepSpaceTelescopeBuilt = true, deepSpaceTelescopeLevel = 1, transitSatelliteLevel = 2 } }

