# ---------------------------------------------------------------------------------------------------------------
# Presets: named setups with plain-language instructions. The agent treats the instructions as the test for the setup.
# ---------------------------------------------------------------------------------------------------------------

[[presets]]
id = "fresh-base"
name = "Fresh base"
things = ["launchpad", "midday", "summer", "mountains", "clear"]
instructions = """
A new base: the pad and nothing else, on flat steppe with low escarpments. No people, no planet discs, nothing built that
the player did not build. The camera starts centred on the pad. Tap the pad: it should answer.
"""

[[presets]]
id = "full-base"
name = "Full base"
things = ["launchpad", "exchange", "silo", "control-station", "midday", "summer", "mountains", "clear"]
instructions = """
Every structure the base draws. Each one rests on the ground line with no gap, and each is tappable. The silo has no
body above ground. Pan along the whole strip: nothing should pop in or tear.
"""

[[presets]]
id = "telescope-night"
name = "Telescope at night"
things = ["launchpad", "control-station", "telescope-in-orbit", "night", "summer", "mountains", "clear", "satellite"]
instructions = """
The base once the first telescope is in orbit. The orbital network should be readable over the base without covering the
pad or the control station. Stars show; the moon is the only luminary.
"""

[[objects]]
id = "world"
kind = "world"
mechanics = ["world"]
slot = "world"
prefab = "base-world"
components = ["BaseWorldSimulation", "BaseCamera"]
note = "Pans and zooms. The background is game objects, never a whole-scene image."

[[objects]]
id = "sky"
kind = "layer"
mechanics = ["world", "sky-events"]
parent = "world"
asset = "shared/scenes/sky-events.json"
note = "A planet is only a point of light from the sky calendar. No planet discs."

[[objects]]
id = "steppe"
kind = "terrain"
mechanics = ["world"]
parent = "world"
asset = "shared/authoring/worlds/base-world.toml"
note = "Escarpments, steppe, paved ground, clouds and weather. Edit the world data to change them on web and native."

[[objects]]
id = "building-sites"
kind = "collection"
mechanics = ["construction"]
parent = "world"
asset = "shared/layout/base-site.json"
components = ["BuildSiteInteraction"]
note = "Five fixed sites. The world starts empty; buildings are only what the player builds."

[[objects]]
id = "site-hall"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "building-sites"
label = "Hangar"
components = ["Clickable"]

[[objects]]
id = "site-pad"
kind = "structure"
mechanics = ["rocket-assembly"]
parent = "building-sites"
label = "Launchpad"
prefab = "launchpad"
components = ["Clickable"]
note = "A reusable Launchpad prefab. Its child-object composition is declared in launchpad.toml."

[[objects]]
id = "site-ops"
kind = "structure"
mechanics = ["instruments"]
parent = "building-sites"
label = "Control station"
components = ["Clickable"]

[[objects]]
id = "site-exchange"
kind = "structure"
mechanics = ["economy"]
parent = "building-sites"
label = "Exchange"
components = ["Clickable"]
note = "The Exchange stays a real building on the base, not a menu item."

[[objects]]
id = "site-shaft"
kind = "structure"
mechanics = ["construction","delivery"]
parent = "building-sites"
label = "Silo"
components = ["Clickable"]
note = "The surface silo has no above-ground body. The lift shaft is the silo door. Silos are underground only."

[[objects]]
id = "shared-hud"
kind = "ui"
mechanics = ["persistence","economy"]
slot = "hud"
prefab = "shared-hud"
note = "One shared HUD on every screen. Never a per-screen HUD."

[[objects]]
id = "base-dock"
kind = "ui"
mechanics = ["training","mission-planning"]
prefab = "base-dock"
note = "Bottom centre: previous, Build, Menu, next. No shared slot fits it yet (see bottom-nav in shared/layout/base-hud-zones.json)."
