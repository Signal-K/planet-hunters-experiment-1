#:schema ../schema/scene.schema.json
# Asteroid Discovery: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=asteroid-discovery).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "asteroid-discovery"
type = "exchange-lab"
name = "Asteroid Discovery"
summary = "Asteroid discovery review, reached from the Control Station."
tickets = ["SSL-497"]
qa = ["asteroid"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/AsteroidDiscoveryScreen.tsx"]
native = ["native/App/Screens/AsteroidDiscoveryScreen.swift"]

[preview]
route = "asteroid-discovery"
state = "ui-asteroid-discovery"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "observation-frames"
kind = "instrument"
layout = "host"
mechanics = ["asteroid-review"]
note = "Real sequential observation imagery."

[[objects]]
id = "candidate-list"
kind = "collection"
parent = "observation-frames"
layout = "host"
mechanics = ["asteroid-review"]
note = "Available review candidates."

[[objects]]
id = "annotation-layer"
kind = "collection"
parent = "observation-frames"
layout = "host"
mechanics = ["asteroid-review"]
note = "Player marks on observation frames."

[[objects]]
id = "verdict-controls"
kind = "panel"
parent = "observation-frames"
layout = "host"
mechanics = ["asteroid-review"]
note = "Submit classification through the instrument feed."

[[objects]]
id = "next-action"
kind = "button"
parent = "observation-frames"
layout = "host"
mechanics = ["asteroid-review"]
note = "Next candidate or return to the station."
