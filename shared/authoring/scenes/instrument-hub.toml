#:schema ../schema/scene.schema.json
# Control Station: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=instrument-hub).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "instrument-hub"
type = "exchange-lab"
name = "Control Station"
summary = "One hub for investigative equipment, grouped by location. Open hands a ready item to the classify screen."
tickets = ["SSL-496", "SSL-663"]
qa = ["control-station"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/InstrumentHubScreen.tsx", "web/components/game/control-station/"]
native = ["native/App/Screens/ControlStationScreen.swift"]

[preview]
route = "instrument-hub"
state = "ui-instrument-hub"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "control-station"
kind = "world"
layout = "host"
mechanics = ["instruments"]
note = "Instrument station scene."

[[objects]]
id = "instrument-feed"
kind = "collection"
parent = "control-station"
layout = "host"
mechanics = ["instruments"]
note = "One signal UI element per unresolved observation."

[[objects]]
id = "body-selector"
kind = "panel"
parent = "control-station"
layout = "host"
mechanics = ["instruments"]
note = "Filter observations by body."

[[objects]]
id = "survey-console"
kind = "instrument"
parent = "control-station"
layout = "host"
mechanics = ["instruments"]
note = "Start and resolve survey scans."

[[objects]]
id = "survey-charts"
kind = "collection"
parent = "control-station"
layout = "host"
mechanics = ["instruments"]
note = "Earned charts and claimable plots."

[[objects]]
id = "inspect-action"
kind = "button"
parent = "control-station"
layout = "host"
mechanics = ["instruments"]
note = "Open the appropriate instrument review."

[[objects]]
id = "research-calendar"
kind = "panel"
parent = "control-station"
layout = "host"
mechanics = ["community-research"]
note = "UTC participation calendar in the instrument scene; not a separate screen."

[[objects]]
id = "research-tasks"
kind = "collection"
parent = "research-calendar"
layout = "host"
mechanics = ["community-research"]
note = "Today's qualifying research tasks and earned stamps."

[[objects]]
id = "community-progress"
kind = "panel"
parent = "research-calendar"
layout = "host"
mechanics = ["community-research"]
note = "Current implementation uses local contribution data. Server aggregation and reward settlement remain gaps, not verified gameplay."
