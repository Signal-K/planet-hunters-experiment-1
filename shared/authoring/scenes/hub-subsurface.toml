#:schema ../schema/scene.schema.json
# Base Subsurface: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=hub-subsurface).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "hub-subsurface"
type = "base"
name = "Base Subsurface"
summary = "The below-soil logistics deck reached from the base. Silos live underground only."
qa = ["subsurface"]

[runtime]
surface = "dom"
web = ["web/components/game/hub/HubSubsurfaceView.tsx"]
native = ["native/App/Screens/BaseUnderground.swift"]

[preview]
route = "hub-subsurface"
state = "ui-subsurface"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "underground"
kind = "world"
layout = "host"
mechanics = ["construction"]
note = "The below-soil deck of the same base."

[[objects]]
id = "rooms"
kind = "collection"
parent = "underground"
layout = "host"
mechanics = ["construction"]
note = "Built storage and service rooms; generated from player state."

[[objects]]
id = "excavation-sites"
kind = "collection"
parent = "underground"
layout = "host"
mechanics = ["construction"]
note = "Available underground room sites."

[[objects]]
id = "storage-readout"
kind = "panel"
parent = "underground"
layout = "host"
mechanics = ["delivery"]
note = "Canonical stash and capacity."

[[objects]]
id = "return-action"
kind = "button"
parent = "underground"
layout = "host"
mechanics = ["construction"]
note = "Return to the surface."
