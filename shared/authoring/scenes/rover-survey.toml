#:schema ../schema/scene.schema.json
# Rover Survey: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=rover-survey).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "rover-survey"
type = "field"
name = "Rover Survey"
summary = "Starter-rover scouting surface for survey and tutorial observation before the ship laser handles extraction."
tickets = ["SSL-485", "SSL-486", "SSL-487"]
qa = ["rover", "rover-touchdown"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/RoverSurveyScreen.tsx"]
native = ["native/App/Screens/RoverFieldScreen.swift", "native/App/Screens/TakeonSceneScreen.swift"]

[preview]
route = "rover-survey"
state = "ui-rover-survey"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "survey-field"
kind = "world"
layout = "host"
mechanics = ["field-engine", "sandbox", "instruments"]
note = "Rover field or TakeOn adapter selected by the feature flag."

[[objects]]
id = "rover"
kind = "vehicle"
parent = "survey-field"
layout = "host"
mechanics = ["field-engine"]
note = "Surface survey vehicle, separate from laser extraction."

[[objects]]
id = "survey-markers"
kind = "collection"
parent = "survey-field"
layout = "host"
mechanics = ["instruments"]
note = "Field observation targets."

[[objects]]
id = "drive-controls"
kind = "panel"
parent = "survey-field"
layout = "host"
mechanics = ["field-engine"]
note = "Movement and interaction commands."

[[objects]]
id = "survey-result"
kind = "panel"
parent = "survey-field"
layout = "host"
mechanics = ["instruments"]
note = "Observation result before returning."

[[objects]]
id = "complete-action"
kind = "button"
parent = "survey-field"
layout = "host"
mechanics = ["flight"]
note = "Complete the survey using the canonical transition."
