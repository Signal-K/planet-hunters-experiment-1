#:schema ../schema/scene.schema.json
# Rocket Purchase: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=rocket-buy).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "rocket-buy"
type = "build"
name = "Rocket Purchase"
summary = "Buy the rocket model for this run."
qa = ["rocket-buy"]

[runtime]
surface = "dom"
web = ["web/components/game/MissionSetupRoutes.tsx"]
native = ["native/App/Screens/LaunchReview.swift"]

[preview]
route = "rocket-buy"
state = "ui-rocket-buy"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "launchpad-preview"
kind = "group"
layout = "host"
mechanics = ["rocket-assembly"]
note = "Mission preparation uses the Launchpad renderer."

[[objects]]
id = "vehicle-options"
kind = "collection"
parent = "launchpad-preview"
layout = "host"
mechanics = ["rocket-assembly"]
note = "Rocket/loadout selection from the shared catalog."

[[objects]]
id = "mission-plan"
kind = "panel"
parent = "launchpad-preview"
layout = "host"
mechanics = ["mission-planning"]
note = "Destination, vehicle and cargo requirements."

[[objects]]
id = "purchase-action"
kind = "button"
parent = "launchpad-preview"
layout = "host"
mechanics = ["rocket-assembly"]
note = "Purchase or roll out using the canonical wallet and staged vehicle."

[[objects]]
id = "part-choices"
kind = "collection"
parent = "launchpad-preview"
layout = "host"
mechanics = ["rocket-assembly"]
note = "Optional fitting controls."
