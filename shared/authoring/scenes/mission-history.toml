#:schema ../schema/scene.schema.json
# Mission Log: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=mission-history).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "mission-history"
type = "menu"
name = "Mission Log"
summary = "The log of past missions."
qa = ["mission-log"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/MissionHistoryScreen.tsx"]
native = ["native/App/Screens/BaseRecordScreens.swift"]

[preview]
route = "mission-history"
state = "ui-mission-log"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "mission-records"
kind = "collection"
layout = "host"
mechanics = ["records"]
note = "Canonical completed mission history."

[[objects]]
id = "record-detail"
kind = "panel"
parent = "mission-records"
layout = "host"
mechanics = ["records"]
note = "Selected operation, cargo and outcome."

[[objects]]
id = "back-action"
kind = "button"
parent = "mission-records"
layout = "host"
mechanics = ["records"]
note = "Return to the base."
