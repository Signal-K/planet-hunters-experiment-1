#:schema ../schema/scene.schema.json
# Landing: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=landing).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "landing"
type = "travel"
name = "Landing"
summary = "Touchdown at the target before mining begins."
tickets = ["SSL-898"]
qa = ["landing", "solar-visual"]

[runtime]
surface = "canvas"
web = ["web/components/game/screens/LandingScreen.tsx", "web/components/game/screens/LandingScene.tsx"]
native = ["native/App/Screens/FlightScreens.swift"]
engine = ["web/public/game/scenes/landing.scene.json"]

[preview]
route = "landing"
state = "ui-landing"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "landing-world"
kind = "world"
layout = "host"
mechanics = ["landing"]
note = "Target approach environment."

[[objects]]
id = "landing-craft"
kind = "vehicle"
parent = "landing-world"
layout = "host"
mechanics = ["landing"]
note = "Descent or redocking animation."

[[objects]]
id = "landing-progress"
kind = "panel"
parent = "landing-world"
layout = "host"
mechanics = ["landing"]
note = "Progress from the persisted landing start timestamp."

[[objects]]
id = "continue-action"
kind = "button"
parent = "landing-world"
layout = "host"
mechanics = ["landing"]
note = "Complete touchdown or redocking once ready."

[[objects]]
id = "pause-action"
kind = "button"
parent = "landing-world"
layout = "host"
mechanics = ["landing"]
note = "Pause at the hub without discarding the operation."

[[objects]]
id = "solar-body-coverage"
kind = "world"
layout = "host"
note = "SSL-898: the existing solar visual fixture reviews planets, parented major moons and asteroid locations with shared Takeon radius/biome samples. Orbit and landing keep a common site; gas giants are orbit-only. The observed-imagery control labels absent data and does not claim measured procedural terrain."
