#:schema ../schema/scene.schema.json
# Astronaut Academy: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=academy).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "academy"
type = "exchange-lab"
name = "Astronaut Academy"
summary = "Earth-side crew training scene with a light editorial roster and observable Academy activity."
qa = ["academy"]

[runtime]
surface = "canvas"
web = ["web/components/game/screens/AcademyScreen.tsx", "web/components/game/screens/AcademyCanvas.tsx"]
native = ["native/App/Screens/AcademyScreen.swift"]
engine = ["web/public/game/scenes/academy.scene.json"]

[preview]
route = "academy"
state = "ui-academy"
