#:schema ../schema/scene.schema.json
# Solar System Map: scene script. Edit here or in the Scene Studio (http://localhost:3001/game/studio?scene=targets).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "targets"
type = "menu"
name = "Solar System Map"
summary = "Mission destination preparation. The routed setup adapter currently presents the Launchpad; the old standalone target-map asset is not the route renderer."
tickets = ["SSL-426", "SSL-450", "SSL-411"]
qa = ["launch-review"]

[runtime]
surface = "canvas"
web = ["web/components/game/MissionSetupRoutes.tsx", "web/components/game/screens/LaunchpadScreen.tsx"]
native = ["native/App/Screens/LaunchReview.swift"]
engine = ["web/public/game/scenes/target-picker.scene.json"]

[preview]
route = "targets"
state = "ui-target-picker"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "mission-plan"
kind = "panel"
layout = "host"
mechanics = ["mission-planning"]
note = "Route currently renders mission preparation; do not infer a standalone solar map from its name."

[[objects]]
id = "target-picker"
kind = "collection"
parent = "mission-plan"
layout = "host"
mechanics = ["mission-planning"]
note = "Destination choices use the shared target catalog."

[[objects]]
id = "launchpad-preview"
kind = "group"
parent = "mission-plan"
layout = "host"
mechanics = ["rocket-assembly"]
note = "Reusable launchpad presentation from the mission setup adapter."

[[objects]]
id = "continue-action"
kind = "button"
parent = "mission-plan"
layout = "host"
mechanics = ["mission-planning"]
note = "Proceed with the selected destination."
