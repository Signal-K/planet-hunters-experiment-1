#:schema ../schema/scene.schema.json
# Intro: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=intro).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "intro"
type = "menu"
name = "Intro"
summary = "Choose the base biome and begin placement after authentication. Sign-in is a host gate, not this scene."
tickets = ["SSL-451"]
qa = ["intro"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/IntroScreen.tsx"]
native = ["native/App/Screens/BaseRecordScreens.swift"]

[preview]
route = "intro"
state = "m1-intro"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "biome-preview"
kind = "world"
layout = "host"
mechanics = ["world"]
note = "Selected landing-site environment."

[[objects]]
id = "biome-picker"
kind = "panel"
parent = "biome-preview"
layout = "host"
mechanics = ["construction"]
note = "Choose the base biome before the first placement."

[[objects]]
id = "begin-action"
kind = "button"
parent = "biome-preview"
layout = "host"
mechanics = ["training"]
note = "Continue through the canonical intro transition."
