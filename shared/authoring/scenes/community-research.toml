#:schema ../schema/scene.schema.json
# Community research: scene script. Edit here or in the Scene Studio (http://localhost:4320/game/studio?scene=community-research).
# Objects listed here are the scene's game objects. Objects marked status = "proposed" are requests for an agent to build.
format = 1
id = "community-research"
type = "menu"
name = "Community research"
summary = "Daily stamps, the shared monthly bar, the live event week and the community votes."
tickets = ["SSL-746", "SSL-757"]
qa = ["community-research"]

[runtime]
surface = "dom"
web = ["web/components/game/screens/CommunityResearchScreen.tsx"]
native = []

[preview]
route = "community-research"
state = "ui-community-research"


# Source-backed hierarchy. Host-owned nodes are inspectable contracts, not migrated layouts.

[[objects]]
id = "event-week"
kind = "panel"
layout = "host"
mechanics = ["records"]
note = "The live meteor shower week with the player's event stamps and a join button."

[[objects]]
id = "research-calendar"
kind = "panel"
layout = "host"
mechanics = ["records"]
note = "Daily stamps, the streak and the shared community bar."

[[objects]]
id = "back-action"
kind = "button"
layout = "host"
mechanics = ["records"]
note = "Return to the base."

[[objects]]
id = "community-ballots"
kind = "panel"
layout = "host"
mechanics = ["records"]
note = "SSL-757: the sky vote and the launch vote beside the weekly path choice (Votes tab once a path is chosen). Server-owned ballots; one vote per player, changeable until close. Stage fixtures: add &ballots=open, &ballots=voted or &ballots=closed to /game/stage?preset=ui-community-research. Never blocks path choice."

[[objects]]
id = "community-consensus"
kind = "panel"
layout = "host"
mechanics = ["records"]
note = "SSL-746: the review area. Any player can ask for consensus on their own classification (ASK COMMUNITY key on the finished readout) and review others'. The reviewer runs the instrument first; only then is the requester's readout released and Support, Dispute (with a reason) or Unsure accepted. Reviewers never see running counts. Verified at ceil(log2(active players + 1)) supports, 3 to 9, with disputes under a third of supports. Reachable without choosing a weekly path. Stage fixtures: add &consensus=queue, &consensus=review or &consensus=settled to /game/stage?preset=ui-community-research. Transit only so far; asteroid and Saturn follow."
