#:schema ../schema/template.schema.json
# Contract: a client wants ore from a body. Fly out, find it, cut it, bring it home.
# Two methods, picked before launch: the ship laser from orbit (default) or a rover on the surface.
format = 1
id = "contract-mining"
title = "Mining contract"
family = "contract"
summary = "A client wants a set amount of minerals from one body. The body's survey probe has already mapped the seams: cut them with the ship laser from orbit, or land a rover and cut them on the ground, then fly the haul home."
vehicle = "lander"
methods = ["orbit-laser", "rover"]

[match]
id_prefixes = ["probe-contract-"]
tags = ["STARTER", "BULK", "PROSPECT", "COMMAND", "MINING"]

[[beat]]
id = "brief"
label = "Contract"
view = "board"
goal = "Read what the client wants and what it pays."
controls = ["accept"]

[[beat]]
id = "fit"
label = "Fit out"
view = "hangar"
goal = "Fit the ship laser and cargo pods for the order, or stow a rover to mine on the surface."
controls = ["fit-loadout"]

[[beat]]
id = "launch"
label = "Launch"
view = "pad"
goal = "Ignite, then drop each stage as it burns out."
controls = ["ignite", "stage"]

[[beat]]
id = "transit"
label = "Transit"
view = "map"
goal = "Hop to the target; each hop costs fuel."
controls = ["hop", "choose"]

[[beat]]
id = "cut"
label = "Laser"
view = "orbit"
goal = "Fly the pass: slide over the seams the probe mapped and hold the laser until the order is in the hold."
controls = ["steer", "laser", "cargo"]
repeat = true
method = "orbit-laser"

[[beat]]
id = "site"
label = "Site"
view = "orbit"
goal = "Pick a landing site on a vein the probe mapped."
controls = ["pick-site"]
method = "rover"

[[beat]]
id = "land"
label = "Land"
view = "field"
goal = "Hold to thrust and steer onto the pad ring."
controls = ["thrust", "tilt"]
method = "rover"

[[beat]]
id = "mine"
label = "Mine"
view = "field"
goal = "Drive to the ore the probe mapped and cut it with the rover laser until the order is in the hold."
controls = ["drive", "laser", "cargo", "drop-cargo"]
repeat = true
method = "rover"

[[beat]]
id = "lift"
label = "Lift off"
view = "field"
goal = "Drive back aboard and take off."
controls = ["take-off"]
method = "rover"

[[beat]]
id = "return"
label = "Fly home"
view = "map"
goal = "Hop home."
controls = ["hop"]

[[beat]]
id = "debrief"
label = "Debrief"
view = "debrief"
goal = "Hand over the order and get paid."
controls = ["store", "sell"]

[outcome]
success = "The ordered minerals reach the client."
fail = "Hull reaches zero or the player aborts; the cargo is lost."
unlocks = "Client affinity and larger orders."
