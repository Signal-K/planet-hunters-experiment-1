#:schema ../schema/template.schema.json
# Contract: a client wants ore from a body. Fly out, find it, cut it, bring it home.
format = 1
id = "contract-mining"
title = "Mining contract"
family = "contract"
summary = "A client wants a set amount of minerals from one body. Scan for the ore, cut it with the laser and fly it home."
vehicle = "lander"

[match]
id_prefixes = ["probe-contract-"]
tags = ["STARTER", "BULK", "PROSPECT", "COMMAND", "MINING"]

[[beat]]
id = "brief"
label = "Contract"
view = "board"
goal = "Read what the client wants and what it pays."
controls = ["accept"]

[[beat]]
id = "fit"
label = "Fit out"
view = "hangar"
goal = "Load a laser, tanks and enough cargo pods for the order."
controls = ["fit-loadout"]

[[beat]]
id = "launch"
label = "Launch"
view = "pad"
goal = "Ignite, then drop each stage as it burns out."
controls = ["ignite", "stage"]

[[beat]]
id = "transit"
label = "Transit"
view = "map"
goal = "Hop to the target; each hop costs fuel."
controls = ["hop", "choose"]

[[beat]]
id = "orbit"
label = "Orbit"
view = "orbit"
goal = "Geoscan the surface and pick a landing site on a vein."
controls = ["geoscan", "pick-site"]

[[beat]]
id = "land"
label = "Land"
view = "field"
goal = "Hold to thrust and steer onto the pad ring."
controls = ["thrust", "tilt"]

[[beat]]
id = "mine"
label = "Mine"
view = "field"
goal = "Scan, drive to the ore, cut it with the laser until the order is in the hold."
controls = ["drive", "scan", "laser", "cargo", "drop-cargo"]
repeat = true

[[beat]]
id = "return"
label = "Fly home"
view = "map"
goal = "Take off and hop home."
controls = ["take-off", "hop"]

[[beat]]
id = "debrief"
label = "Debrief"
view = "debrief"
goal = "Hand over the order and get paid."
controls = ["store", "sell"]

[outcome]
success = "The ordered minerals reach the client."
fail = "Hull reaches zero or the player aborts; the cargo is lost."
unlocks = "Client affinity and larger orders."
