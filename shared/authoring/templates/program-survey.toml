#:schema ../schema/template.schema.json
# Program: follow up something your hardware found. Only probes scan: a probe reads the target, then you can design a ship for it.
format = 1
id = "program-survey"
title = "Probe follow-up"
family = "program"
summary = "Follow up a discovery: send a probe to read the target. What it finds is what you design the next ship for."
vehicle = "probe"

[match]
id_prefixes = ["exo-survey-"]
tags = ["SCIENCE"]

[[beat]]
id = "pick"
label = "Target"
view = "base"
goal = "Pick the discovery to follow up."
controls = ["accept"]

[[beat]]
id = "launch"
label = "Launch"
view = "pad"
goal = "Ignite, then drop each stage as it burns out."
controls = ["ignite", "stage"]

[[beat]]
id = "transit"
label = "Transit"
view = "map"
goal = "Hop to the target."
controls = ["hop", "choose"]

[[beat]]
id = "observe"
label = "Observe"
view = "orbit"
goal = "Release the probe. It takes the readings from orbit while you keep the target in its reticle."
controls = ["release", "observe"]

[[beat]]
id = "debrief"
label = "Results"
view = "debrief"
goal = "The probe sends its readings home."
controls = ["submit"]

[outcome]
success = "The probe's readings are home."
unlocks = "Target intelligence: richer deposits and new targets on the map."
