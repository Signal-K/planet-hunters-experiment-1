#:schema ../schema/template.schema.json
# Contract: a client pays for knowledge of a place: mapped sectors, deposits, landmarks.
# Only probes scan: you build and fly the probe, release it into orbit, and it maps the body.
format = 1
id = "contract-exploration"
title = "Exploration contract"
family = "contract"
summary = "A client wants a body surveyed: fly a survey probe there, release it into orbit, and let it map the sectors. Its map is what the client pays for."
vehicle = "probe"

[match]
tags = ["SURVEY", "EXPLORE"]

[[beat]]
id = "brief"
label = "Contract"
view = "board"
goal = "See which body and how many sectors the client wants mapped."
controls = ["accept"]

[[beat]]
id = "launch"
label = "Launch"
view = "pad"
goal = "Ignite, then drop each stage as it burns out."
controls = ["ignite", "stage"]

[[beat]]
id = "transit"
label = "Transit"
view = "map"
goal = "Hop to the target."
controls = ["hop", "choose"]

[[beat]]
id = "release"
label = "Release"
view = "orbit"
goal = "Release the probe into orbit. The ship flies home empty."
controls = ["release"]

[[beat]]
id = "survey"
label = "Survey"
view = "orbit"
goal = "The probe maps one sector at a time on its own. Watch the map fill."
controls = ["observe"]
repeat = true

[[beat]]
id = "debrief"
label = "Report"
view = "debrief"
goal = "Hand the client the probe's map."
controls = ["submit"]

[outcome]
success = "Every requested sector is mapped."
fail = "The probe never reaches orbit."
unlocks = "Mapped deposits become mining offers."
