#:schema ../schema/template.schema.json
# Program: no client. Pick a target, mine what looks valuable, keep or sell it.
format = 1
id = "program-free-mining"
title = "Free mining"
family = "program"
summary = "Pick any reachable target, mine what is worth it from orbit or with a rover, and keep or sell the haul. Probe finds point you at the good spots."
vehicle = "lander"
methods = ["orbit-laser", "rover"]

[match]
ids = ["freeops-self-directed-mining"]
id_prefixes = ["self-directed-", "freeops-self-directed-"]
tags = ["FREE OPS"]

[[beat]]
id = "pick"
label = "Target"
view = "map"
goal = "Pick a target; probe finds are marked."
controls = ["hop"]

[[beat]]
id = "launch"
label = "Launch"
view = "pad"
goal = "Ignite, then drop each stage as it burns out."
controls = ["ignite", "stage"]

[[beat]]
id = "transit"
label = "Transit"
view = "map"
goal = "Hop to the target."
controls = ["hop", "choose"]

[[beat]]
id = "survey"
label = "Survey"
view = "orbit"
goal = "Geoscan the surface from orbit; only scanned ore can be cut."
controls = ["geoscan"]

[[beat]]
id = "cut"
label = "Laser"
view = "orbit"
goal = "Fly the pass: slide over scanned ore and hold the laser until the hold is full or the value is right."
controls = ["steer", "scan", "laser", "cargo"]
repeat = true
method = "orbit-laser"

[[beat]]
id = "site"
label = "Site"
view = "orbit"
goal = "Pick a landing site on a scanned vein."
controls = ["pick-site"]
method = "rover"

[[beat]]
id = "land"
label = "Land"
view = "field"
goal = "Hold to thrust and steer onto the pad ring."
controls = ["thrust", "tilt"]
method = "rover"

[[beat]]
id = "mine"
label = "Mine"
view = "field"
goal = "Drive to scanned ore and cut until the hold is full or the value is right."
controls = ["drive", "scan", "laser", "cargo", "drop-cargo"]
repeat = true
method = "rover"

[[beat]]
id = "lift"
label = "Lift off"
view = "field"
goal = "Drive back aboard and take off."
controls = ["take-off"]
method = "rover"

[[beat]]
id = "return"
label = "Fly home"
view = "map"
goal = "Hop home."
controls = ["hop"]

[[beat]]
id = "debrief"
label = "Haul"
view = "debrief"
goal = "Store the haul at base or sell it."
controls = ["store", "sell"]

[outcome]
success = "Anything brought home is kept or sold."
fail = "Hull reaches zero; the haul is lost."
