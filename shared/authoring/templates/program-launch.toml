#:schema ../schema/template.schema.json
# Program: put your own hardware in space. Satellites send feeds; probes map a body over time.
format = 1
id = "program-launch"
title = "Launch a satellite or probe"
family = "program"
summary = "Launch your own satellite or probe, put it on the right orbit and switch it on. It keeps working after you leave."
vehicle = "satellite"

[match]
id_prefixes = ["story-", "probe-launch-"]
tags = ["STORY"]

[[beat]]
id = "pick"
label = "Choose"
view = "base"
goal = "Pick the satellite or probe and where it goes."
controls = ["accept"]

[[beat]]
id = "fit"
label = "Payload"
view = "hangar"
goal = "Mount it in the payload bay."
controls = ["fit-loadout"]

[[beat]]
id = "launch"
label = "Launch"
view = "pad"
goal = "Ignite, then drop each stage as it burns out."
controls = ["ignite", "stage"]

[[beat]]
id = "transit"
label = "Transit"
view = "map"
goal = "Probes only: hop to the body it will map."
controls = ["hop"]

[[beat]]
id = "insert"
label = "Orbit"
view = "orbit"
goal = "Burn at the marker and hold until the predicted orbit sits on the ring."
controls = ["burn"]

[[beat]]
id = "deploy"
label = "Deploy"
view = "orbit"
goal = "Release it and unfold its panels."
controls = ["release", "unfold"]

[[beat]]
id = "debrief"
label = "Online"
view = "debrief"
goal = "See what it will send home and when."
controls = ["store"]

[outcome]
success = "The hardware is on orbit and switched on."
unlocks = "Satellites add a daily feed to classify; probes map one sector at a time and turn finds into runs and offers."
