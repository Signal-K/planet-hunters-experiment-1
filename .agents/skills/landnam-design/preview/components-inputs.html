<!doctype html>
<!-- @dsCard group="Components" name="Components · Inputs & Tabs" subtitle="Large terminal field + icon tabs" viewport="700x280" --><html><head><meta charset="utf-8"><title>Components — Inputs & Tabs</title><link rel="stylesheet" href="preview.css">
<style>
  .field { display:flex; flex-direction:column; gap:8px; flex:1; min-width:0; }
  .lbl { font-family:var(--ln-font-display); font-size:13px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#3fa9ff; display:flex; align-items:center; gap:8px; }
  .lbl .pip { width:8px; height:8px; background:#3fa9ff; box-shadow:0 0 6px #3fa9ff; }
  .inp {
    background: linear-gradient(180deg, #0a121d 0%, #06090f 100%);
    border:1px solid rgba(63,169,255,0.45);
    border-radius:4px;
    padding:14px 16px;
    font-family:var(--ln-font-mono); font-size:20px; color:#e6efff; letter-spacing:0.04em;
    display:flex; align-items:center; gap:12px;
    position:relative; overflow:hidden;
    box-shadow: inset 0 0 0 1px rgba(63,169,255,0.10), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .inp::before {
    content:''; position:absolute; inset:0;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(63,169,255,0.04) 3px 4px);
    pointer-events:none;
  }
  .inp.focus {
    border-color:#3fa9ff;
    box-shadow: 0 0 0 2px rgba(63,169,255,0.25), inset 0 0 0 1px rgba(63,169,255,0.20), 0 0 24px rgba(63,169,255,0.25);
  }
  .inp > * { position:relative; z-index:2; }
  .icon { width:22px; height:22px; flex:0 0 auto; }
  .ph { color: rgba(230,239,255,0.35); }
  .caret { width:2px; height:22px; background:#3fa9ff; animation:blink 1s steps(2) infinite; box-shadow:0 0 6px #3fa9ff; }
  @keyframes blink { 50% { opacity:0; } }

  /* tab */
  .seg-tab {
    display:flex; gap:0; padding:0;
    background: linear-gradient(180deg, #06090f 0%, #04080f 100%);
    border:1px solid rgba(63,169,255,0.3);
    border-radius:6px; overflow:hidden;
  }
  .tab {
    padding:14px 26px;
    font-family:var(--ln-font-display); font-size:16px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase;
    color:#5d7390; cursor:pointer;
    border-right:1px solid rgba(63,169,255,0.18);
    display:flex; align-items:center; gap:10px;
    position:relative;
  }
  .tab:last-child { border-right:none; }
  .tab .ico { width:18px; height:18px; }
  .tab.on {
    background: linear-gradient(180deg, rgba(63,169,255,0.18) 0%, rgba(63,169,255,0.05) 100%);
    color:#3fa9ff;
  }
  .tab.on::after {
    content:''; position:absolute; left:14px; right:14px; bottom:0; height:2px;
    background:#3fa9ff; box-shadow:0 0 8px #3fa9ff;
  }
  .corner-mark { position:absolute; width:8px; height:8px; }
  .inp .cm-tl { top:-1px; left:-1px; border-top:1.5px solid #3fa9ff; border-left:1.5px solid #3fa9ff; }
  .inp .cm-br { bottom:-1px; right:-1px; border-bottom:1.5px solid #3fa9ff; border-right:1.5px solid #3fa9ff; }
</style></head>
<body>
<div class="card" data-stamp="INPUTS · TABS" style="height:280px">
  <div class="row" style="gap:18px;align-items:flex-end">
    <div class="field">
      <div class="lbl"><span class="pip"></span>QUERY SECTOR · FOCUS</div>
      <div class="inp focus">
        <span class="corner-mark cm-tl"></span><span class="corner-mark cm-br"></span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3fa9ff" stroke-width="2"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="20" y2="20"/></svg>
        <span>SOL_3</span>
        <span class="caret"></span>
        <span style="margin-left:auto;font-family:var(--ln-font-mono);font-size:11px;letter-spacing:0.18em;color:#5d7390;text-transform:uppercase">3 RESULTS</span>
      </div>
    </div>
    <div class="field">
      <div class="lbl" style="color:#5d7390"><span class="pip" style="background:#5d7390;box-shadow:none"></span>QUERY · IDLE</div>
      <div class="inp" style="border-color:rgba(63,169,255,0.18)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#5d7390" stroke-width="2"><circle cx="11" cy="11" r="6"/><line x1="15.5" y1="15.5" x2="20" y2="20"/></svg>
        <span class="ph">Search stars or coordinates…</span>
        <span style="margin-left:auto;font-family:var(--ln-font-mono);font-size:11px;letter-spacing:0.18em;color:#5d7390;text-transform:uppercase">⌘ K</span>
      </div>
    </div>
  </div>

  <div style="margin-top:24px">
    <div class="seg-tab">
      <div class="tab"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>SOLAR SYSTEM</div>
      <div class="tab on"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12 C 6 6, 18 6, 21 12 C 18 18, 6 18, 3 12 Z"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>GALAXY</div>
      <div class="tab"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,3 21,8 21,16 12,21 3,16 3,8"/></svg>SECTOR</div>
    </div>
  </div>
</div>
</body></html>
