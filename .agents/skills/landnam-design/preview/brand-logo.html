<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Wordmark" subtitle="Rocket lifting a deployed satellite payload" viewport="700x240" --><html><head><meta charset="utf-8"><title>Brand — Logo</title><link rel="stylesheet" href="preview.css"></head>
<body>
<div class="card" data-stamp="WORDMARK · FAIRING OPEN" style="height:260px">
  <div class="eyebrow" style="margin-bottom:10px">Payload fairing splitting open · satellite deploying from inside · mining-and-scanning loop</div>
  <div class="row" style="gap:24px;align-items:center">
    <!-- Symbol -->
    <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
      <!-- frame -->
      <rect x="4" y="4" width="192" height="192" rx="16" stroke="#3fa9ff" stroke-opacity="0.25" stroke-width="1.2"/>
      <!-- corner ticks -->
      <path d="M12 22 L12 12 L22 12 M188 12 L178 12 M188 22 L188 12 M12 178 L12 188 L22 188 M188 178 L188 188 L178 188" stroke="#3fa9ff" stroke-opacity="0.6" stroke-width="1.2"/>
      <!-- blueprint grid -->
      <g stroke="#3fa9ff" stroke-opacity="0.06" stroke-width="0.8">
        <line x1="40" y1="20" x2="40" y2="180"/>
        <line x1="80" y1="20" x2="80" y2="180"/>
        <line x1="120" y1="20" x2="120" y2="180"/>
        <line x1="160" y1="20" x2="160" y2="180"/>
        <line x1="20" y1="40" x2="180" y2="40"/>
        <line x1="20" y1="80" x2="180" y2="80"/>
        <line x1="20" y1="120" x2="180" y2="120"/>
        <line x1="20" y1="160" x2="180" y2="160"/>
      </g>

      <!-- centerline -->
      <line x1="100" y1="20" x2="100" y2="180" stroke="#3fa9ff" stroke-opacity="0.25" stroke-width="0.8" stroke-dasharray="2 3"/>

      <!-- EXHAUST PLUME -->
      <path d="M92 154 L96 178 L100 184 L104 178 L108 154 Z" fill="#f5a623" opacity="0.55"/>
      <path d="M88 154 L100 192 L112 154 Z" fill="#f5a623" opacity="0.22"/>

      <!-- FINS -->
      <path d="M86 134 L70 152 L86 146 Z" fill="#3fa9ff" opacity="0.9"/>
      <path d="M114 134 L130 152 L114 146 Z" fill="#3fa9ff" opacity="0.9"/>

      <!-- ROCKET BODY · tube -->
      <rect x="86" y="76" width="28" height="78" rx="2" fill="#cde4ff" stroke="#0a121d" stroke-width="1.2"/>
      <!-- body panel lines -->
      <line x1="86" y1="100" x2="114" y2="100" stroke="#0a121d" stroke-width="0.6" opacity="0.6"/>
      <line x1="86" y1="124" x2="114" y2="124" stroke="#0a121d" stroke-width="0.6" opacity="0.6"/>
      <!-- LANDNAM badge on hull -->
      <rect x="90" y="108" width="20" height="8" fill="#3fa9ff" stroke="#0a121d" stroke-width="0.6"/>
      <text x="100" y="114" text-anchor="middle" fill="#0a121d" font-family="monospace" font-size="5" font-weight="700" letter-spacing="0.4">VX12</text>

      <!-- FAIRING — split open, the two halves swung outward -->
      <!-- left half -->
      <g transform="translate(0,0)">
        <path d="M86 76 L60 40 L48 28 L52 70 L66 76 Z" fill="#3fa9ff" stroke="#0a121d" stroke-width="1.2"/>
        <line x1="60" y1="48" x2="68" y2="64" stroke="#0a121d" stroke-width="0.6" opacity="0.4"/>
      </g>
      <!-- right half -->
      <g>
        <path d="M114 76 L140 40 L152 28 L148 70 L134 76 Z" fill="#3fa9ff" stroke="#0a121d" stroke-width="1.2"/>
        <line x1="140" y1="48" x2="132" y2="64" stroke="#0a121d" stroke-width="0.6" opacity="0.4"/>
      </g>

      <!-- SATELLITE inside the open fairing -->
      <g transform="translate(100,52)">
        <!-- solar panels -->
        <rect x="-30" y="-3" width="18" height="6" fill="#f5a623"/>
        <rect x="-30" y="-3" width="18" height="6" fill="none" stroke="#0a121d" stroke-width="0.7"/>
        <line x1="-24" y1="-3" x2="-24" y2="3" stroke="#0a121d" stroke-width="0.5"/>
        <line x1="-18" y1="-3" x2="-18" y2="3" stroke="#0a121d" stroke-width="0.5"/>
        <line x1="-12" y1="0" x2="-7" y2="0" stroke="#cde4ff" stroke-width="0.8"/>

        <rect x="12" y="-3" width="18" height="6" fill="#f5a623"/>
        <rect x="12" y="-3" width="18" height="6" fill="none" stroke="#0a121d" stroke-width="0.7"/>
        <line x1="18" y1="-3" x2="18" y2="3" stroke="#0a121d" stroke-width="0.5"/>
        <line x1="24" y1="-3" x2="24" y2="3" stroke="#0a121d" stroke-width="0.5"/>
        <line x1="7" y1="0" x2="12" y2="0" stroke="#cde4ff" stroke-width="0.8"/>

        <!-- body -->
        <rect x="-7" y="-7" width="14" height="14" rx="1" fill="#cde4ff" stroke="#0a121d" stroke-width="1"/>
        <line x1="-7" y1="-2" x2="7" y2="-2" stroke="#0a121d" stroke-width="0.5"/>
        <line x1="-7" y1="3" x2="7" y2="3" stroke="#0a121d" stroke-width="0.5"/>

        <!-- dish on top -->
        <path d="M-5 -7 L-5 -14 L5 -14 L5 -7 Z" fill="#f5a623" stroke="#0a121d" stroke-width="0.8"/>
        <line x1="0" y1="-14" x2="0" y2="-20" stroke="#f5a623" stroke-width="1.4"/>
        <circle cx="0" cy="-20" r="1.6" fill="#f5a623"/>
        <!-- signal -->
        <path d="M-7 -24 Q 0 -30 7 -24" stroke="#f5a623" stroke-width="0.8" fill="none" opacity="0.85"/>
        <path d="M-11 -28 Q 0 -36 11 -28" stroke="#f5a623" stroke-width="0.7" fill="none" opacity="0.5"/>
      </g>

      <!-- deployment arrows showing fairing splitting -->
      <path d="M58 30 L48 22" stroke="#f5a623" stroke-width="1" opacity="0.7"/>
      <polygon points="48,22 50,28 54,24" fill="#f5a623" opacity="0.7"/>
      <path d="M142 30 L152 22" stroke="#f5a623" stroke-width="1" opacity="0.7"/>
      <polygon points="152,22 150,28 146,24" fill="#f5a623" opacity="0.7"/>
    </svg>

    <div class="col" style="gap:8px">
      <div class="ln-eyebrow" style="color:#5d7390">STAR SAILORS · EXPERIMENT 01</div>
      <div style="font-family:var(--ln-font-display);font-weight:800;font-size:64px;line-height:0.86;letter-spacing:0.02em;color:#e6efff">LANDNAM</div>
      <div class="row" style="gap:10px;align-items:center;margin-top:4px">
        <span style="font-family:var(--ln-font-display);font-size:13px;font-weight:700;letter-spacing:0.22em;color:#3fa9ff;text-transform:uppercase">MINE · SCAN · SETTLE</span>
        <span style="width:6px;height:6px;background:#f5a623;border-radius:999px"></span>
        <span style="font-family:var(--ln-font-mono);font-size:12px;letter-spacing:0.18em;color:#5d7390;text-transform:uppercase">EARTH BASE · LV 04</span>
      </div>
    </div>
  </div>
</div>
</body></html>
