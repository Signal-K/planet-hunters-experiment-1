version: "3.9"
services:
  kanban:
    build: .
    ports:
      - "4444:4444"
    volumes:
      - kanban-data:/app/kanban-data
      - ./public:/app/public  # live-reload public files in dev
    environment:
      - PORT=4444
      - KANBAN_DATA_DIR=/app/kanban-data
      # Paste your BLOB_READ_WRITE_TOKEN from the Vercel dashboard.
      # With this set, Docker reads locally (fast) and writes to both
      # local JSON + Vercel Blob. On startup it pulls any prod changes.
      - BLOB_READ_WRITE_TOKEN=${BLOB_READ_WRITE_TOKEN}
    restart: unless-stopped

volumes:
  kanban-data:
