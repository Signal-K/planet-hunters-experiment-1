<!doctype html><html><head><meta charset="utf-8"><title>Type — Atlas Mono</title><link rel="stylesheet" href="preview.css">
<style>
  .star {
    width:18px; height:18px; border-radius:999px; background:#f5a623;
    box-shadow:0 0 24px rgba(245,166,35,0.7), 0 0 60px rgba(245,166,35,0.35);
    display:inline-block; flex:0 0 auto;
    animation: twinkle 2.4s var(--ln-ease-out) infinite;
  }
  @keyframes twinkle { 0%,100% { transform:scale(1); opacity:1 } 50% { transform:scale(1.18); opacity:0.85 } }
  .marquee { font-family:var(--ln-font-mono); font-weight:700; font-size:46px; letter-spacing:0.04em; color:#efe7d3; line-height:1; }
  .small { font-family:var(--ln-font-mono); font-size:13px; letter-spacing:0.22em; text-transform:uppercase; color:#b5ad99; }
</style></head>
<body>
<div class="card atlas" data-stamp="TURRET ROAD · CATALOG" style="height:200px;background:#0a0c10">
  <div class="row" style="gap:18px;align-items:center">
    <div class="star"></div>
    <div class="marquee">SOL 0.00 LY</div>
  </div>
  <div class="row" style="gap:36px;margin-top:24px">
    <div><div class="small" style="color:#6b6552">CLASS</div><div class="marquee" style="font-size:22px;margin-top:4px">G2V</div></div>
    <div><div class="small" style="color:#6b6552">AGE</div><div class="marquee" style="font-size:22px;margin-top:4px">4.57 GYR</div></div>
    <div><div class="small" style="color:#6b6552">PLANETS</div><div class="marquee" style="font-size:22px;margin-top:4px;color:#f5a623">8</div></div>
  </div>
</div>
</body></html>
