<!doctype html><html><head><meta charset="utf-8"><title>Brand — Nav Icons</title><link rel="stylesheet" href="preview.css">
<style>
  .ico { display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px; background:#0a121d; border:1px solid var(--ln-hairline); border-radius:8px; min-width:96px; }
  .ico img { width:32px; height:32px; filter: invert(82%) sepia(8%) saturate(420%) hue-rotate(180deg) brightness(96%) contrast(92%); }
  .ico .lbl { font-family:var(--ln-font-display); font-size:11px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#a9b8ce; }
</style></head>
<body>
<div class="card" data-stamp="NAV ICONS · HAND-DRAWN" style="height:180px">
  <div class="eyebrow" style="margin-bottom:14px">Sourced from the Godot scene · stroke 2 · flat caps · inherits currentColor</div>
  <div class="row" style="gap:12px;flex-wrap:wrap">
    <div class="ico"><img src="../assets/icons/nav_back.svg" alt=""><div class="lbl">Back</div></div>
    <div class="ico"><img src="../assets/icons/nav_forward.svg" alt=""><div class="lbl">Forward</div></div>
    <div class="ico"><img src="../assets/icons/nav_menu.svg" alt=""><div class="lbl">Menu</div></div>
    <div class="ico"><img src="../assets/icons/nav_mission.svg" alt=""><div class="lbl">Mission</div></div>
    <div class="ico"><img src="../assets/icons/nav_map.svg" alt=""><div class="lbl">Map</div></div>
    <div class="ico"><img src="../assets/icons/nav_market.svg" alt=""><div class="lbl">Market</div></div>
  </div>
</div>
</body></html>
