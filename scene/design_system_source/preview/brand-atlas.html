<!doctype html><html><head><meta charset="utf-8"><title>Brand — Atlas Starfield</title><link rel="stylesheet" href="preview.css">
<style>
  .atlas-scene {
    position:relative;
    height:340px;
    background: radial-gradient(120% 80% at 50% 50%, #08101e 0%, #03060a 100%);
    border-radius:8px;
    overflow:hidden;
  }
  /* faint grid */
  .grid {
    position:absolute; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(0deg, transparent 0 79px, rgba(120,150,200,0.06) 79px 80px),
      repeating-linear-gradient(90deg, transparent 0 79px, rgba(120,150,200,0.06) 79px 80px);
  }
  /* background star dust */
  .dust {
    position:absolute; inset:0;
    background:
      radial-gradient(1px 1px at 7% 14%, rgba(220,230,255,0.55), transparent 60%),
      radial-gradient(1px 1px at 22% 30%, rgba(220,230,255,0.4), transparent 60%),
      radial-gradient(1.2px 1.2px at 30% 60%, rgba(220,230,255,0.55), transparent 60%),
      radial-gradient(1px 1px at 44% 18%, rgba(220,230,255,0.45), transparent 60%),
      radial-gradient(1.4px 1.4px at 58% 36%, rgba(220,230,255,0.55), transparent 60%),
      radial-gradient(1px 1px at 67% 65%, rgba(220,230,255,0.45), transparent 60%),
      radial-gradient(1px 1px at 76% 22%, rgba(220,230,255,0.55), transparent 60%),
      radial-gradient(1.3px 1.3px at 86% 70%, rgba(220,230,255,0.45), transparent 60%),
      radial-gradient(1px 1px at 92% 18%, rgba(220,230,255,0.5), transparent 60%),
      radial-gradient(1px 1px at 4% 78%, rgba(220,230,255,0.35), transparent 60%),
      radial-gradient(1.1px 1.1px at 26% 82%, rgba(220,230,255,0.45), transparent 60%),
      radial-gradient(1px 1px at 48% 88%, rgba(220,230,255,0.4), transparent 60%),
      radial-gradient(1.2px 1.2px at 62% 84%, rgba(220,230,255,0.5), transparent 60%),
      radial-gradient(1px 1px at 80% 92%, rgba(220,230,255,0.35), transparent 60%);
  }

  /* SVG layer carries orbit rings + constellation links */
  .links { position:absolute; inset:0; }

  /* star chips */
  .star { position:absolute; transform:translate(-50%,-50%); }
  .star .dot { width:9px; height:9px; border-radius:999px; }
  .star.sol .dot { background:#fff7c8; box-shadow:0 0 10px #fff7c8, 0 0 22px rgba(255,225,140,0.6); }
  .star.warm .dot { background:#ffa46a; box-shadow:0 0 6px #ffa46a; }
  .star.cool .dot { background:#cfe2ff; box-shadow:0 0 6px #cfe2ff; }
  .star.red .dot { background:#ff7676; box-shadow:0 0 6px #ff7676; }
  .star.pale .dot { background:#f0f4ff; box-shadow:0 0 4px rgba(240,244,255,0.7); }
  .star .lbl {
    position:absolute; left:12px; top:-4px;
    padding:1px 5px;
    background:#0a0c12;
    font-family:var(--ln-font-mono); font-size:10px; letter-spacing:0.06em;
    color:#d8e0ee; white-space:nowrap;
  }
  .star .lbl .d { color:#7a8294; margin-left:6px; font-size:9px; }
  .star.sel .lbl { background:#1a1208; color:#f5a623; }

  /* reticle around SOL */
  .reticle {
    position:absolute; left:45%; top:55%; transform:translate(-50%,-50%);
    width:40px; height:40px;
    border:1px solid #efe7d3;
  }
  .reticle::before, .reticle::after { content:''; position:absolute; background:#efe7d3; }
  .reticle::before { left:50%; top:-7px; width:1px; height:7px; }
  .reticle::after  { left:50%; bottom:-7px; width:1px; height:7px; }
  .reticle .h1, .reticle .h2 { position:absolute; top:50%; width:7px; height:1px; background:#efe7d3; }
  .reticle .h1 { left:-7px; }
  .reticle .h2 { right:-7px; }

  /* top floating row */
  .topchips { position:absolute; top:10px; left:10px; right:10px; display:flex; align-items:center; gap:8px; }
  .ic {
    width:30px; height:30px; border-radius:999px;
    background: rgba(8,10,14,0.7);
    border:1px solid rgba(160,180,210,0.18);
    display:flex; align-items:center; justify-content:center;
    color: #cde4ff;
  }
  .search {
    flex:1; max-width:340px; margin:0 auto;
    border-bottom:1px solid rgba(160,180,210,0.35);
    padding:6px 10px;
    font-family:var(--ln-font-mono); font-size:11px; letter-spacing:0.18em; color:#7a8294; text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
</style></head>
<body>
<div class="card atlas" data-stamp="ATLAS · GALAXY + ORBITS" style="height:380px;padding:0;background:#03060a">
  <div class="atlas-scene">
    <div class="dust"></div>
    <div class="grid"></div>

    <!-- SVG: orbit rings (around SOL) + constellation links between stars -->
    <svg class="links" viewBox="0 0 700 340" preserveAspectRatio="none">
      <!-- concentric orbit rings (solar-system pattern) -->
      <g fill="none" stroke="#efe7d3" stroke-opacity="0.10" stroke-width="1">
        <ellipse cx="315" cy="187" rx="40" ry="22"/>
        <ellipse cx="315" cy="187" rx="76" ry="42"/>
        <ellipse cx="315" cy="187" rx="120" ry="66"/>
        <ellipse cx="315" cy="187" rx="170" ry="92"/>
        <ellipse cx="315" cy="187" rx="222" ry="120" stroke-dasharray="2 4"/>
      </g>

      <!-- constellation links: dotted lines between major stars -->
      <g stroke="#cde4ff" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="2 4" fill="none">
        <line x1="100"  y1="58"  x2="208"  y2="120"/>  <!-- VEGA → PROCYON -->
        <line x1="208"  y1="120" x2="315"  y2="187"/>  <!-- PROCYON → SOL -->
        <line x1="476"  y1="100" x2="315"  y2="187"/>  <!-- SIRIUS → SOL -->
        <line x1="315"  y1="187" x2="420"  y2="212"/>  <!-- SOL → ALPHA CENTAURI -->
        <line x1="315"  y1="187" x2="280"  y2="252"/>  <!-- SOL → BARNARD'S -->
        <line x1="420"  y1="212" x2="560"  y2="265"/>  <!-- ALPHA → ALTAIR -->
        <line x1="280"  y1="252" x2="140"  y2="288"/>  <!-- BARNARD → FOMALHAUT -->
      </g>

      <!-- labelled distance ticks on a couple of links -->
      <g fill="#7a8294" font-family="monospace" font-size="8" letter-spacing="0.8">
        <text x="245" y="156">8.6 ly</text>
        <text x="370" y="200">4.4 ly</text>
        <text x="290" y="218">5.9 ly</text>
      </g>
    </svg>

    <!-- floating top row -->
    <div class="topchips">
      <div class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></div>
      <div class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg></div>
      <div style="flex:1"></div>
      <div class="search"><span>⌕</span><span>SEARCH STARS OR COORDINATES…</span></div>
      <div style="flex:1"></div>
      <div class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></div>
      <div class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,3 3,8 12,13 21,8"/><path d="M3 13 L12 18 L21 13 M3 18 L12 23 L21 18"/></svg></div>
    </div>

    <!-- stars · positions in %  -->
    <div class="star cool"  style="left:14.3%; top:17%"><div class="dot"></div><div class="lbl">VEGA <span class="d">25.1 ly</span></div></div>
    <div class="star pale"  style="left:29.7%; top:35.3%"><div class="dot"></div><div class="lbl">PROCYON <span class="d">11.46 ly</span></div></div>
    <div class="star cool"  style="left:68%; top:29.4%"><div class="dot"></div><div class="lbl">SIRIUS <span class="d">8.60 ly</span></div></div>
    <div class="star sol sel"   style="left:45%; top:55%"><div class="dot"></div><div class="lbl" style="left:16px">SOL <span class="d" style="color:#d68a0d">0.00 ly</span></div></div>
    <div class="reticle"><span class="h1"></span><span class="h2"></span></div>
    <div class="star warm"  style="left:60%; top:62.4%"><div class="dot"></div><div class="lbl">ALPHA CENTAURI <span class="d">4.37 ly</span></div></div>
    <div class="star red"   style="left:40%; top:74%"><div class="dot"></div><div class="lbl">BARNARD'S STAR <span class="d">5.96 ly</span></div></div>
    <div class="star pale"  style="left:80%; top:78%"><div class="dot"></div><div class="lbl">ALTAIR <span class="d">16.7 ly</span></div></div>
    <div class="star pale"  style="left:20%; top:84.7%"><div class="dot"></div><div class="lbl">FOMALHAUT <span class="d">25.1 ly</span></div></div>
  </div>
</div>
</body></html>
