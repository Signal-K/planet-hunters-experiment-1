<!doctype html><html><head><meta charset="utf-8"><title>Colors — Text</title><link rel="stylesheet" href="preview.css"></head>
<body>
<div class="card" data-stamp="TEXT TONE" style="height:200px">
  <div class="eyebrow" style="margin-bottom:14px">Foreground · 4 tones; never reach for neutral grays outside this set</div>
  <div class="col" style="gap:14px">
    <div class="row"><div style="width:120px;height:32px;background:#e6efff;border-radius:4px"></div><div style="color:#e6efff;font-family:var(--ln-font-display);font-weight:600">PRIMARY READOUT</div><div class="grow"></div><div class="hex" style="font-size:12px;color:#5d7390">#E6EFFF · --ln-text</div></div>
    <div class="row"><div style="width:120px;height:32px;background:#a9b8ce;border-radius:4px"></div><div style="color:#a9b8ce">Body / paragraph text</div><div class="grow"></div><div class="hex" style="font-size:12px;color:#5d7390">#A9B8CE · --ln-text-dim</div></div>
    <div class="row"><div style="width:120px;height:32px;background:#5d7390;border-radius:4px"></div><div style="color:#5d7390">Caption · axis labels · ver</div><div class="grow"></div><div class="hex" style="font-size:12px;color:#5d7390">#5D7390 · --ln-text-muted</div></div>
    <div class="row"><div style="width:120px;height:32px;background:rgba(230,239,255,0.35);border-radius:4px"></div><div style="color:rgba(230,239,255,0.35)">Ghost · placeholder text</div><div class="grow"></div><div class="hex" style="font-size:12px;color:#5d7390">35% --ln-text · ghost</div></div>
  </div>
</div>
</body></html>
