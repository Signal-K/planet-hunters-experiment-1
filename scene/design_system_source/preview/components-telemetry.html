<!doctype html><html><head><meta charset="utf-8"><title>Components — Telemetry Rows</title><link rel="stylesheet" href="preview.css">
<style>
  .panel { background:#0a121d; border:1px solid var(--ln-hairline); border-radius:8px; padding:16px 18px; }
  .head { display:flex; align-items:center; gap:10px; }
  .head .title { font-family:var(--ln-font-display); font-size:14px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#3fa9ff; }
  .head .side { margin-left:auto; font-family:var(--ln-font-mono); font-size:11px; letter-spacing:0.18em; color:#5d7390; text-transform:uppercase; }
  .rows { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-top:14px; }
  .item .k { font-family:var(--ln-font-display); font-size:11px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#5d7390; }
  .item .v { font-family:var(--ln-font-display); font-size:24px; font-weight:700; color:#e6efff; letter-spacing:-0.01em; }
  .item .v .u { font-size:13px; color:#a9b8ce; margin-left:6px; letter-spacing:0.08em; }
  .item .v.amber { color:#f5a623; }
</style></head>
<body>
<div class="card" data-stamp="TELEMETRY PANEL" style="height:220px">
  <div class="eyebrow" style="margin-bottom:14px">Compact info module · always key-above-value, never inline</div>
  <div class="panel">
    <div class="head"><span style="width:14px;height:14px;background:#3fa9ff;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);display:inline-block"></span><div class="title">VESSEL DIAGNOSTICS</div><div class="side">VESSEL-X12 · HEAVY</div></div>
    <div class="rows">
      <div class="item"><div class="k">Total mass</div><div class="v">140<span class="u">T</span></div></div>
      <div class="item"><div class="k">Power draw</div><div class="v amber">12<span class="u">MW</span></div></div>
      <div class="item"><div class="k">Cargo</div><div class="v">220<span class="u">u</span></div></div>
      <div class="item"><div class="k">Range</div><div class="v">3.8<span class="u">AU</span></div></div>
    </div>
  </div>
</div>
</body></html>
