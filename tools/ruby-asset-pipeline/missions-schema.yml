# Mission/event definition schema for Landnam.
#
# This file serves as both the schema reference and a set of annotated example
# mission definitions. The Ruby pipeline reads authored YAML files in this format
# and generates seed data for PocketBase and the TypeScript static fallback.
#
# ─── SCHEMA ─────────────────────────────────────────────────────────────────
#
# mission_templates:
#   - id: string                   # slug — referenced by missions[].template
#     tag: string                  # display label: STARTER | BULK | PROSPECT | COMMAND
#     difficulty: string           # L1 | L2 | L3
#     mineral_keys: string[]       # minerals this template can supply; runtime picks from here
#     cargo_range: [integer, integer]   # [min, max] cargo units per mineral
#     drill_tier_min: integer      # minimum drill tier required
#     orbit_max: integer           # maximum orbit reachable
#     contractor_role: string      # starter | bulk | prospect | command | science
#     payout_multiplier: number    # multiplier applied in payout_formula
#     payout_formula: string       # human-readable formula (Go evaluates this, not Ruby)
#
# missions:
#   - id: string
#     template: string             # mission_templates[].id — tag/difficulty/drill_tier/
#                                  #   orbit_max are inherited from the template at build time
#     title: string
#     brief: string
#     contractor: string           # ContractorSlot id
#     sequence: integer            # 1 = M1-tier, 2 = M2-tier, 3 = M3-tier, 4 = M4-tier
#     locked: boolean
#     unlock:                      # optional — omit for sequence-1 missions
#       requires_mission: string   # mission id that must be completed first
#       label: string              # human-readable hint shown in UI (e.g. "Complete M1")
#     requires:
#       minerals:
#         <mineral_id>: integer    # one entry per required mineral
#       # cargo_min is auto-computed as sum(minerals.values) — do not author manually
#       # drill_tier and max_orbit are inherited from the template — do not author manually
#     target_id: string            # optional — fixed destination target (asteroid/planet id)
#                                  #   omit for open-target missions; required for DELIVERY type
#     payload:                     # optional — special cargo attached to this mission
#       type: string               # payload kind — currently only 'rover'
#       name: string               # display name shown in mission brief
#       cargo_cost: integer        # cargo slots consumed by the payload
#     payout:
#       francs: integer            # base payout in francs (author for seeded missions;
#                                  #   generated missions compute this from payout_formula)
#       xp: integer                # optional — XP awarded; defaults to francs / 10000
#       affinity: integer          # affinity points awarded to the contractor
#     events:                      # optional — ordered list of events fired at debrief
#       - trigger: string          # debrief_complete | mission_accepted | on_launch
#         kind: string             # unlock_popup | toast | screen_transition
#         payload:                 # freeform map interpreted per event kind
#           <key>: <value>
#
# event_chains:                    # optional top-level key for standalone chained events
#   - id: string
#     trigger: string              # fires_after_mission | fires_after_missions_count
#     mission_id: string           # (fires_after_mission only)
#     count: integer               # (fires_after_missions_count only)
#     events:
#       - kind: string
#         payload:
#           <key>: <value>
#
# Edge cases where YAML falls short (candidates for future DSL parser):
#   1. Conditional reward formulas (e.g. bonus only if mission completes in < 60s) cannot
#      be expressed as static YAML values — they require a predicate. Current workaround:
#      express the formula as a human-readable string and implement logic in Go.
#   2. Multi-step event sequences with timing delays (e.g. popup 2s after debrief) are
#      representable but verbose — a DSL with `after(2s)` syntax would be cleaner.
#   3. Dynamic mineral selection per-mission (template declares keys, runtime picks one)
#      is currently handled by Go seed code; if designers need to author this directly,
#      a DSL with range/random expressions would replace the cargo_range heuristic.
#   4. Cross-mission state checks (e.g. "only fire if contractor affinity >= 20") require
#      runtime evaluation — YAML can declare the threshold but not the comparison logic.
#
# ─── EXAMPLES ────────────────────────────────────────────────────────────────

mission_templates:
  - id: starter-bulk
    tag: STARTER
    difficulty: L1
    mineral_keys: [iron, silicon, carbon]
    cargo_range: [4, 8]
    drill_tier_min: 1
    orbit_max: 4
    contractor_role: starter
    payout_multiplier: 1.0
    payout_formula: mineral_base_price * amount * 1600 * multiplier

  - id: volatile-bulk
    tag: BULK
    difficulty: L2
    mineral_keys: [ice, carbon, silicon]
    cargo_range: [8, 14]
    drill_tier_min: 1
    orbit_max: 5
    contractor_role: bulk
    payout_multiplier: 1.35
    payout_formula: mineral_base_price * amount * 1450 * multiplier

  - id: metal-prospect
    tag: PROSPECT
    difficulty: L2
    mineral_keys: [nickel, cobalt, gold]
    cargo_range: [3, 8]
    drill_tier_min: 2
    orbit_max: 5
    contractor_role: prospect
    payout_multiplier: 2.25
    payout_formula: mineral_base_price * amount * 1350 * multiplier

  - id: command-reserve
    tag: COMMAND
    difficulty: L3
    mineral_keys: [gold, rare, cobalt]
    cargo_range: [3, 6]
    drill_tier_min: 2
    orbit_max: 6
    contractor_role: command
    payout_multiplier: 3.5
    payout_formula: mineral_base_price * amount * 1300 * multiplier

  # Free-ops templates — available after M3 completes (sequence >= 4)
  - id: freeops-delivery
    tag: DELIVERY
    difficulty: L1
    mineral_keys: [hydrogen, cobalt, copper, aluminium]
    cargo_range: [4, 10]
    drill_tier_min: 1
    orbit_max: 5
    contractor_role: starter
    payout_multiplier: 1.25
    payout_formula: mineral_base_price * amount * 1500 * multiplier

  - id: freeops-mining-survey
    tag: SURVEY
    difficulty: L1
    mineral_keys: [cobalt, copper, aluminium, gold]
    cargo_range: [3, 7]
    drill_tier_min: 1
    orbit_max: 5
    contractor_role: prospect
    payout_multiplier: 1.55
    payout_formula: mineral_base_price * amount * 1500 * multiplier

  - id: freeops-bulk-run
    tag: BULK
    difficulty: L1
    mineral_keys: [hydrogen, aluminium, copper]
    cargo_range: [8, 16]
    drill_tier_min: 1
    orbit_max: 5
    contractor_role: bulk
    payout_multiplier: 1.15
    payout_formula: mineral_base_price * amount * 1500 * multiplier

missions:
  # ── M1: single mineral, starter template, no unlock gate ──────────────────
  - id: m1-iron
    template: starter-bulk
    title: Iron Reserve Order
    brief: Contractor Slot 03A needs a starter iron shipment from a reachable asteroid.
    contractor: contractor-03a
    sequence: 1
    locked: false
    requires:
      minerals:
        iron: 6
    payout:
      francs: 13500000
      affinity: 10
    events:
      - trigger: debrief_complete
        kind: unlock_popup
        payload:
          popup_id: sr2
          parts: [hull-mk2, fusion-b2, laser-t2]

  # ── M2: single mineral, volatile template, unlocks after M1 ───────────────
  - id: m2-silicon
    template: volatile-bulk
    title: Silicon Bulk Order
    brief: Contractor Slot 03B needs raw silicon for electronics-grade supply contracts.
    contractor: contractor-03b
    sequence: 2
    locked: false
    unlock:
      requires_mission: m1-iron
      label: Complete M1
    requires:
      minerals:
        silicon: 8
    payout:
      francs: 18600000
      affinity: 8

  # ── M3: two minerals, volatile template, higher cargo load ────────────────
  - id: m3-ice-carbon
    template: volatile-bulk
    title: Volatile Extraction Order
    brief: Contractor Slot 05C needs ice and carbon for atmospheric processing research.
    contractor: contractor-05c
    sequence: 3
    locked: false
    unlock:
      requires_mission: m2-silicon
      label: Complete M2
    requires:
      minerals:
        ice: 9
        carbon: 6
    payout:
      francs: 29500000
      affinity: 14

  # ── M4: three minerals, command template, event chain on completion ────────
  - id: m4-command-gold
    template: command-reserve
    title: Command Reserve Shipment
    brief: Deep Command needs a full mixed-metal reserve for relay station construction.
    contractor: contractor-07a
    sequence: 4
    locked: false
    unlock:
      requires_mission: m3-ice-carbon
      label: Complete M3
    requires:
      minerals:
        gold: 4
        rare: 3
        cobalt: 3
    payout:
      francs: 62000000
      xp: 6200
      affinity: 20
    events:
      - trigger: debrief_complete
        kind: unlock_popup
        payload:
          popup_id: sr3
          parts: [hull-mk3, plasma-c3, laser-t3]
      - trigger: debrief_complete
        kind: screen_transition
        payload:
          to: hub
          delay_ms: 1200

  # ── Authored delivery mission: fixed target, rover payload ────────────────
  # This pattern covers AUTHORED_MISSIONS entries such as lnm_m3_ore_delivery.
  # target_id pins the mission to a specific asteroid; payload declares the
  # rover cargo that the player must carry (consumes cargo slots).
  - id: lnm_m3_ore_delivery
    template: freeops-delivery
    title: Lutetia Survey Drop
    brief: >
      Kepler Materials needs a survey rover delivered to 21 Lutetia. Swap your
      mining laser for the Cargo Module, fly out, and collect a small ore sample
      on the way home.
    contractor: kepler-materials
    sequence: 3
    locked: false
    unlock:
      requires_mission: m2-silicon
      label: Complete 2 contracts
    target_id: lutetia
    payload:
      type: rover
      name: KI Survey Rover Mk1
      cargo_cost: 3
    requires:
      minerals:
        nickel: 2
    payout:
      francs: 800000
      affinity: 18

event_chains: []
