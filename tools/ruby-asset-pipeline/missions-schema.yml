# Mission/template definition schema for Landnam resource-collection missions.
#
# The current seed uses active onboarding resource_collection missions only.
#
# Schema:
#
# mission_templates:
#   - id: string
#     tag: string
#     difficulty: string
#     mineral_keys: string[]       # minerals this template can request
#     cargo_range: [integer, integer]
#     drill_tier_min: integer
#     orbit_max: integer
#     contractor_role: string
#     payout_multiplier: number
#     payout_formula: string       # human-readable formula, not executable Ruby
#
# missions:
#   - id: string
#     template: string             # mission_templates.id
#     title: string
#     brief: string
#     contractor: string           # contractor slot id
#     sequence: integer
#     locked: boolean
#     unlock:                     # optional
#       requires_mission: string
#       label: string
#     requires:
#       minerals:
#         <mineral_id>: integer
#     reward:
#       affinity: integer
#     events:                     # optional — ordered list of events to fire at debrief
#       - trigger: string         # when: debrief_complete | mission_accepted | on_launch
#         kind: string            # unlock_popup | toast | screen_transition
#         payload:                # freeform map interpreted by each event kind
#           <key>: <value>
#
# event_chains:                   # optional top-level key for standalone chained events
#   - id: string
#     trigger: string             # fires_after_mission | fires_after_missions_count
#     mission_id: string          # (fires_after_mission only)
#     count: integer              # (fires_after_missions_count only)
#     events:
#       - kind: string
#         payload:
#           <key>: <value>
#
# Edge cases where YAML falls short (candidates for future DSL parser):
#   1. Conditional reward formulas (e.g. bonus only if speed < 60s) cannot be expressed
#      as static YAML values — they require a predicate. Current workaround: express the
#      formula as a human-readable string (payout_formula) and implement the logic in Go.
#   2. Multi-step event sequences with timing delays (e.g. popup 2s after debrief) are
#      representable but verbose — a DSL with `after(2s)` syntax would be cleaner.
#   3. Dynamic mineral selection per-mission (template declares keys, runtime picks one)
#      is currently handled by Go seed code; if designers need to author this directly,
#      a DSL with range/random expressions would replace the cargo_range heuristic.
#   4. Cross-mission state checks (e.g. "only fire if contractor affinity >= 20") require
#      runtime evaluation — YAML can declare the threshold but not the comparison logic.

mission_templates:
  - id: starter-bulk
    tag: STARTER
    difficulty: L1
    mineral_keys: [iron, silicon, carbon]
    cargo_range: [4, 8]
    drill_tier_min: 1
    orbit_max: 4
    contractor_role: starter
    payout_multiplier: 1.0
    payout_formula: mineral price * amount * 1500 * multiplier

  - id: volatile-bulk
    tag: BULK
    difficulty: L2
    mineral_keys: [ice, carbon, silicon]
    cargo_range: [8, 14]
    drill_tier_min: 1
    orbit_max: 5
    contractor_role: bulk
    payout_multiplier: 1.35
    payout_formula: mineral price * amount * 1500 * multiplier

  - id: metal-prospect
    tag: PROSPECT
    difficulty: L2
    mineral_keys: [nickel, cobalt, gold]
    cargo_range: [3, 8]
    drill_tier_min: 2
    orbit_max: 5
    contractor_role: prospect
    payout_multiplier: 2.25
    payout_formula: mineral price * amount * 1500 * multiplier

  - id: command-reserve
    tag: COMMAND
    difficulty: L3
    mineral_keys: [gold, rare, cobalt]
    cargo_range: [3, 6]
    drill_tier_min: 2
    orbit_max: 6
    contractor_role: command
    payout_multiplier: 3.5
    payout_formula: mineral price * amount * 1500 * multiplier

missions:
  - id: m1-iron
    template: starter-bulk
    title: Iron Reserve Order
    brief: Contractor Slot 03A needs a starter iron shipment from a reachable asteroid.
    contractor: contractor-03a
    sequence: 1
    locked: false
    requires:
      minerals:
        iron: 6
    reward:
      affinity: 10
    events:
      - trigger: debrief_complete
        kind: unlock_popup
        payload:
          popup_id: sr2
          parts: [hull-mk2, fusion-b2, laser-t2]

  - id: m2-silicon
    template: volatile-bulk
    title: Silicon Bulk Order
    brief: Contractor Slot 03B needs raw silicon for electronics-grade supply contracts.
    contractor: contractor-03b
    sequence: 2
    locked: false
    unlock:
      requires_mission: m1-iron
      label: Complete M1
    requires:
      minerals:
        silicon: 8
    reward:
      affinity: 8

event_chains: []
