services:
  geometry-service:
    build:
      context: ./tools/geometry-service
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    environment:
      PORT: "4002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  shared-pb:
    image: ghcr.io/muchobien/pocketbase:0.39.0
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  pocketbase:
    build:
      context: ./pocketbase
      args:
        POCKETBASE_VERSION: "0.39.0"
    ports:
      - "8091:8090"
    volumes:
      - pocketbase-data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./web
      target: dev
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
      - ../.knowns:/knowns:ro
      - ./.knowns-outbox:/knowns-outbox
    environment:
      KNOWNS_CANONICAL_ROOT: /knowns
      KNOWNS_OUTBOX: /knowns-outbox
      POCKETBASE_INTERNAL_URL: http://shared-pb:8090
      POCKETBASE_LANDNAM_INTERNAL_URL: http://pocketbase:8090
      NEXT_PUBLIC_SHARED_PB_URL: http://localhost:8090
      NEXT_PUBLIC_LANDNAM_PB_URL: http://localhost:8091
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      pocketbase:
        condition: service_healthy
      shared-pb:
        condition: service_healthy
      geometry-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/backend-health"]
      interval: 5s
      timeout: 3s
      retries: 20

  cypress:
    image: cypress/included:13.17.0
    working_dir: /e2e
    environment:
      CYPRESS_baseUrl: http://web:3000
      CYPRESS_POCKETBASE_URL: http://pocketbase:8090
      CYPRESS_PROFILE: with-pb
      KNOWNS_CANONICAL_ROOT: /knowns
      KNOWNS_OUTBOX: /knowns-outbox
    volumes:
      - ./cypress.docker.config.js:/e2e/cypress.config.js:ro
      - ./web/cypress:/e2e/cypress:ro
      - ./web/package.json:/e2e/package.json:ro
      - ./web/tsconfig.json:/e2e/tsconfig.json:ro
      - ./web/node_modules:/e2e/node_modules:ro
      - ../.knowns:/knowns:ro
      - ./.knowns-outbox:/knowns-outbox
    depends_on:
      web:
        condition: service_healthy
    profiles: ["e2e"]

volumes:
  pocketbase-data:
  web_node_modules:
  web_next_cache:
