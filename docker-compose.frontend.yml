services:
  web:
    build:
      context: ./web
      target: dev
    pull_policy: never
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    environment:
      POCKETBASE_INTERNAL_URL: http://host.docker.internal:8090
      POCKETBASE_LANDNAM_INTERNAL_URL: http://host.docker.internal:8091
      NEXT_PUBLIC_SHARED_PB_URL: http://localhost:8090
      NEXT_PUBLIC_LANDNAM_PB_URL: http://localhost:8091
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3001"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/backend-health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  web_node_modules:
  web_next_cache:
