name: Tests + Release + Vercel Deploy

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  basic-tests:
    name: Basic Tests (All Pushes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Run unit tests
        shell: bash
        run: npm run test:unit

  godot-tests:
    name: Full Godot Runtime Tests (main only)
    if: github.ref_name == 'main'
    needs: basic-tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot
        id: cache-godot-tests
        uses: actions/cache@v4
        with:
          path: ~/godot-linux
          key: ${{ runner.os }}-godot-4.5-stable
          restore-keys: |
            ${{ runner.os }}-godot-4.5-

      - name: Download Godot
        if: steps.cache-godot-tests.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/godot-linux
          curl -fsSL -o ~/godot-linux/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip"
          unzip -q ~/godot-linux/godot.zip -d ~/godot-linux
          mv ~/godot-linux/Godot_v4.5-stable_linux.x86_64 ~/godot-linux/godot
          chmod +x ~/godot-linux/godot

      - name: Run Godot suites
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/scene"
          
          # Filter out harmless theme initialization warnings
          filter_output() {
            grep -v "add_theme_style_override" | \
            grep -v "at: add_theme_style_override" | \
            grep -v "Condition \"p_style.is_null()\"" | \
            grep -v "RIDs of type \"CanvasItem\" were leaked" | \
            grep -v "at: _free_rids" | \
            grep -v "ObjectDB instances leaked" | \
            grep -v "at: cleanup" | \
            grep -v "resources still in use at exit" | \
            grep -v "at: clear" || true
          }
          
          ~/godot-linux/godot --headless --path . --script res://tests/run_sync_tests.gd 2>&1 | filter_output
          ~/godot-linux/godot --headless --path . --script res://tests/run_mission_log_tests.gd 2>&1 | filter_output
          ~/godot-linux/godot --headless --path . --script res://tests/run_tutorial_tests.gd 2>&1 | filter_output
          ~/godot-linux/godot --headless --path . --script res://tests/run_experience_tests.gd 2>&1 | filter_output
          ~/godot-linux/godot --headless --path . --script res://tests/SupabaseTestRunner.gd 2>&1 | filter_output

  app-unit-tests:
    name: Full App Unit Tests (main only)
    if: github.ref_name == 'main'
    needs: godot-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci

      - name: Run unit tests
        shell: bash
        run: npm run test:unit

  export-godot-preview:
    name: Export Godot Assets (non-main)
    if: github.ref_name != 'main'
    needs: basic-tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5-stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci

      - name: Install Godot + templates for web export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          cd .godot-bin
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_PATH="$PWD/Godot_v4.5-stable_linux.x86_64"
          chmod +x "$GODOT_PATH"
          echo "GODOT_EDITOR=$GODOT_PATH" >> "$GITHUB_ENV"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.stable"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_export_templates.tpz"
          rm -rf .godot-templates
          mkdir -p .godot-templates
          unzip -q templates.tpz -d .godot-templates
          mkdir -p "$TEMPLATE_DIR"
          TEMPLATE_SOURCE_DIR="$(find .godot-templates -type f -name 'web_nothreads_release.zip' -print -quit | xargs -I{} dirname "{}")"
          if [ -z "$TEMPLATE_SOURCE_DIR" ]; then
            echo "Could not locate Godot web export templates in downloaded archive"
            find .godot-templates -maxdepth 4 -type f | sed -n '1,40p'
            exit 1
          fi
          cp -R "$TEMPLATE_SOURCE_DIR"/* "$TEMPLATE_DIR/"
          mkdir -p /tmp/godot/export_templates/4.5.stable
          cp -R "$TEMPLATE_DIR"/* /tmp/godot/export_templates/4.5.stable/

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          cd scene
          timeout 90s "$GODOT_EDITOR" --headless --path . --import --quit || true
          echo "✓ Project imported"

      - name: Install Xvfb
        shell: bash
        run: sudo apt-get install -y xvfb

      - name: Export Godot desktop web assets
        shell: bash
        run: xvfb-run --auto-servernum npm run godot:export:desktop

      - name: Upload Godot web export (preview)
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-export-preview
          path: electron-dist/godot-web/**
          if-no-files-found: error

  export-godot:
    name: Export Godot Assets (main only)
    if: github.ref_name == 'main'
    needs: app-unit-tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5-stable"
      PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Inject production Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROD_SUPABASE_URL:-}" ] || [ -z "${PROD_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing required secrets: PROD_SUPABASE_URL and/or PROD_SUPABASE_ANON_KEY"
            exit 1
          fi

          cat > scene/supabase.runtime.json <<EOF
          {"supabaseUrl":"${PROD_SUPABASE_URL}","supabaseAnonKey":"${PROD_SUPABASE_ANON_KEY}"}
          EOF

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          cd .godot-bin

          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_PATH="$PWD/Godot_v4.5-stable_linux.x86_64"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.stable"

          chmod +x "$GODOT_PATH" || true
          echo "GODOT_EDITOR=$GODOT_PATH" >> "$GITHUB_ENV"

          # Install export templates (required for --export-release)
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_export_templates.tpz"
          rm -rf .godot-templates
          mkdir -p .godot-templates
          unzip -q templates.tpz -d .godot-templates

          mkdir -p "$TEMPLATE_DIR"
          TEMPLATE_SOURCE_DIR="$(find .godot-templates -type f -name 'web_nothreads_release.zip' -print -quit | xargs -I{} dirname "{}")"
          if [ -z "$TEMPLATE_SOURCE_DIR" ]; then
            echo "Could not locate Godot web export templates in downloaded archive"
            find .godot-templates -maxdepth 4 -type f | sed -n '1,120p'
            exit 1
          fi
          cp -R "$TEMPLATE_SOURCE_DIR"/* "$TEMPLATE_DIR/"

          # Also mirror templates to the script's GODOT_USER_DIR default.
          mkdir -p /tmp/godot/export_templates/4.5.stable
          cp -R "$TEMPLATE_DIR"/* /tmp/godot/export_templates/4.5.stable/

          test -f "$TEMPLATE_DIR/web_nothreads_release.zip"
          test -f "$TEMPLATE_DIR/web_nothreads_debug.zip"

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          cd scene
          timeout 90s "$GODOT_EDITOR" --headless --path . --import --quit || true
          echo "✓ Project imported"

      - name: Install Xvfb
        shell: bash
        run: sudo apt-get install -y xvfb

      - name: Export Godot desktop web assets
        shell: bash
        run: xvfb-run --auto-servernum npm run godot:export:desktop

      - name: Upload Godot web export
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-export
          path: electron-dist/godot-web/**
          if-no-files-found: error

  deploy-preview:
    name: Deploy to Vercel Preview (non-main)
    if: github.ref_name != 'main'
    needs: [basic-tests, export-godot-preview]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Download Godot web export (preview)
        uses: actions/download-artifact@v4
        with:
          name: godot-web-export-preview
          path: electron-dist/godot-web

      - name: Sync game assets
        shell: bash
        run: npm run web:sync-game

      - name: Pull Vercel preview environment
        shell: bash
        run: npx vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Build Vercel preview artifacts
        shell: bash
        run: npx vercel build --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Deploy preview
        shell: bash
        run: npx vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}

  deploy-production:
    name: Deploy to Vercel Production (main)
    if: github.ref_name == 'main'
    needs: export-godot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Download Godot web export (production)
        uses: actions/download-artifact@v4
        with:
          name: godot-web-export
          path: electron-dist/godot-web

      - name: Sync game assets
        shell: bash
        run: npm run web:sync-game

      - name: Pull Vercel production environment
        shell: bash
        run: npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Build Vercel production artifacts
        shell: bash
        run: npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Deploy production
        shell: bash
        run: npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
