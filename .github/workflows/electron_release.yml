name: Tests + Release + Vercel Deploy

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  basic-tests:
    name: Basic Tests (All Pushes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Run unit tests
        shell: bash
        run: npm run test:unit

  godot-tests:
    name: Full Godot Runtime Tests (main only)
    if: github.ref_name == 'main'
    needs: basic-tests
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot
        id: cache-godot-tests
        uses: actions/cache@v4
        with:
          path: ~/godot-linux
          key: ${{ runner.os }}-godot-4.5-stable
          restore-keys: |
            ${{ runner.os }}-godot-4.5-

      - name: Download Godot
        if: steps.cache-godot-tests.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/godot-linux
          curl -fsSL -o ~/godot-linux/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip"
          unzip -q ~/godot-linux/godot.zip -d ~/godot-linux
          mv ~/godot-linux/Godot_v4.5-stable_linux.x86_64 ~/godot-linux/godot
          chmod +x ~/godot-linux/godot

      - name: Run Godot suites
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/scene"
          
          # Filter out harmless theme initialization warnings
          filter_output() {
            grep -v "add_theme_style_override" | \
            grep -v "at: add_theme_style_override" | \
            grep -v "Condition \"p_style.is_null()\"" | \
            grep -v "RIDs of type \"CanvasItem\" were leaked" | \
            grep -v "at: _free_rids" | \
            grep -v "ObjectDB instances leaked" | \
            grep -v "at: cleanup" | \
            grep -v "resources still in use at exit" | \
            grep -v "at: clear" || true
          }
          
          ~/godot-linux/godot --headless --path . --script res://tests/run_sync_tests.gd 2>&1 | filter_output
          ~/godot-linux/godot --headless --path . --script res://tests/run_mission_log_tests.gd 2>&1 | filter_output
          ~/godot-linux/godot --headless --path . --script res://tests/run_tutorial_tests.gd 2>&1 | filter_output
          ~/godot-linux/godot --headless --path . --script res://tests/run_experience_tests.gd 2>&1 | filter_output
          ~/godot-linux/godot --headless --path . --script res://tests/SupabaseTestRunner.gd 2>&1 | filter_output

  app-unit-e2e-tests:
    name: Full App Unit + E2E Tests (main only)
    if: github.ref_name == 'main'
    needs: godot-tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5-stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Run unit tests
        shell: bash
        run: npm run test:unit

      - name: Install Godot + templates for web export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          cd .godot-bin
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_PATH="$PWD/Godot_v4.5-stable_linux.x86_64"
          chmod +x "$GODOT_PATH"
          echo "GODOT_EDITOR=$GODOT_PATH" >> "$GITHUB_ENV"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.stable"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_export_templates.tpz"
          rm -rf .godot-templates
          mkdir -p .godot-templates
          unzip -q templates.tpz -d .godot-templates
          mkdir -p "$TEMPLATE_DIR"
          TEMPLATE_SOURCE_DIR="$(find .godot-templates -type f -name 'web_nothreads_release.zip' -print -quit | xargs -I{} dirname "{}")"
          cp -R "$TEMPLATE_SOURCE_DIR"/* "$TEMPLATE_DIR/"
          mkdir -p /tmp/godot/export_templates/4.5.stable
          cp -R "$TEMPLATE_DIR"/* /tmp/godot/export_templates/4.5.stable/

      - name: Export Godot web build for e2e
        shell: bash
        run: npm run godot:export:desktop

      - name: Install Playwright browser
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        shell: bash
        run: npm run test:e2e

  expo-export:
    name: Export Godot + Build Expo (main only)
    if: github.ref_name == 'main'
    needs: app-unit-e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-linux
          key: ${{ runner.os }}-godot-4.5-stable
          restore-keys: |
            ${{ runner.os }}-godot-4.5-

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/godot-linux
          chmod 770 ~/godot-linux
          mkdir -p ~/.config/godot
          chmod 770 ~/.config/godot

          DOWNLOAD_URL="https://github.com/godotengine/godot/releases/download/4.5-stable"
          GODOT_BIN="Godot_v4.5-stable_linux.x86_64"
          GODOT_PACKAGE="$GODOT_BIN.zip"

          wget "$DOWNLOAD_URL/$GODOT_PACKAGE" -P ~/godot-linux
          unzip ~/godot-linux/$GODOT_PACKAGE -d ~/godot-linux
          mv ~/godot-linux/$GODOT_BIN ~/godot-linux/godot
          chmod +x ~/godot-linux/godot
          rm ~/godot-linux/$GODOT_PACKAGE

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail
          cd scene
          timeout 60s ~/godot-linux/godot --headless --path . --import --quit || true
          echo "✓ Project imported"

      - name: Ensure iOS output directory exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./ios
          chmod 755 ./ios

      - name: Export Godot (iOS)
        shell: bash
        env:
          GODOT_EDITOR: /home/runner/godot-linux/godot
        run: |
          set -euo pipefail
          chmod +x ./export_godot.sh
          ./export_godot.sh \
            --target ./ios \
            --project ./scene \
            --name GodotTest \
            --preset iOS \
            --platform ios

      - name: Export Godot (Android)
        shell: bash
        env:
          GODOT_EDITOR: /home/runner/godot-linux/godot
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p ./android/app/src/main/assets
          ./export_godot.sh \
            --target ./android/app/src/main/assets \
            --project ./scene \
            --name main \
            --preset Android \
            --platform android || echo "⚠️ Android export skipped (no preset configured)"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Build Expo bundle
        shell: bash
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo export --platform ios

      - name: Archive Expo build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-build
          path: |
            ios/GodotTest.pck
            dist/
          retention-days: 7

  export-godot-preview:
    name: Export Godot Assets (non-main)
    if: github.ref_name != 'main'
    needs: basic-tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5-stable"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci

      - name: Install Godot + templates for web export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          cd .godot-bin
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_PATH="$PWD/Godot_v4.5-stable_linux.x86_64"
          chmod +x "$GODOT_PATH"
          echo "GODOT_EDITOR=$GODOT_PATH" >> "$GITHUB_ENV"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.stable"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_export_templates.tpz"
          rm -rf .godot-templates
          mkdir -p .godot-templates
          unzip -q templates.tpz -d .godot-templates
          mkdir -p "$TEMPLATE_DIR"
          TEMPLATE_SOURCE_DIR="$(find .godot-templates -type f -name 'web_nothreads_release.zip' -print -quit | xargs -I{} dirname "{}")"
          cp -R "$TEMPLATE_SOURCE_DIR"/* "$TEMPLATE_DIR/"
          mkdir -p /tmp/godot/export_templates/4.5.stable
          cp -R "$TEMPLATE_DIR"/* /tmp/godot/export_templates/4.5.stable/

      - name: Export Godot desktop web assets
        shell: bash
        run: npm run godot:export:desktop

      - name: Upload Godot web export (preview)
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-export-preview
          path: electron-dist/godot-web/**
          if-no-files-found: error

  export-godot:
    name: Export Godot Assets (main only)
    if: github.ref_name == 'main'
    needs: app-unit-e2e-tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.5-stable"
      PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Inject production Supabase config
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PROD_SUPABASE_URL:-}" ] || [ -z "${PROD_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing required secrets: PROD_SUPABASE_URL and/or PROD_SUPABASE_ANON_KEY"
            exit 1
          fi

          cat > scene/supabase.runtime.json <<EOF
          {"supabaseUrl":"${PROD_SUPABASE_URL}","supabaseAnonKey":"${PROD_SUPABASE_ANON_KEY}"}
          EOF

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin
          cd .godot-bin

          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_PATH="$PWD/Godot_v4.5-stable_linux.x86_64"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.stable"

          chmod +x "$GODOT_PATH" || true
          echo "GODOT_EDITOR=$GODOT_PATH" >> "$GITHUB_ENV"

          # Install export templates (required for --export-release)
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_export_templates.tpz"
          rm -rf .godot-templates
          mkdir -p .godot-templates
          unzip -q templates.tpz -d .godot-templates

          mkdir -p "$TEMPLATE_DIR"
          TEMPLATE_SOURCE_DIR="$(find .godot-templates -type f -name 'web_nothreads_release.zip' -print -quit | xargs -I{} dirname "{}")"
          if [ -z "$TEMPLATE_SOURCE_DIR" ]; then
            echo "Could not locate Godot web export templates in downloaded archive"
            find .godot-templates -maxdepth 4 -type f | sed -n '1,120p'
            exit 1
          fi
          cp -R "$TEMPLATE_SOURCE_DIR"/* "$TEMPLATE_DIR/"

          # Also mirror templates to the script's GODOT_USER_DIR default.
          mkdir -p /tmp/godot/export_templates/4.5.stable
          cp -R "$TEMPLATE_DIR"/* /tmp/godot/export_templates/4.5.stable/

          test -f "$TEMPLATE_DIR/web_nothreads_release.zip"
          test -f "$TEMPLATE_DIR/web_nothreads_debug.zip"

      - name: Export Godot desktop web assets
        shell: bash
        run: npm run godot:export:desktop

      - name: Upload Godot web export
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-export
          path: electron-dist/godot-web/**
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }}) (main only)
    if: github.ref_name == 'main'
    needs: export-godot
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Download Godot web export
        uses: actions/download-artifact@v4
        with:
          name: godot-web-export
          path: electron-dist/godot-web

      - name: Verify Godot web export
        shell: bash
        run: |
          test -f electron-dist/godot-web/index.html
          test -f electron-dist/godot-web/index.js
          test -f electron-dist/godot-web/index.pck
          test -f electron-dist/godot-web/index.wasm

      - name: Build Electron distributables
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "${BUILD_CERTIFICATE_BASE64:-}" ] && [ -n "${P12_PASSWORD:-}" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
              echo "macOS signing secrets found: building signed + notarized artifacts (x64 + arm64)."
              CSC_LINK="${BUILD_CERTIFICATE_BASE64}" \
              CSC_KEY_PASSWORD="${P12_PASSWORD}" \
              APPLE_ID="${APPLE_ID}" \
              APPLE_APP_SPECIFIC_PASSWORD="${APPLE_APP_SPECIFIC_PASSWORD}" \
              APPLE_TEAM_ID="${APPLE_TEAM_ID}" \
              npx electron-builder --mac dmg zip --x64
              CSC_LINK="${BUILD_CERTIFICATE_BASE64}" \
              CSC_KEY_PASSWORD="${P12_PASSWORD}" \
              APPLE_ID="${APPLE_ID}" \
              APPLE_APP_SPECIFIC_PASSWORD="${APPLE_APP_SPECIFIC_PASSWORD}" \
              APPLE_TEAM_ID="${APPLE_TEAM_ID}" \
              npx electron-builder --mac dmg zip --arm64
            else
              echo "macOS signing secrets missing: building unsigned artifacts (x64 + arm64)."
              CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg zip --x64
              CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg zip --arm64
            fi
          elif [ "$RUNNER_OS" = "Linux" ]; then
            npx electron-builder --linux AppImage tar.gz
          elif [ "$RUNNER_OS" = "Windows" ]; then
            npx electron-builder --win nsis zip
          else
            npx electron-builder
          fi
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*.exe
            dist/*win*.zip
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    if: github.ref_name == 'main'
    needs: [build, expo-export]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Compute next iterative release version
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            -o /tmp/releases.json
          node scripts/release/next-release.js /tmp/releases.json >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*-mac.zip
            release-artifacts/**/*.exe
            release-artifacts/**/*win*.zip
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.tar.gz
            release-artifacts/godot-web-export/**

  clear-caches:
    name: Clear Actions Caches
    if: always() && github.ref_name == 'main'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches for repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Clearing all Actions caches for ${REPO}"

          api="https://api.github.com/repos/${REPO}/actions/caches"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          page=1
          per_page=100
          deleted=0

          while :; do
            response_file="$(mktemp)"
            http_code="$(curl -sS -o "${response_file}" -w "%{http_code}" \
              -H "${accept_header}" \
              -H "${auth_header}" \
              -H "${version_header}" \
              "${api}?per_page=${per_page}&page=${page}")"

            if [ "${http_code}" = "422" ]; then
              echo "GitHub cache API returned 422 (likely no listable caches in this context). Skipping cleanup."
              cat "${response_file}"
              rm -f "${response_file}"
              break
            fi

            if [ "${http_code}" != "200" ]; then
              echo "Failed to list caches (HTTP ${http_code})."
              cat "${response_file}"
              rm -f "${response_file}"
              exit 1
            fi

            response="$(cat "${response_file}")"
            rm -f "${response_file}"

            ids="$(echo "${response}" | jq -r '.actions_caches[]?.id // empty')"
            if [ -z "${ids}" ]; then
              break
            fi

            while IFS= read -r cache_id; do
              [ -z "${cache_id}" ] && continue
              delete_response_file="$(mktemp)"
              delete_code="$(curl -sS -o "${delete_response_file}" -w "%{http_code}" -X DELETE \
                -H "${accept_header}" \
                -H "${auth_header}" \
                -H "${version_header}" \
                "${api}/${cache_id}")"
              if [ "${delete_code}" = "200" ] || [ "${delete_code}" = "204" ]; then
                deleted=$((deleted + 1))
                echo "Deleted cache id=${cache_id}"
              else
                echo "Failed to delete cache id=${cache_id} (HTTP ${delete_code})"
                cat "${delete_response_file}"
              fi
              rm -f "${delete_response_file}"
            done <<< "${ids}"

            count_on_page="$(echo "${ids}" | wc -l | tr -d ' ')"
            if [ "${count_on_page}" -lt "${per_page}" ]; then
              break
            fi
            page=$((page + 1))
          done

          echo "Done. Deleted ${deleted} cache entries."

  deploy-preview:
    name: Deploy to Vercel Preview (non-main)
    if: github.ref_name != 'main'
    needs: [basic-tests, export-godot-preview]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Download Godot web export (preview)
        uses: actions/download-artifact@v4
        with:
          name: godot-web-export-preview
          path: electron-dist/godot-web

      - name: Pull Vercel preview environment
        shell: bash
        run: npx vercel pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Build Vercel preview artifacts
        shell: bash
        run: npx vercel build --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Deploy preview
        shell: bash
        run: npx vercel deploy --prebuilt --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}

  deploy-production:
    name: Deploy to Vercel Production (main)
    if: github.ref_name == 'main'
    needs: [clear-caches, export-godot]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Download Godot web export (production)
        uses: actions/download-artifact@v4
        with:
          name: godot-web-export
          path: electron-dist/godot-web

      - name: Pull Vercel production environment
        shell: bash
        run: npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Build Vercel production artifacts
        shell: bash
        run: npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}

      - name: Deploy production
        shell: bash
        run: npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
