name: Build + Deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.5-stable"

jobs:
  build:
    name: Godot Export + Yarn Build
    runs-on: ubuntu-latest
    env:
      PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
      PROD_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Inject Supabase config (main only)
        if: github.ref_name == 'main'
        run: |
          cat > scene/supabase.runtime.json <<EOF
          {"supabaseUrl":"${PROD_SUPABASE_URL}","supabaseAnonKey":"${PROD_SUPABASE_ANON_KEY}"}
          EOF

      - name: Install Godot + web export templates
        run: |
          set -euo pipefail
          mkdir -p .godot-bin && cd .godot-bin
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_linux.x86_64.zip"
          unzip -q godot.zip
          GODOT_PATH="$PWD/Godot_v4.5-stable_linux.x86_64"
          chmod +x "$GODOT_PATH"
          echo "GODOT_EDITOR=$GODOT_PATH" >> "$GITHUB_ENV"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.stable"
          curl -fsSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v4.5-stable_export_templates.tpz"
          mkdir -p .godot-templates
          unzip -q templates.tpz -d .godot-templates
          TEMPLATE_SOURCE_DIR="$(find .godot-templates -type f -name 'web_nothreads_release.zip' -print -quit | xargs -I{} dirname "{}")"
          mkdir -p "$TEMPLATE_DIR" /tmp/godot/export_templates/4.5.stable
          cp -R "$TEMPLATE_SOURCE_DIR"/* "$TEMPLATE_DIR/"
          cp -R "$TEMPLATE_DIR"/* /tmp/godot/export_templates/4.5.stable/

      - name: Import Godot project
        run: |
          cd scene
          timeout 90s "$GODOT_EDITOR" --headless --path . --import --quit || true

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Export Godot to web
        run: xvfb-run --auto-servernum yarn godot:export:desktop

      - name: Build
        run: yarn build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: game/**
          if-no-files-found: error

  deploy:
    name: Deploy to Vercel Production
    if: github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: game

      - name: Deploy to Vercel production
        run: |
          npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
          npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
          npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}" --scope="${{ secrets.VERCEL_TEAM_ID }}"
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
