name: Godot Web E2E

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-e2e:
    name: Export Web + Browser Clickthrough
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Docker Web E2E
        run: bash ./scripts/e2e/run_godot_web_e2e.sh

      - name: Upload browser screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-e2e-${{ github.run_id }}-${{ github.sha }}
          path: test-results/godot-web-e2e/
          retention-days: 14
