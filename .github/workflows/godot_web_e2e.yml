name: Godot Web E2E

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: godot-web-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Limit Runs
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.limit.outputs.should_run }}
      reason: ${{ steps.limit.outputs.reason }}
    steps:
      - name: Allow first two push runs per branch per UTC day
        id: limit
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === "workflow_dispatch") {
              core.setOutput("should_run", "true");
              core.setOutput("reason", "manual dispatch");
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const workflowId = "godot_web_e2e.yml";
            const dayStart = new Date();
            dayStart.setUTCHours(0, 0, 0, 0);

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: workflowId,
              branch,
              event: "push",
              per_page: 100
            });

            const earlierToday = runs.filter(run => {
              if (run.id === context.runId) return false;
              if (run.event !== "push") return false;
              if (run.head_branch !== branch) return false;
              return new Date(run.created_at) >= dayStart;
            });

            if (earlierToday.length >= 2) {
              core.setOutput("should_run", "false");
              core.setOutput("reason", `skipped: ${earlierToday.length} previous push runs for ${branch} today`);
            } else {
              core.setOutput("should_run", "true");
              core.setOutput("reason", `allowed: ${earlierToday.length} previous push runs for ${branch} today`);
            }

  web-e2e:
    name: Export Web + Browser Clickthrough
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run Docker Web E2E
        run: npm run test:web:e2e

      - name: Upload browser screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-e2e-${{ github.run_id }}-${{ github.sha }}
          path: test-results/godot-web-e2e/
          retention-days: 14

  skipped:
    name: Skipped By Daily Branch Limit
    needs: gate
    if: needs.gate.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report skip reason
        run: echo "${{ needs.gate.outputs.reason }}"
