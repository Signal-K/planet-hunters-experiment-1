name: iOS review

on:
  pull_request:
    branches: ['cycle/**', main]
    paths:
      - "native/**"
      - "shared/**"
      - ".github/workflows/ios-review.yml"
  push:
    branches: ['cycle/**']
    paths:
      - "native/**"
      - "shared/**"
      - ".github/workflows/ios-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Build and test iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec native/project.yml

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build iOS app
        run: >-
          xcodebuild
          -project native/Landnam.xcodeproj
          -scheme Landnam
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/landnam-ios"
          build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Run iOS app tests
        run: >-
          xcodebuild
          -project native/Landnam.xcodeproj
          -scheme Landnam
          -destination 'platform=iOS Simulator,name=iPhone 16'
          -derivedDataPath "$RUNNER_TEMP/landnam-ios"
          -only-testing:LandnamTests
          test
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Run core tests
        working-directory: native/LandnamCore
        run: swift test
