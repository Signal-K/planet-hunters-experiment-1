name: iOS review

on:
  pull_request:
    branches: ['cycle/**', main]
    paths:
      - "native/**"
      - "shared/**"
      - ".github/workflows/ios-review.yml"
  push:
    branches: ['cycle/**']
    paths:
      - "native/**"
      - "shared/**"
      - ".github/workflows/ios-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Build and test iOS Simulator
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec native/project.yml

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run native domain tests
        run: swift test --package-path native/LandnamCore

      - name: Build iOS app
        run: >-
          xcodebuild
          -project native/Landnam.xcodeproj
          -scheme Landnam
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/landnam-ios"
          build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      - name: Run iOS app tests
        run: >-
          xcodebuild
          -project native/Landnam.xcodeproj
          -scheme Landnam
          -destination 'platform=iOS Simulator,name=iPhone 16'
          -derivedDataPath "$RUNNER_TEMP/landnam-ios"
          -only-testing:LandnamTests
          test
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO

      # SSL-709: launch the existing account-free SceneCatalog; these are rendered review captures, not an e2e flow.
      - name: Capture ground telescope upgrade fixtures
        run: |
          set -euo pipefail
          SCOPE_SIM=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"] == "iPhone 16"))')
          xcrun simctl bootstatus "$SCOPE_SIM" -b
          xcrun simctl install "$SCOPE_SIM" "$RUNNER_TEMP/landnam-ios/Build/Products/Debug-iphonesimulator/Landnam.app"
          mkdir -p "$RUNNER_TEMP/scope-captures"
          for SCOPE_SCENE in ground-telescope-upgrades-phone ground-telescope-upgrades-landscape ground-telescope-upgrade-l2 ground-telescope-upgrade-max ground-telescope-upgrade-poor; do
            xcrun simctl launch --terminate-running-process "$SCOPE_SIM" com.atlasskyventures.sslandnam -scene "$SCOPE_SCENE"
            sleep 3
            xcrun simctl io "$SCOPE_SIM" screenshot "$RUNNER_TEMP/scope-captures/$SCOPE_SCENE.png"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ground-telescope-captures
          path: ${{ runner.temp }}/scope-captures/

      - name: Capture native mining fixtures
        run: |
          set -euo pipefail
          MINING_SIM=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"] == "iPhone 16"))')
          xcrun simctl bootstatus "$MINING_SIM" -b
          xcrun simctl install "$MINING_SIM" "$RUNNER_TEMP/landnam-ios/Build/Products/Debug-iphonesimulator/Landnam.app"
          mkdir -p "$RUNNER_TEMP/mining-captures"
          for MINING_SCENE in mining-laser-live mining-laser-live-landscape mining-shower-live mining-shower-live-landscape; do
            xcrun simctl launch --terminate-running-process "$MINING_SIM" com.atlasskyventures.sslandnam -scene "$MINING_SCENE"
            sleep 2
            xcrun simctl io "$MINING_SIM" screenshot "$RUNNER_TEMP/mining-captures/$MINING_SCENE-start.png"
            sleep 4
            xcrun simctl io "$MINING_SIM" screenshot "$RUNNER_TEMP/mining-captures/$MINING_SCENE.png"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-mining-captures
          path: ${{ runner.temp }}/mining-captures/
          if-no-files-found: warn

      # SSL-841: the test host has been trapping at launch with no stack in the log. Print the crashed thread of the
      # newest Landnam crash report (the simulator writes them on the host) so the cause is visible in the run.
      - name: Show the app's crash report
        if: failure()
        run: |
          ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -10 || true
          f=$(ls -t ~/Library/Logs/DiagnosticReports/Landnam*.ips 2>/dev/null | head -1)
          [ -n "$f" ] || { echo "no Landnam crash report"; exit 0; }
          echo "== $f"
          python3 - "$f" <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          body = json.loads(raw[raw.index('\n') + 1:])
          print('exception:', json.dumps(body.get('exception')), json.dumps(body.get('termination'))[:600])
          images = body.get('usedImages', [])
          for t in body.get('threads', []):
              if not t.get('triggered'):
                  continue
              for fr in t.get('frames', [])[:40]:
                  img = images[fr.get('imageIndex', 0)] if images else {}
                  name = img.get('name') or img.get('path', '?').split('/')[-1]
                  print(f"{name:<28} {fr.get('symbol', '?')} +{fr.get('symbolLocation', fr.get('imageOffset'))}  {fr.get('sourceFile', '')}:{fr.get('sourceLine', '')}")
          PY

