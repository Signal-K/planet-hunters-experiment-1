name: CI

# SSL-506: the scene suite is a real Linux gate, with reports and screenshots
# retained for every run. Require only the aggregate "CI required" job.
on:
  push:
    branches: [cycle/4]
  pull_request:
    branches: [cycle/4, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  scenes:
    name: Playwright scenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run scene tests
        run: npm run test:scenes
        env:
          CI: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenes-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/tests/.report
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Upload scene screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenes-out-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/tests/.out
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  ci-required:
    name: CI required
    if: always()
    needs: [check, scenes]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          test "$(echo "$RESULTS" | grep -c '"result": "success"')" -eq 2
