name: CI

# Fast source gate. Interactive scene proof is performed in the editor Simple
# Browser, so CI never installs or runs a browser.
on:
  push:
    branches: [cycle/4]
  pull_request:
    branches: [cycle/4, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  ci-required:
    name: CI required
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          test "$(echo "$RESULTS" | grep -c '"result": "success"')" -eq 1
