name: Build & Push CI Docker Images

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile.ux-tour
      - Dockerfile.ci
      - docker/ux-tour-entrypoint.sh
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to ghcr.io'
        required: false
        default: 'true'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-ux-tour:
    name: Build ux-tour image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set repo name lowercase
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ux-tour image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ux-tour
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/ux-tour:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/ux-tour:${{ github.sha }}
          cache-from: type=gha,scope=ux-tour
          cache-to: type=gha,mode=max,scope=ux-tour

  build-ci:
    name: Build ci image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set repo name lowercase
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ci image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_images == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/ci:latest
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/ci:${{ github.sha }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
