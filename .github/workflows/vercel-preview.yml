name: Vercel Preview

on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - "vercel.json"
      - ".github/workflows/vercel-preview.yml"

concurrency:
  group: vercel-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Vercel preview
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://landnam-test.vercel.app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGING_ALIAS: landnam-test.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@53.1.1

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Point staging alias at preview
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" "$STAGING_ALIAS" \
            --scope "$VERCEL_ORG_ID" --token=${{ secrets.VERCEL_TOKEN }}
          echo "Staging: https://$STAGING_ALIAS" >> "$GITHUB_STEP_SUMMARY"
