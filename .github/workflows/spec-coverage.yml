name: Spec Coverage Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check-spec-coverage:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install knowns CLI
        run: |
          npm install -g knowns
          knowns --version
      
      - name: Check spec coverage
        id: coverage
        run: |
          # Get all tasks
          TOTAL=$(knowns task list --plain | grep -E '^\s+\[' | wc -l | tr -d ' ')
          
          # Get tasks with spec references (@doc/)
          WITH_SPEC=$(knowns task list --plain | grep -E '^\s+\[' | while read line; do
            TASK_ID=$(echo "$line" | grep -oE '[a-z0-9]{6}' | head -1)
            if knowns task "$TASK_ID" --plain 2>/dev/null | grep -q '@doc/'; then
              echo "$TASK_ID"
            fi
          done | wc -l | tr -d ' ')
          
          # Calculate percentage
          if [ "$TOTAL" -gt 0 ]; then
            COVERAGE=$(awk "BEGIN {printf \"%.1f\", ($WITH_SPEC/$TOTAL)*100}")
          else
            COVERAGE=0
          fi
          
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "with_spec=$WITH_SPEC" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          
          echo "📊 Spec Coverage: $WITH_SPEC/$TOTAL tasks ($COVERAGE%)"
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}';
            const total = '${{ steps.coverage.outputs.total }}';
            const withSpec = '${{ steps.coverage.outputs.with_spec }}';
            
            const body = `## 📊 Spec-Driven Development Coverage
            
            **Coverage**: ${withSpec}/${total} tasks (${coverage}%)
            
            ${coverage >= 80 ? '✅ Great spec coverage!' : coverage >= 50 ? '⚠️ Moderate spec coverage' : '❌ Low spec coverage - add @doc/ references to task descriptions'}
            
            Tasks should reference specification documents in their descriptions using \`@doc/specs/...\` format.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
