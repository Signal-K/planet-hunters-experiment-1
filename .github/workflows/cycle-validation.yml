name: Cycle validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cycle-validation.yml'
      - 'web/cypress/e2e/onboarding.cy.ts'
permissions:
  contents: read
jobs:
  web:
    name: All web tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: All colocated source tests
        id: tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/all-web.xml
      - name: Typecheck
        if: success() || failure()
        run: npm run typecheck
      - name: Production build
        if: success() || failure()
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: web/test-results/
  missions:
    name: All mission catalogs, types and operation ordering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Authored scene and mission contracts
        run: node scripts/authoring.mjs check
      - name: Mission and order-of-operations regression suite
        working-directory: web
        run: >-
          npx vitest run lib/data lib/authoring lib/systems lib/orionids lib/probes
          lib/mission lib/runtimeCatalog.test.ts lib/contract-groups.test.ts
          lib/scene-registry-parity.test.ts lib/tutorial-skip.test.ts
          --reporter=default --reporter=junit --outputFile.junit=test-results/missions.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-test-results
          path: web/test-results/
  go:
    name: Shared core and backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        directory: [shared/core, pocketbase]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '${{ matrix.directory }}/go.sum'
      - run: go test -count=1 -v ./...
        working-directory: '${{ matrix.directory }}'
  onboarding:
    name: Onboarding only browser e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Start disposable local app
        run: |
          npm run dev > /tmp/landnam-next.log 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:3001/game/intro > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/landnam-next.log
          exit 1
      - name: Play first-run onboarding
        run: npx cypress run --browser chrome --spec cypress/e2e/onboarding.cy.ts --config video=true,defaultCommandTimeout=60000 --reporter junit --reporter-options 'mochaFile=test-results/onboarding-[hash].xml'
        env:
          CYPRESS_BASE_URL: http://localhost:3001
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-evidence
          path: |
            web/cypress/screenshots/
            web/cypress/videos/
            web/test-results/
            /tmp/landnam-next.log
