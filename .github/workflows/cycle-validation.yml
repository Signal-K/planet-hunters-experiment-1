name: Cycle validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cycle-validation.yml'
permissions:
  contents: read
jobs:
  web:
    name: All web tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: All colocated source tests
        id: tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/all-web.xml
      - name: Typecheck
        if: success() || failure()
        run: npm run typecheck
      - name: Production build
        if: success() || failure()
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: web/test-results/
  missions:
    name: All mission catalogs, types and operation ordering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Authored scene and mission contracts
        run: node scripts/authoring.mjs check
      - name: Mission and order-of-operations regression suite
        working-directory: web
        run: >-
          npx vitest run lib/data lib/authoring lib/systems lib/orionids lib/probes
          lib/mission lib/runtimeCatalog.test.ts lib/contract-groups.test.ts
          lib/scene-registry-parity.test.ts lib/tutorial-skip.test.ts
          --reporter=default --reporter=junit --outputFile.junit=test-results/missions.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-test-results
          path: web/test-results/
  go:
    name: Shared core and backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        directory: [shared/core, pocketbase]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: '${{ matrix.directory }}/go.sum'
      - run: go test -count=1 -v ./...
        working-directory: '${{ matrix.directory }}'
  native-core:
    name: All native core tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run complete native domain suite
        run: swift test --package-path native/LandnamCore
