name: Godot Archived UI Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  godot-archived-tests:
    name: Run Archived Godot UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Download Godot
        run: |
          mkdir -p ~/godot-linux
          DOWNLOAD_URL="https://github.com/godotengine/godot/releases/download/4.5-stable"
          GODOT_BIN="Godot_v4.5-stable_linux.x86_64"
          GODOT_PACKAGE="$GODOT_BIN.zip"
          wget $DOWNLOAD_URL/$GODOT_PACKAGE -P ~/godot-linux
          unzip ~/godot-linux/$GODOT_PACKAGE -d ~/godot-linux
          mv ~/godot-linux/$GODOT_BIN ~/godot-linux/godot
          chmod +x ~/godot-linux/godot

      - name: Run Archived Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cd $GITHUB_WORKSPACE/scene
          ~/godot-linux/godot --headless --path . --script res://tests/SupabaseTestRunner_Archived.gd 2>&1 | tee archived_test_output.log
          exit ${PIPESTATUS[0]}
