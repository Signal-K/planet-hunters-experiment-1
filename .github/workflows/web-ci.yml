name: Web CI

on:
  push:
    branches: [master, main, "sprint/**", "claude/**"]
    paths:
      - "web/**"
      - "pocketbase/pb_migrations/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [master, main, "sprint/**"]
    paths:
      - "web/**"
      - "pocketbase/pb_migrations/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Validate PB migration files
        working-directory: .
        run: |
          shopt -s nullglob
          files=(pocketbase/pb_migrations/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migration files found — skipping."
            exit 0
          fi
          for f in "${files[@]}"; do
            node --check "$f" && echo "OK: $f" || exit 1
          done

  build:
    name: Next.js Build Check
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SHARED_PB_URL: http://localhost:8090
          NEXT_PUBLIC_LANDNAM_PB_URL: http://localhost:8091

  deploy:
    name: Deploy
    # Only after typecheck, unit tests and a real build have passed. There is no
    # point aliasing staging to a red commit.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'staging' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    env:
      # Identifiers, not credentials — useless without VERCEL_TOKEN. Kept inline
      # so the only thing to configure is the one secret. `.vercel/project.json`
      # is gitignored, so CI cannot read them from the repo.
      VERCEL_ORG_ID: team_7LAhnYkfIhymCJGX9MnvvcZ4
      VERCEL_PROJECT_ID: prj_YECUOspGC2zJt9ruPnyl2mqSnBuv
      # The staging alias. Pushes to main land here; sprint branches get a
      # plain preview URL and do not touch it.
      STAGING_ALIAS: landnam-test.vercel.app

    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN is not set — skipping deploy." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        if: steps.creds.outputs.ready == 'true'
        run: npm install --global vercel@latest

      # Deploys run from the repo root, matching scripts/deploy-test.mjs — the
      # Vercel project's own Root Directory setting points at web/.
      # Always a *preview* build, never --prod. landnam-test.vercel.app is
      # staging, and it is reached by aliasing a preview deployment — exactly
      # what scripts/deploy-test.mjs does. Using --prod here would publish to
      # the project's production domain instead, which nothing in this repo
      # asks for.
      - name: Pull Vercel environment
        if: steps.creds.outputs.ready == 'true'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

      # Only main moves the staging alias. A sprint branch deploying over
      # landnam-test would make staging mean nothing.
      - name: Point staging alias at this deploy
        if: steps.creds.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" "$STAGING_ALIAS" \
            --scope signal-k --token=${{ secrets.VERCEL_TOKEN }}
          echo "Staging: https://$STAGING_ALIAS" >> "$GITHUB_STEP_SUMMARY"
