name: Web CI

on:
  push:
    # Every branch, not a glob list. Staging deploys on any green push, so a
    # branch whose name happens not to match a pattern must not silently skip
    # CI and the deploy with it.
    branches: ["**"]
    paths:
      - "web/**"
      - "pocketbase/pb_migrations/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [master, main, "sprint/**"]
    paths:
      - "web/**"
      - "pocketbase/pb_migrations/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Validate PB migration files
        working-directory: .
        run: |
          shopt -s nullglob
          files=(pocketbase/pb_migrations/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migration files found — skipping."
            exit 0
          fi
          for f in "${files[@]}"; do
            node --check "$f" && echo "OK: $f" || exit 1
          done

  build:
    name: Next.js Build Check
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SHARED_PB_URL: http://localhost:8090
          NEXT_PUBLIC_LANDNAM_PB_URL: http://localhost:8091

  deploy:
    name: Deploy
    # Only after typecheck, unit tests and a real build have passed. There is no
    # point aliasing staging to a red commit.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://landnam-test.vercel.app

    env:
      # These already exist as repository secrets — use them rather than
      # hardcoding the ids. VERCEL_TEAM_ID is Vercel's name for the org id.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The staging alias. Every branch CI runs on points it here, so staging
      # always reflects the most recent green push regardless of branch.
      STAGING_ALIAS: landnam-test.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Deploys run from the repo root, matching scripts/deploy-test.mjs — the
      # Vercel project's own Root Directory setting points at web/.
      # Always a *preview* build, never --prod. landnam-test.vercel.app is
      # staging, and it is reached by aliasing a preview deployment — exactly
      # what scripts/deploy-test.mjs does. Using --prod here would publish to
      # the project's production domain instead, which nothing in this repo
      # asks for.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

      # Every branch CI runs on moves the alias — main, sprint/** and claude/**
      # alike. Staging therefore means "the last green push", not "the last push
      # to main". concurrency is scoped per ref, so two branches pushed close
      # together can still race for the alias; last writer wins, which is the
      # accepted trade for having every branch land on one URL.
      - name: Point staging alias at this deploy
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" "$STAGING_ALIAS" \
            --scope "$VERCEL_ORG_ID" --token=${{ secrets.VERCEL_TOKEN }}
          echo "Staging: https://$STAGING_ALIAS" >> "$GITHUB_STEP_SUMMARY"
