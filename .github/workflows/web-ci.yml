name: Web CI

# SSL-505: one gate for every real target. Branch rulesets are admin-only and
# cannot be created from this file. Require ONLY the aggregate check named
# "CI required" (job id ci-required) on main, cycle/3, cycle/4, release/*, and
# native/*. No path filters: a path-filtered required check never reports and
# blocks, or silently passes, a PR that did not touch the filtered paths.
# Jobs do not use continue-on-error. A failed, cancelled, or skipped dependency
# fails ci-required.
on:
  push:
    branches: [main, "cycle/**", "sprint*/**", "release/**", "native/**"]
  pull_request:
    branches: [main, "cycle/**", "sprint*/**", "release/**", "native/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      # `npm run lint` = design tokens, hue palette, native text/tap/contrast
      # floors, scene surfaces and tsc --noEmit.
      - name: Lint and typecheck
        run: npm run lint
      - name: Loop screen text, contrast and tap-target floor
        run: npm run verify:loop-text-floor
      - name: Validate PB migration files
        working-directory: .
        run: |
          shopt -s nullglob
          files=(pocketbase/pb_migrations/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migration files found, skipping."
            exit 0
          fi
          for f in "${files[@]}"; do
            node --check "$f" && echo "OK: $f" || exit 1
          done

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit

  scenes:
    name: Playwright scenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run scene tests
        run: npm run test:scenes
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Build evidence index
        if: always()
        run: node scripts/build-evidence-index.mjs
      # A missing report or screenshot directory is a failure, not a pass.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenes-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/tests/.report
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: Upload scene screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenes-out-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/tests/.out
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  build:
    name: Next.js Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SHARED_PB_URL: http://localhost:8090
          NEXT_PUBLIC_LANDNAM_PB_URL: http://localhost:8091

  deploy:
    name: Deploy
    # Only after typecheck, unit tests and a real build have passed, and only
    # from main: this publishes the production Worker served at playlandnam.space.
    needs: ci-required
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://playlandnam.space
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # KES-193: every push to main deploys straight to the landnam-web Worker,
      # which wrangler.jsonc binds to playlandnam.space as a custom domain.
      # NEXT_PUBLIC_* vars are inlined at build time (Next.js convention).
      - name: Build (OpenNext/Cloudflare)
        run: |
          node -e "console.log('PB urls', process.env.NEXT_PUBLIC_SHARED_PB_URL, process.env.NEXT_PUBLIC_LANDNAM_PB_URL, process.env.NEXT_PUBLIC_LANDNAM_ENV)"
          npm run build:cf
          node scripts/verify-deployed-pb-urls.mjs .open-next
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SHARED_PB_URL: https://signal-k-starsailors.fly.dev
          NEXT_PUBLIC_LANDNAM_PB_URL: https://signal-k-landnam.fly.dev
          NEXT_PUBLIC_LANDNAM_ENV: production
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_FEATURE_SCAN_STATION: true

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-staging:
    name: Deploy staging
    # Staging is the fast integration path. It waits only for the install/type
    # gate and application build; Playwright and evidence jobs still run but
    # must not hold back a deploy.
    needs: [lint-typecheck, build]
    # Only cycle/* pushes publish the one staging worker. main uses Deploy.
    # sprint, release, and native pushes still run the required checks above
    # without replacing staging.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/cycle/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (OpenNext/Cloudflare staging)
        run: |
          node -e "console.log('PB urls', process.env.NEXT_PUBLIC_SHARED_PB_URL, process.env.NEXT_PUBLIC_LANDNAM_PB_URL, process.env.NEXT_PUBLIC_LANDNAM_ENV)"
          npm run build:cf
          node scripts/verify-deployed-pb-urls.mjs .open-next
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SHARED_PB_URL: https://signal-k-starsailors.fly.dev
          NEXT_PUBLIC_LANDNAM_PB_URL: https://signal-k-landnam.fly.dev
          NEXT_PUBLIC_LANDNAM_ENV: staging
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_FEATURE_SCAN_STATION: true
      - name: Deploy staging worker
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  ci-required:
    name: CI required
    # The single required status check. if: always() so a skipped or cancelled
    # dependency still produces a (failing) result instead of a missing check.
    if: always()
    needs: [lint-typecheck, unit, scenes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -q '"result": "\(failure\|cancelled\|skipped\)"'; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
          test "$(echo "$RESULTS" | grep -c '"result": "success"')" -eq 4
