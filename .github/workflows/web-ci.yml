name: Web CI

on:
  push:
    # Every branch, not a glob list. Staging deploys on any green push, so a
    # branch whose name happens not to match a pattern must not silently skip
    # CI and the deploy with it.
    branches: ["**"]
    paths:
      - "web/**"
      - "pocketbase/pb_migrations/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [master, main, "sprint/**"]
    paths:
      - "web/**"
      - "pocketbase/pb_migrations/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:
  schedule:
    # KES-115: nightly deep coverage independent of push/PR activity, so a
    # regression that lands between reviewed PRs (or drifts in from a live
    # backend/content change with no code push at all) doesn't sit
    # undetected until the next person happens to touch web/. Runs the full
    # journeys suite (e2e-staging-full below) against whatever build is
    # currently live on landnam-web.liam-55d.workers.dev -- not tied to a
    # specific commit's deploy, since a schedule event has no push to deploy
    # from.
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Validate PB migration files
        working-directory: .
        run: |
          shopt -s nullglob
          files=(pocketbase/pb_migrations/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migration files found — skipping."
            exit 0
          fi
          for f in "${files[@]}"; do
            node --check "$f" && echo "OK: $f" || exit 1
          done

  build:
    name: Next.js Build Check
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SHARED_PB_URL: http://localhost:8090
          NEXT_PUBLIC_LANDNAM_PB_URL: http://localhost:8091

  e2e-sprint12:
    name: E2E — Sprint 12 acceptance journeys
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Keep this acceptance job bounded to the Sprint 12 journeys that were
      # previously either untracked in CI or only covered by visual evidence:
      # Scan Station, the mission-type viewport matrix, discovery -> economy,
      # and the launchpad auth-gate handoff. Cypress runs headless here so CI
      # never requires an interactive desktop session.
      - name: Run Sprint 12 acceptance journeys
        uses: cypress-io/github-action@v6
        with:
          working-directory: web
          browser: chrome
          install: false
          start: npm run dev
          wait-on: http://localhost:3001
          wait-on-timeout: 90
          spec: >-
            cypress/e2e/features/scan-station.cy.ts,
            cypress/e2e/journeys/mission-type-matrix.cy.ts,
            cypress/e2e/visual/discovery-economy-visual-qa.cy.ts,
            cypress/e2e/features/launchpad-own-program.cy.ts
        env:
          CYPRESS_PROFILE: full
          CYPRESS_baseUrl: http://localhost:3001
          NEXT_PUBLIC_FEATURE_SCAN_STATION: true
          CI: true

      - name: Upload Sprint 12 screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint12-acceptance-screenshots-${{ github.sha }}
          path: web/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Sprint 12 videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sprint12-acceptance-videos-${{ github.sha }}
          path: web/cypress/videos/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy
    # Only after typecheck, unit tests and a real build have passed. There is no
    # point deploying a red commit to staging.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://landnam-web.liam-55d.workers.dev
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # KES-193: every push deploys straight to the landnam-web Worker — no
      # alias/aliasing step needed like Vercel's, since `wrangler deploy`
      # publishes directly to the same Worker name every time. Staging is
      # therefore always "the last green push", same semantics as before.
      # NEXT_PUBLIC_* vars are inlined at build time (Next.js convention) —
      # these mirror what Vercel's Preview environment had configured.
      - name: Build (OpenNext/Cloudflare)
        run: npm run build:cf
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SHARED_PB_URL: https://signal-k-starsailors.fly.dev
          NEXT_PUBLIC_LANDNAM_PB_URL: https://signal-k-landnam.fly.dev
          NEXT_PUBLIC_LANDNAM_ENV: staging
          NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_FEATURE_SCAN_STATION: true

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  e2e-staging:
    name: E2E — against staging deployment
    # KES-193: targets the landnam-web Worker's fixed workers.dev URL — every
    # push deploys directly to this same Worker (no alias/race like Vercel's
    # setup had), so a concurrent push to another branch overwriting this
    # build mid-run is still possible, just via a straight redeploy rather
    # than an alias flip.
    #
    # Scoped to the 'staging' Cypress profile (just c1-c4-viewport-matrix.cy.ts)
    # on every push: fast and confirmed passing against the real production
    # build. The full journeys suite against staging (real backend
    # registration/gameplay, much slower and not yet proven reliable
    # end-to-end) is the separate manually-triggered e2e-staging-full job
    # below — don't fold it in here without re-verifying it actually
    # completes reliably first.
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for staging to serve this deploy
        run: |
          for i in {1..30}; do
            if curl -sf "https://landnam-web.liam-55d.workers.dev/api/backend-health" > /dev/null; then
              echo "Staging is responding."
              exit 0
            fi
            echo "Attempt $i/30 — staging not ready yet"
            sleep 5
          done
          echo "Staging never became reachable" >&2
          exit 1

      - name: Run journeys against staging
        id: cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: web
          browser: chrome
          install: false
        env:
          CYPRESS_PROFILE: staging
          CYPRESS_baseUrl: https://landnam-web.liam-55d.workers.dev
          CI: true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-staging-screenshots-${{ github.sha }}
          path: web/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-staging-videos-${{ github.sha }}
          path: web/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7

  e2e-staging-full:
    name: E2E — full journeys against staging (manual + nightly)
    # Manual (workflow_dispatch) or nightly (schedule), not on every push:
    # this runs the entire journeys suite for real against the live staging
    # deployment, including clean-start-loop.cy.ts's real account
    # registration and playthrough over the network against the actual
    # staging PocketBase backends. A local run of this same scope didn't
    # finish in 10+ minutes, so it isn't a reliable per-push gate yet —
    # trigger it by hand, or let the nightly cron (KES-115) catch drift that
    # happens between reviewed pushes. No `needs: deploy` deliberately: a
    # schedule event has no push/deploy in the same run, so this always
    # tests whatever build is currently live on
    # landnam-web.liam-55d.workers.dev, not a specific commit's fresh
    # deploy. Any @landnam.test account it creates
    # is cleaned up by the existing KES-149 purge migrations on the next
    # backend deploy.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for staging to serve this deploy
        run: |
          for i in {1..30}; do
            if curl -sf "https://landnam-web.liam-55d.workers.dev/api/backend-health" > /dev/null; then
              echo "Staging is responding."
              exit 0
            fi
            echo "Attempt $i/30 — staging not ready yet"
            sleep 5
          done
          echo "Staging never became reachable" >&2
          exit 1

      - name: Run full journeys suite against staging
        id: cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: web
          browser: chrome
          install: false
        env:
          CYPRESS_PROFILE: staging-full
          CYPRESS_baseUrl: https://landnam-web.liam-55d.workers.dev
          CI: true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-staging-full-screenshots-${{ github.sha }}
          path: web/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-staging-full-videos-${{ github.sha }}
          path: web/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7
