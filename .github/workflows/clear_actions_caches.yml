name: Clear Actions Caches

on:
  workflow_run:
    workflows:
      - Export Godot + Build Expo
      - Godot Tests
      - Godot Archived UI Tests
      - Electron Desktop Release
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: clear-actions-caches
  cancel-in-progress: false

jobs:
  clear-caches:
    name: Delete all Actions caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches for repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Clearing all Actions caches for ${REPO}"

          api="https://api.github.com/repos/${REPO}/actions/caches"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          page=1
          per_page=100
          deleted=0

          while :; do
            response="$(curl -fsSL \
              -H "${accept_header}" \
              -H "${auth_header}" \
              -H "${version_header}" \
              "${api}?per_page=${per_page}&page=${page}")"

            ids="$(echo "${response}" | jq -r '.actions_caches[].id')"
            if [ -z "${ids}" ]; then
              break
            fi

            while IFS= read -r cache_id; do
              [ -z "${cache_id}" ] && continue
              curl -fsSL -X DELETE \
                -H "${accept_header}" \
                -H "${auth_header}" \
                -H "${version_header}" \
                "${api}/${cache_id}" >/dev/null
              deleted=$((deleted + 1))
              echo "Deleted cache id=${cache_id}"
            done <<< "${ids}"

            count_on_page="$(echo "${ids}" | wc -l | tr -d ' ')"
            if [ "${count_on_page}" -lt "${per_page}" ]; then
              break
            fi
            page=$((page + 1))
          done

          echo "Done. Deleted ${deleted} cache entries."
