name: Visual QA

on:
  push:
    branches: [main, "sprint/**", "sprint-*", "claude/**"]
    paths:
      - "web/**"
      - "pocketbase/**"
      - ".github/workflows/visual-qa.yml"
  pull_request:
    branches: [main, "sprint/**", "sprint-*"]
    paths:
      - "web/**"
      - "pocketbase/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  visual-qa:
    name: Headless Chrome — full game playthrough
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FEATURE_SCAN_STATION: "true"
      NEXT_PUBLIC_E2E_AUTH_AUTO_CONTINUE: "true"

    steps:
      - uses: actions/checkout@v4

      # ── Shared PocketBase (vanilla) ─────────────────────────────────────────
      - name: Download shared PocketBase
        run: |
          PB_VERSION=0.27.0
          curl -fsSL \
            "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip" \
            -o /tmp/pb-shared.zip
          unzip -q /tmp/pb-shared.zip pocketbase -d /tmp/pb-shared-bin

      - name: Start shared PocketBase
        run: |
          mkdir -p /tmp/pb-shared-data
          /tmp/pb-shared-bin/pocketbase serve \
            --http=127.0.0.1:8090 \
            --dir=/tmp/pb-shared-data &
          # Give PB time to write its initial DB, then create superuser
          sleep 3
          /tmp/pb-shared-bin/pocketbase superuser create \
            ci@landnam.test CiTestPassword123! \
            --dir=/tmp/pb-shared-data 2>/dev/null || true

      # ── Landnam PocketBase (custom binary) ──────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version-file: pocketbase/go.mod
          cache-dependency-path: pocketbase/go.sum

      - name: Build Landnam PocketBase
        working-directory: pocketbase
        run: go build -o /tmp/landnam-pb .

      - name: Start Landnam PocketBase
        run: |
          mkdir -p /tmp/pb-landnam-data
          /tmp/landnam-pb serve \
            --http=127.0.0.1:8091 \
            --dir=/tmp/pb-landnam-data &
          sleep 3
          /tmp/landnam-pb superuser create \
            ci@landnam.test CiTestPassword123! \
            --dir=/tmp/pb-landnam-data 2>/dev/null || true

      - name: Wait for PocketBase health
        run: |
          echo "Waiting for PocketBase instances..."
          for i in {1..20}; do
            shared_ok=$(curl -sf http://127.0.0.1:8090/api/health && echo 1 || echo 0)
            landnam_ok=$(curl -sf http://127.0.0.1:8091/api/health && echo 1 || echo 0)
            if [ "$shared_ok" = "1" ] && [ "$landnam_ok" = "1" ]; then
              echo "Both PocketBase instances ready."
              break
            fi
            echo "Attempt $i/20 — shared=$shared_ok landnam=$landnam_ok"
            sleep 2
          done

      # ── Node / Chrome ────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── Cypress visual run ────────────────────────────────────────────────────
      # Keep visual QA headless. Xvfb/headed mode is unnecessary for screenshots
      # and can open native browser crash surfaces on developer machines.
      - name: Run visual QA — headless Chrome
        id: cypress
        uses: cypress-io/github-action@v6
        continue-on-error: true
        with:
          working-directory: web
          browser: chrome
          install: false
          start: npm run dev
          wait-on: "http://localhost:3099"
          wait-on-timeout: 90
        env:
          CYPRESS_PROFILE: visual
          CYPRESS_baseUrl: http://localhost:3099
          NEXT_PUBLIC_LANDNAM_PB_URL: http://127.0.0.1:8091
          NEXT_PUBLIC_SHARED_PB_URL: http://127.0.0.1:8090
          PORT: 3099
          CI: true

      # ── Artifacts ─────────────────────────────────────────────────────────────
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa-screenshots-${{ github.sha }}
          path: web/cypress/screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa-videos-${{ github.sha }}
          path: web/cypress/videos/
          if-no-files-found: warn
          retention-days: 14

      # ── AI design review of screenshots (KES-114) ──────────────────────────────
      # Feeds a capped sample of captured screenshots through a vision-capable
      # Claude call, checking each against Landnam's design rules (amber usage,
      # 8pt spacing, no emoji, dark/light theme per surface, uppercase instrument
      # labels). Writes its findings to a JSON file that the "Analyse results and
      # post summary" step below reads and folds into the same PR comment.
      #
      # Requires the ANTHROPIC_API_KEY repo secret (Settings -> Secrets and
      # variables -> Actions). If it is not set, this step no-ops and records a
      # clear "skipped" message — it never fails the job and never turns Visual
      # QA red on its own. A repo admin must add the secret for this step to do
      # anything beyond that.
      - name: AI design review of screenshots
        if: always()
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Keep the model configurable at repository level; the default is a
          # documented vision-capable Messages API model rather than a guessed
          # future alias. Set ANTHROPIC_MODEL in Actions variables when rotating.
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514' }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')

            const apiKey = process.env.ANTHROPIC_API_KEY
            const screenshotsBase = 'web/cypress/screenshots'
            const outputPath = 'visual-qa-ai-review.json'

            // Graceful no-op path: the secret has not been configured yet.
            // This must never fail the workflow — see the header comment above.
            if (!apiKey) {
              fs.writeFileSync(outputPath, JSON.stringify({
                skipped: true,
                reason: 'ANTHROPIC_API_KEY secret not configured',
              }))
              core.info('AI screenshot review skipped — ANTHROPIC_API_KEY secret not configured.')
              return
            }

            // Collect every screenshot, same walk as the analysis step below.
            const files = []
            function walk(dir) {
              if (!fs.existsSync(dir)) return
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name)
                if (entry.isDirectory()) walk(full)
                else if (entry.name.endsWith('.png')) files.push(full)
              }
            }
            walk(screenshotsBase)
            files.sort()

            if (files.length === 0) {
              fs.writeFileSync(outputPath, JSON.stringify({ skipped: true, reason: 'No screenshots captured' }))
              core.info('AI screenshot review skipped — no screenshots captured.')
              return
            }

            // ── Cost/scope cap ───────────────────────────────────────────────────
            // A full playthrough run can produce dozens of screenshots. Sending
            // every one through a vision model call would multiply run time and
            // API cost for little extra signal, since most frames within the same
            // test group (e.g. every step of one mission flow) look visually
            // near-identical. Instead we sample ONE representative screenshot per
            // top-level test group (the directory Cypress groups screenshots
            // into, same grouping the summary step below uses) and cap the total
            // at MAX_SCREENSHOTS regardless of how many groups exist, so a large
            // suite still bounds the run to a small, predictable number of calls.
            const MAX_SCREENSHOTS = 8
            const groups = new Map()
            for (const f of files) {
              const rel = path.relative(screenshotsBase, f)
              const group = rel.split(path.sep)[0] || 'other'
              if (!groups.has(group)) groups.set(group, f)
            }
            const selected = Array.from(groups.values()).slice(0, MAX_SCREENSHOTS)

            const DESIGN_RULES = [
              'You are reviewing a screenshot from "Landnam", a space mining game, for violations of its UI design rules. The relative path/filename of the screenshot (which usually encodes the test and screen name) is given below the rules.',
              '',
              'Design rules to check — flag ONLY genuine violations, do not nitpick:',
              '',
              '1. AMBER RESTRICTION: The amber/gold accent color is reserved for genuine payout/reward emphasis in small elements only (e.g. a credits/reward number). Amber must never be used as a panel background, headline color, primary button, or generic UI chrome (sort controls, info panels, dismiss buttons, nav). If you see amber used broadly as a UI accent rather than a specific reward callout, flag it.',
              '2. 8PT SPACING RHYTHM: Layout spacing (padding, gaps, margins) should look like it follows a consistent grid of small increments (roughly 4/8/12/16/24/32/48/64px). Flag only if spacing looks visibly inconsistent or arbitrary, not from pixel-perfect measurement.',
              '3. NO EMOJI: No emoji characters should appear anywhere in the UI. Status should be shown via shape + color + label, not emoji glyphs. Flag any visible emoji.',
              '4. THEME PER SURFACE: Operations/gameplay screens (mining, transit/flight, debrief, mission board contract list) should use a dark "command deck" theme (dark background, cyan/white text). Reference, guide, market, and menu-style screens should use a light "editorial" theme (light background, dark text, cyan/amber accents). EXCEPTION: a screen that looks like "Launchpad" (a rocket on a launch pad with a lit sky/ground background and white instrument cards) is a documented, intentional exception — do NOT flag its light styling as a theme violation. Only flag a clear, unexplained mismatch (e.g. an obviously mid-gameplay HUD rendered in the light editorial theme, or a menu/guide screen rendered fully dark).',
              '5. UPPERCASE + LETTER-SPACING: Instrument labels (small caption-style UI labels) and CTA/button text should appear in uppercase with visible letter-spacing. Flag clearly-lowercase or mixed-case button/label text where uppercase would be expected.',
              '',
              "Infer the screen's purpose from its visible content and the filename/test name given below — do not guess the rule from the filename alone.",
              '',
              'Respond with ONLY a single JSON object, no markdown fences, no prose outside the JSON, in this exact shape:',
              '{"pass": true|false, "violations": [{"rule": "<one of: amber-restriction|8pt-spacing|no-emoji|theme-per-surface|uppercase-labels>", "detail": "<one sentence, specific to what you saw>"}], "notes": "<optional one-sentence caveat, or empty string>"}',
              'If you find no violations, return {"pass": true, "violations": [], "notes": ""}.',
            ].join('\n')

            const results = []
            for (const filePath of selected) {
              const rel = path.relative(screenshotsBase, filePath)
              try {
                const imageData = fs.readFileSync(filePath).toString('base64')
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                  method: 'POST',
                  headers: {
                    'content-type': 'application/json',
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01',
                  },
                  body: JSON.stringify({
                    model: process.env.ANTHROPIC_MODEL,
                    max_tokens: 1024,
                    messages: [{
                      role: 'user',
                      content: [
                        { type: 'image', source: { type: 'base64', media_type: 'image/png', data: imageData } },
                        { type: 'text', text: `Screenshot path: ${rel}\n\n${DESIGN_RULES}` },
                      ],
                    }],
                  }),
                })

                if (!response.ok) {
                  const text = await response.text()
                  results.push({ screenshot: rel, error: `Anthropic API error ${response.status}: ${text.slice(0, 300)}` })
                  continue
                }

                const data = await response.json()
                const textBlock = (data.content || []).find(b => b.type === 'text')
                let parsed
                try {
                  const raw = textBlock ? textBlock.text.trim() : '{}'
                  const unfenced = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '')
                  parsed = JSON.parse(unfenced)
                } catch (parseErr) {
                  parsed = { pass: null, violations: [], notes: 'Could not parse model response as JSON.', raw: textBlock ? textBlock.text.slice(0, 500) : '' }
                }
                results.push({ screenshot: rel, ...parsed })
              } catch (err) {
                results.push({ screenshot: rel, error: String((err && err.message) || err) })
              }
            }

            fs.writeFileSync(outputPath, JSON.stringify({
              skipped: false,
              reviewed: selected.length,
              totalGroups: groups.size,
              totalScreenshots: files.length,
              results,
            }, null, 2))
            core.info(`AI screenshot review complete: reviewed ${selected.length} of ${files.length} screenshots (${groups.size} groups found).`)

      # ── Analysis: step summary + PR comment ───────────────────────────────────
      - name: Analyse results and post summary
        if: always()
        uses: actions/github-script@v7
        env:
          CYPRESS_OUTCOME: ${{ steps.cypress.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const path = require('path')

            const outcome = process.env.CYPRESS_OUTCOME  // 'success' | 'failure' | 'cancelled'
            const passed = outcome === 'success'
            const statusIcon = passed ? '✅' : '❌'
            const sha = context.sha.slice(0, 7)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            // Collect screenshots, grouped by test name
            const screenshotsBase = 'web/cypress/screenshots'
            const screenshots = []
            function walk(dir) {
              if (!fs.existsSync(dir)) return
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name)
                if (entry.isDirectory()) walk(full)
                else if (entry.name.endsWith('.png')) {
                  screenshots.push(full.replace(screenshotsBase + '/', ''))
                }
              }
            }
            walk(screenshotsBase)
            screenshots.sort()

            // Parse mochawesome JSON if available (cypress-io/github-action may write it)
            let testRows = ''
            const mocha = 'web/cypress/results/mochawesome.json'
            if (fs.existsSync(mocha)) {
              const results = JSON.parse(fs.readFileSync(mocha, 'utf8'))
              const rows = []
              function collectTests(suite) {
                for (const t of (suite.tests || [])) {
                  const icon = t.pass ? '✅' : t.fail ? '❌' : '⏭️'
                  rows.push(`| ${icon} \`${t.fullTitle}\` | ${t.duration}ms |`)
                }
                for (const s of (suite.suites || [])) collectTests(s)
              }
              for (const s of (results.results || [])) collectTests(s)
              if (rows.length) {
                testRows = `\n## Tests\n\n| Result | Duration |\n|---|---|\n${rows.join('\n')}\n`
              }
            }

            // Group screenshots by prefix (test name comes before first ' -- ')
            const groups = {}
            for (const s of screenshots) {
              const name = path.basename(s, '.png')
              const test = s.split('/')[0] || 'other'
              ;(groups[test] = groups[test] || []).push(name)
            }

            let screenshotSection = '\n## Screenshots\n\n'
            if (screenshots.length === 0) {
              screenshotSection += '_No screenshots captured._\n'
            } else {
              screenshotSection += `${screenshots.length} screenshots captured — download the **visual-qa-screenshots** artifact to view them.\n\n`
              for (const [group, names] of Object.entries(groups)) {
                screenshotSection += `**${group}**\n`
                screenshotSection += names.map(n => `  - \`${n}\``).join('\n') + '\n\n'
              }
            }

            // AI design review (KES-114) — read the JSON the previous step wrote,
            // if it ran, and render it as its own section in the same comment.
            let aiReviewSection = '\n## AI Design Review\n\n'
            const aiReviewPath = 'visual-qa-ai-review.json'
            if (fs.existsSync(aiReviewPath)) {
              let aiReview
              try {
                aiReview = JSON.parse(fs.readFileSync(aiReviewPath, 'utf8'))
              } catch (e) {
                aiReview = null
              }
              if (!aiReview) {
                aiReviewSection += '_AI screenshot review produced unreadable output — see workflow logs._\n'
              } else if (aiReview.skipped) {
                aiReviewSection += `_AI screenshot review skipped — ${aiReview.reason}._\n`
              } else {
                const flagged = (aiReview.results || []).filter(r => r.error || (r.violations && r.violations.length))
                aiReviewSection += `Reviewed ${aiReview.reviewed} of ${aiReview.totalScreenshots} screenshot(s) across ${aiReview.totalGroups} test group(s) — capped to control cost — against Landnam's design rules (amber usage, 8pt spacing, no emoji, theme per surface, uppercase instrument labels).\n\n`
                if (flagged.length === 0) {
                  aiReviewSection += '_No violations flagged._\n'
                } else {
                  for (const r of flagged) {
                    if (r.error) {
                      aiReviewSection += `- \`${r.screenshot}\`: _review error — ${r.error}_\n`
                    } else {
                      aiReviewSection += `- **\`${r.screenshot}\`** — ${r.violations.length} violation(s):\n`
                      for (const v of r.violations) {
                        aiReviewSection += `  - **${v.rule || 'design'}**: ${v.detail || JSON.stringify(v)}\n`
                      }
                      if (r.notes) {
                        aiReviewSection += `  - _note: ${r.notes}_\n`
                      }
                    }
                  }
                }
              }
            } else {
              aiReviewSection += '_AI screenshot review did not run._\n'
            }

            const md = `# ${statusIcon} Visual QA — \`${sha}\`

            **Outcome**: ${passed ? 'All tests passed' : 'One or more tests failed'}
            **Commit**: \`${context.sha.slice(0, 7)}\` on \`${context.ref.replace('refs/heads/', '')}\`
            **Run**: [View full logs and download artifacts](${runUrl})
            ${testRows}${screenshotSection}${aiReviewSection}
            ---
            _Screenshots are pixel-accurate captures from a headed Chrome browser playing through the game._
            `.replace(/^            /gm, '')

            // Write to GitHub step summary
            await core.summary.addRaw(md).write()

            // Comment or update existing comment on PRs
            if (context.eventName === 'pull_request') {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              })
              const existing = comments.find(c =>
                c.user.type === 'Bot' && c.body.startsWith('# ') && c.body.includes('Visual QA')
              )
              const payload = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: md,
              }
              if (existing) {
                await github.rest.issues.updateComment({ ...payload, comment_id: existing.id })
              } else {
                await github.rest.issues.createComment({ ...payload, issue_number: context.issue.number })
              }
            }

            // Fail the workflow if Cypress failed
            if (!passed) {
              core.setFailed(`Visual QA failed — check screenshots and videos in the artifacts.`)
            }
