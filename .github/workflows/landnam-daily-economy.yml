name: Landnam Daily Economy

on:
  schedule:
    # 00:01 AEST is 14:01 UTC. AEST is deliberately fixed UTC+10, rather than
    # Melbourne daylight time, so the economy date never shifts seasonally.
    - cron: "1 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landnam-daily-economy
  cancel-in-progress: false

jobs:
  publish-snapshot:
    name: Resolve daily client demand and market snapshot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The script reads every saved game's client-build events and the latest
      # published snapshot from Landnam PocketBase, resolves today's snapshot,
      # and upserts it under its idempotencyKey, so a retry or a dispatched
      # rerun on the same AEST day is safe. The PB_* secrets are the existing
      # Landnam PocketBase superuser; the LANDNAM_* names stay as overrides.
      - name: Resolve authoritative daily snapshot
        env:
          LANDNAM_DAILY_ECONOMY_INPUT_JSON: ${{ vars.LANDNAM_DAILY_ECONOMY_INPUT_JSON }}
          LANDNAM_PB_URL: ${{ vars.LANDNAM_PB_URL || secrets.PB_LANDNAM_URL || 'https://signal-k-landnam.fly.dev' }}
          LANDNAM_PB_SERVICE_EMAIL: ${{ secrets.LANDNAM_PB_SERVICE_EMAIL || secrets.PB_ADMIN_EMAIL }}
          LANDNAM_PB_SERVICE_PASSWORD: ${{ secrets.LANDNAM_PB_SERVICE_PASSWORD || secrets.PB_ADMIN_PASSWORD }}
        run: node --experimental-strip-types scripts/run-daily-economy.ts --output daily-economy-snapshot.json --publish-url "$LANDNAM_PB_URL"

      - name: Upload auditable daily snapshot
        uses: actions/upload-artifact@v4
        with:
          name: landnam-daily-economy-${{ github.run_id }}
          path: web/daily-economy-snapshot.json
          if-no-files-found: error
          retention-days: 90
