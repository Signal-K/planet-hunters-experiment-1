name: Godot Tests

# Only run on pushes to main branch to save CI budget
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-project:
    name: Build Godot Project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: 'recursive'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-linux
          key: ${{ runner.os }}-godot-4.5-stable
          restore-keys: |
            ${{ runner.os }}-godot-4.5-
            ${{ runner.os }}-godot-

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-linux
          chmod 770 ~/godot-linux
          mkdir -p ~/.config/godot
          chmod 770 ~/.config/godot

          DOWNLOAD_URL="https://github.com/godotengine/godot/releases/download/4.5-stable"
          GODOT_BIN="Godot_v4.5-stable_linux.x86_64"
          GODOT_PACKAGE="$GODOT_BIN.zip"

          wget $DOWNLOAD_URL/$GODOT_PACKAGE -P ~/godot-linux
          unzip ~/godot-linux/$GODOT_PACKAGE -d ~/godot-linux
          mv ~/godot-linux/$GODOT_BIN ~/godot-linux/godot
          chmod +x ~/godot-linux/godot
          rm ~/godot-linux/$GODOT_PACKAGE

          echo "Godot installed to ~/godot-linux/godot"

      - name: Setup virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Import Godot project
        run: |
          cd $GITHUB_WORKSPACE/scene
          timeout 60s ~/godot-linux/godot --headless --path . --import --quit || {
            echo "Import completed (exit code/timeout is normal)"
          }

          if [ -f ".godot/global_script_class_cache.cfg" ]; then
            echo "✓ Project import successful"
          else
            echo "⚠ No class registry generated (may be expected if no scripts)"
          fi
        timeout-minutes: 2

      - name: Validate project
        run: |
          echo "✓ Project structure validated"
          ls -la scene/
          echo "✓ Build job complete"

  tutorial-tests:
    name: Tutorial Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-linux
          key: ${{ runner.os }}-godot-4.5-stable
          restore-keys: |
            ${{ runner.os }}-godot-4.5-

      - name: Download Godot (prebuilt binary)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-linux
          chmod 770 ~/godot-linux
          mkdir -p ~/.config/godot
          chmod 770 ~/.config/godot

          DOWNLOAD_URL="https://github.com/godotengine/godot/releases/download/4.5-stable"
          GODOT_BIN="Godot_v4.5-stable_linux.x86_64"
          GODOT_PACKAGE="$GODOT_BIN.zip"

          echo "⬇️  Downloading prebuilt Godot 4.5 binary (skipping build)..."
          wget $DOWNLOAD_URL/$GODOT_PACKAGE -P ~/godot-linux
          unzip ~/godot-linux/$GODOT_PACKAGE -d ~/godot-linux
          mv ~/godot-linux/$GODOT_BIN ~/godot-linux/godot
          chmod +x ~/godot-linux/godot
          rm ~/godot-linux/$GODOT_PACKAGE

          echo "✅ Godot installed to ~/godot-linux/godot"

      - name: Verify Godot installation
        run: |
          ~/godot-linux/godot --version
          echo "✅ Godot ready for testing"

      - name: Run Tutorial Tests
        run: |
          echo "🧪 Tutorial Tests"
          cd $GITHUB_WORKSPACE/scene
          ~/godot-linux/godot --headless --path . --script res://tests/run_tutorial_tests.gd 2>&1 | tee tutorial_test_output.log
          exit ${PIPESTATUS[0]}

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-tutorial-test-output
          path: |
            scene/tutorial_test_output.log
          retention-days: 7


  sync-tests:
    name: Sync Bridge Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-linux
          key: ${{ runner.os }}-godot-4.5-stable
          restore-keys: |
            ${{ runner.os }}-godot-4.5-

      - name: Download Godot (prebuilt binary)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-linux
          chmod 770 ~/godot-linux
          mkdir -p ~/.config/godot
          chmod 770 ~/.config/godot

          DOWNLOAD_URL="https://github.com/godotengine/godot/releases/download/4.5-stable"
          GODOT_BIN="Godot_v4.5-stable_linux.x86_64"
          GODOT_PACKAGE="$GODOT_BIN.zip"

          echo "⬇️  Downloading prebuilt Godot 4.5 binary (skipping build)..."
          wget $DOWNLOAD_URL/$GODOT_PACKAGE -P ~/godot-linux
          unzip ~/godot-linux/$GODOT_PACKAGE -d ~/godot-linux
          mv ~/godot-linux/$GODOT_BIN ~/godot-linux/godot
          chmod +x ~/godot-linux/godot
          rm ~/godot-linux/$GODOT_PACKAGE

          echo "✅ Godot installed to ~/godot-linux/godot"

      - name: Verify Godot installation
        run: |
          ~/godot-linux/godot --version
          echo "✅ Godot ready for testing"

      - name: Run Sync Tests
        run: |
          echo "🧪 Sync Bridge Tests"
          cd $GITHUB_WORKSPACE/scene
          ~/godot-linux/godot --headless --path . --script res://tests/run_sync_tests.gd 2>&1 | tee sync_test_output.log
          exit ${PIPESTATUS[0]}

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-sync-test-output
          path: |
            scene/sync_test_output.log
          retention-days: 7


  js-sync-tests:
    name: JS Sync State Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Jest (syncState)
        run: npm test -- syncState


