      - name: Verify Godot installation
        run: |
          ~/godot-linux/godot --version
          echo "✅ Godot ready for testing"

      - name: Run Supabase Integration Tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: |
          echo "🧪 Supabase Integration Tests"
          cd $GITHUB_WORKSPACE/scene
          ~/godot-linux/godot --headless --path . --script res://tests/SupabaseTestRunner.gd 2>&1 | tee supabase_test_output.log
          exit ${PIPESTATUS[0]}

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-supabase-test-output
          path: |
            scene/supabase_test_output.log
