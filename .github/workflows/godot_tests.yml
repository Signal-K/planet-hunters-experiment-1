  test-summary:
    name: Test Summary & Report
    runs-on: ubuntu-latest
    needs: [build-project, tutorial-tests, experience-tests, supabase-tests]
    if: always()
    steps:
      - name: Generate detailed test report
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 GODOT TEST REPORT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Workflow Information:"
          echo "  • Trigger: ${{ github.event_name }}"
          echo "  • Branch: ${{ github.ref_name }}"
          echo "  • Commit: ${{ github.sha }}"
          echo "  • Author: ${{ github.actor }}"
          echo "  • Run ID: ${{ github.run_id }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Job Results:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""

          if [ "${{ needs.build-project.result }}" = "success" ]; then
            echo "✅ Build Project: PASSED"
            echo "   → Project structure validated and imported successfully"
          else
            echo "❌ Build Project: FAILED"
            echo "   → Project failed to import or validate"
          fi
          echo ""

          if [ "${{ needs.tutorial-tests.result }}" = "success" ] && [ "${{ needs.experience-tests.result }}" = "success" ] && [ "${{ needs.supabase-tests.result }}" = "success" ]; then
            echo "✅ Godot Tests: PASSED"
            echo "   → Tutorial tests: ✓"
            echo "   → Experience tests: ✓"
            echo "   → Supabase integration tests: ✓"
          else
            echo "❌ Godot Tests: FAILED"
            echo "   → One or more Godot test suites failed"
            echo "   → Check logs for details"
          fi
          echo ""

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Performance Metrics:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  • Total runtime: ~5-10 minutes"
          echo "  • Optimization: Using prebuilt Godot binary (no source build)"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "${{ needs.build-project.result }}" != "success" ] || [ "${{ needs.tutorial-tests.result }}" != "success" ] || [ "${{ needs.experience-tests.result }}" != "success" ] || [ "${{ needs.supabase-tests.result }}" != "success" ]; then
            echo ""
            echo "⚠️  One or more jobs failed. Review the logs above for details."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            exit 1
          else
            echo ""
            echo "✅ All tests passed successfully!"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          fi
