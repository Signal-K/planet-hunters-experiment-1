          echo "✅ Godot ready for testing"

      - name: Run Experience Tests
        run: |
          echo "🧪 Experience Tests"
          cd $GITHUB_WORKSPACE/scene
          ~/godot-linux/godot --headless --path . --script res://tests/run_experience_tests.gd 2>&1 | tee experience_test_output.log
          exit ${PIPESTATUS[0]}

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-experience-test-output
