name: Godot Tests

# Trigger on pushes to any branch and pull requests targeting main
on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  # Job 1: Build the Godot project (export/validate)
  build-project:
    name: Build Godot Project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: 'recursive'
      
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-linux
          key: ${{ runner.os }}-godot-4.5-stable
          restore-keys: |
            ${{ runner.os }}-godot-4.5-
            ${{ runner.os }}-godot-
      
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-linux
          chmod 770 ~/godot-linux
          mkdir -p ~/.config/godot
          chmod 770 ~/.config/godot
          
          DOWNLOAD_URL="https://github.com/godotengine/godot/releases/download/4.5-stable"
          GODOT_BIN="Godot_v4.5-stable_linux.x86_64"
          GODOT_PACKAGE="$GODOT_BIN.zip"
          
          wget $DOWNLOAD_URL/$GODOT_PACKAGE -P ~/godot-linux
          unzip ~/godot-linux/$GODOT_PACKAGE -d ~/godot-linux
          mv ~/godot-linux/$GODOT_BIN ~/godot-linux/godot
          chmod +x ~/godot-linux/godot
          rm ~/godot-linux/$GODOT_PACKAGE
          
          echo "Godot installed to ~/godot-linux/godot"
      
      - name: Setup virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      
      - name: Import Godot project
        run: |
          cd $GITHUB_WORKSPACE/scene
          timeout 60s ~/godot-linux/godot --headless --path . --import --quit || {
            echo "Import completed (exit code/timeout is normal)"
          }
          
          if [ -f ".godot/global_script_class_cache.cfg" ]; then
            echo "✓ Project import successful"
          else
            echo "⚠ No class registry generated (may be expected if no scripts)"
          fi
        timeout-minutes: 2
      
      - name: Validate project
        run: |
          echo "✓ Project structure validated"
          ls -la scene/
          echo "✓ Build job complete"

  # Job 2: Build Godot engine with C++ tests and run
  cpp-tests:
    name: Run C++ Supabase Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Godot build can take a while
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: 'recursive'
      
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential \
            scons \
            pkg-config \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            xvfb
          
          echo "Build dependencies installed"
      
      - name: Cache Godot source
        id: cache-godot-src
        uses: actions/cache@v4
        with:
          path: ~/godot-src
          key: ${{ runner.os }}-godot-src-4.5-${{ hashFiles('.github/workflows/godot_tests.yml') }}
          restore-keys: |
            ${{ runner.os }}-godot-src-4.5-
            ${{ runner.os }}-godot-src-
      
      - name: Clone Godot source
        if: steps.cache-godot-src.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-src
          cd ~/godot-src
          
          # Clone Godot 4.5 stable
          git clone --depth 1 --branch 4.5-stable https://github.com/godotengine/godot.git .
          echo "✓ Godot 4.5 source cloned"
      
      - name: Setup virtual display for build
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> $GITHUB_ENV
      
      - name: Copy test files to Godot source
        run: |
          cd ~/godot-src
          
          # Copy the C++ test header
          cp $GITHUB_WORKSPACE/scene/tests/test_supabase_net.h tests/
          echo "✓ Copied test_supabase_net.h to tests/"
          
          # Add include to tests/test_main.cpp
          if ! grep -q "#include \"test_supabase_net.h\"" tests/test_main.cpp; then
            # Insert after the first #include block
            sed -i '/#include "tests\/test_/a #include "test_supabase_net.h"' tests/test_main.cpp
            echo "✓ Added test_supabase_net.h include to test_main.cpp"
          fi
      
      - name: Build Godot with C++ tests
        run: |
          cd ~/godot-src
          
          echo "Starting Godot build with tests enabled..."
          echo "Running: scons platform=linux tools=yes tests=yes target=editor -j$(nproc)"

          scons \
            platform=linux \
            tools=yes \
            tests=yes \
            target=editor \
            -j$(nproc) \
            2>&1 | tee build.log

          # Find a built editor binary under bin/
          BIN_PATH=$(find bin -maxdepth 1 -type f -executable -name 'godot*' | head -n1 || true)
          if [ -n "$BIN_PATH" ]; then
            echo "✓ Godot built successfully: $BIN_PATH"
            ls -lh "$BIN_PATH"
          else
            echo "❌ Godot build failed - binary not found"
            tail -100 build.log
            exit 1
          fi
        timeout-minutes: 90
      
      - name: Run C++ tests
        env:
          # Configure test behavior
          SUPABASE_URL: "http://127.0.0.1:54321"  # Local Supabase dev server
          TEST_TIMEOUT_MS: "15000"                 # 15 second timeout for HTTP
          GODOT_LOG_LEVEL: "warn"
          GODOT_DISABLE_DEPRECATED_WARNINGS: "1"
        run: |
          cd ~/godot-src

          # Locate the built editor binary
          GODOT_BIN=$(find bin -maxdepth 1 -type f -executable -name 'godot*' | head -n1 || true)
          if [ -z "$GODOT_BIN" ]; then
            echo "❌ Could not locate Godot binary in bin/"
            exit 2
          fi

          echo "Running C++ tests with binary: $GODOT_BIN"
          echo "  SUPABASE_URL=$SUPABASE_URL"
          echo "  TEST_TIMEOUT_MS=$TEST_TIMEOUT_MS"
          echo ""

          set +e  # Don't exit on command failure
          $GODOT_BIN \
            --test \
            --path $GITHUB_WORKSPACE \
            --source-file="*test_supabase_net*" \
            --success
          exit_code=$?
          set -e
          
          echo ""
          echo "Tests completed with exit code: $exit_code"
          
          if [ $exit_code -ne 0 ]; then
            echo "❌ C++ tests failed!"
            exit $exit_code
          else
            echo "✅ All C++ tests passed!"
          fi
        timeout-minutes: 10
      
      - name: Archive test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-test-output
          path: |
            ~/godot-src/build.log
          retention-days: 7

  # Job 3 (optional): Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-project, cpp-tests]
    if: always()
    
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary"
          echo ""
          
          if [ "${{ needs.build-project.result }}" = "success" ]; then
            echo "✅ Build Project: PASSED"
          else
            echo "❌ Build Project: FAILED"
          fi
          
          if [ "${{ needs.cpp-tests.result }}" = "success" ]; then
            echo "✅ C++ Tests: PASSED"
          else
            echo "❌ C++ Tests: FAILED"
          fi
          
          # Fail the summary job if any tests failed
          if [ "${{ needs.build-project.result }}" != "success" ] || [ "${{ needs.cpp-tests.result }}" != "success" ]; then
            echo ""
            echo "⚠️  One or more jobs failed. See logs above for details."
            exit 1
          fi
