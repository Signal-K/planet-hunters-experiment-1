  supabase-tests:
    name: Supabase Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-linux
          key: ${{ runner.os }}-godot-4.5-stable
          restore-keys: |
            ${{ runner.os }}-godot-4.5-

      - name: Download Godot (prebuilt binary)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-linux
          chmod 770 ~/godot-linux
          mkdir -p ~/.config/godot
          chmod 770 ~/.config/godot

