name: Landnam
options:
  bundleIdPrefix: tech.skinetics
  deploymentTarget: { macOS: "14.0", iOS: "17.0" }
packages:
  LandnamCore: { path: LandnamCore }
targets:
  Landnam:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
        excludes: ["Resources/Art/**"]
      - path: App/Resources/Art
        type: folder
        buildPhase: resources
    dependencies: [{ package: LandnamCore }]
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: tech.skinetics.landnam
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/Landnam.entitlements
  LandnamTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies: [{ target: Landnam }]
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: tech.skinetics.landnam.tests
schemes:
  Landnam:
    build: { targets: { Landnam: all, LandnamTests: [test] } }
    test: { targets: [LandnamTests] }
