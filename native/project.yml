name: Landnam
options:
  bundleIdPrefix: tech.skinetics
  deploymentTarget: { macOS: "14.0", iOS: "17.0" }
packages:
  LandnamCore: { path: LandnamCore }
targets:
  Landnam:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [App]
    dependencies: [{ package: LandnamCore }]
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: tech.skinetics.landnam
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
